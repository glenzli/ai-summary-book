<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="560" viewBox="0 0 1040 560">
<rect width="100%" height="100%" fill="#ffffff"/>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#444"/></marker></defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif;fill:#222}.title{font-size:21px;font-weight:700}.small{font-size:14px}.tiny{font-size:12px;fill:#555}.label{font-size:13px;font-weight:700;fill:#333}</style>
<text x="520" y="34" text-anchor="middle" class="title">Post-training map: SFT, RLHF/PPO, and DPO</text>
<rect x="70" y="82" width="160" height="66" rx="8" fill="#F5F5F5" stroke="#666666" stroke-width="1.8"/>
<text x="150.0" y="112.0" text-anchor="middle" class="small">Base model</text>
<text x="150.0" y="128.0" text-anchor="middle" class="small">next-token pretraining</text>
<rect x="290" y="82" width="160" height="66" rx="8" fill="#DAE8FC" stroke="#6C8EBF" stroke-width="1.8"/>
<text x="370.0" y="112.0" text-anchor="middle" class="small">SFT model</text>
<text x="370.0" y="128.0" text-anchor="middle" class="small">instruction following</text>
<rect x="510" y="82" width="160" height="66" rx="8" fill="#FFF2CC" stroke="#D6B656" stroke-width="1.8"/>
<text x="590.0" y="112.0" text-anchor="middle" class="small">Candidate responses</text>
<text x="590.0" y="128.0" text-anchor="middle" class="small">for same prompt</text>
<rect x="730" y="82" width="160" height="66" rx="8" fill="#FFF2CC" stroke="#D6B656" stroke-width="1.8"/>
<text x="810.0" y="112.0" text-anchor="middle" class="small">Human preference</text>
<text x="810.0" y="128.0" text-anchor="middle" class="small">y_w > y_l</text>
<line x1="230" y1="115" x2="290" y2="115" stroke="#444" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="260.0" y="107.0" text-anchor="middle" class="tiny">SFT data</text>
<line x1="450" y1="115" x2="510" y2="115" stroke="#444" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="480.0" y="107.0" text-anchor="middle" class="tiny">sample</text>
<line x1="670" y1="115" x2="730" y2="115" stroke="#444" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="700.0" y="107.0" text-anchor="middle" class="tiny">rank</text>
<text x="520" y="196" text-anchor="middle" class="label">Two common optimization routes</text>
<rect x="170" y="245" width="170" height="66" rx="8" fill="#E1D5E7" stroke="#9673A6" stroke-width="1.8"/>
<text x="255.0" y="275.0" text-anchor="middle" class="small">Reward model</text>
<text x="255.0" y="291.0" text-anchor="middle" class="small">learn r(x,y)</text>
<rect x="170" y="370" width="170" height="66" rx="8" fill="#F8CECC" stroke="#B85450" stroke-width="1.8"/>
<text x="255.0" y="400.0" text-anchor="middle" class="small">PPO update</text>
<text x="255.0" y="416.0" text-anchor="middle" class="small">reward - KL</text>
<rect x="430" y="370" width="170" height="66" rx="8" fill="#D5E8D4" stroke="#82B366" stroke-width="1.8"/>
<text x="515.0" y="400.0" text-anchor="middle" class="small">Aligned model</text>
<text x="515.0" y="416.0" text-anchor="middle" class="small">policy output</text>
<rect x="700" y="245" width="170" height="66" rx="8" fill="#E1D5E7" stroke="#9673A6" stroke-width="1.8"/>
<text x="785.0" y="275.0" text-anchor="middle" class="small">DPO objective</text>
<text x="785.0" y="291.0" text-anchor="middle" class="small">direct preference loss</text>
<rect x="700" y="370" width="170" height="66" rx="8" fill="#D5E8D4" stroke="#82B366" stroke-width="1.8"/>
<text x="785.0" y="400.0" text-anchor="middle" class="small">Aligned model</text>
<text x="785.0" y="416.0" text-anchor="middle" class="small">policy output</text>
<line x1="730" y1="148" x2="255" y2="245" stroke="#444" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="492.5" y="188.5" text-anchor="middle" class="tiny">preference pairs</text>
<line x1="255" y1="311" x2="255" y2="370" stroke="#444" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="255.0" y="332.5" text-anchor="middle" class="tiny">score</text>
<line x1="340" y1="403" x2="430" y2="403" stroke="#444" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="385.0" y="395.0" text-anchor="middle" class="tiny">update</text>
<line x1="730" y1="148" x2="785" y2="245" stroke="#444" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="757.5" y="188.5" text-anchor="middle" class="tiny">preference pairs</text>
<line x1="785" y1="311" x2="785" y2="370" stroke="#444" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="785.0" y="332.5" text-anchor="middle" class="tiny">optimize</text>
<path d="M290 403 C335 340 385 300 450 148" fill="none" stroke="#444" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<text x="377" y="288" text-anchor="middle" class="tiny">KL anchor to SFT</text>
<path d="M700 403 C642 330 620 260 450 148" fill="none" stroke="#444" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<text x="613" y="302" text-anchor="middle" class="tiny">reference policy</text>
<text x="260" y="476" text-anchor="middle" class="small">RLHF/PPO: train a reward model, then optimize the policy against reward plus KL.</text>
<text x="785" y="476" text-anchor="middle" class="small">DPO: optimize the policy directly from preferred vs rejected responses.</text>
<text x="520" y="524" text-anchor="middle" class="tiny">Both routes use preference data; both need anchors, safety data, evaluation, and monitoring.</text>
</svg>