<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">原理图：火箭为什么要向下喷气？</title>
  <desc id="desc">火箭把高速气体向后喷出；火箭受到大小相等、方向相反的推力。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#293451"/></marker>
  </defs>
  <rect width="1200" height="680" fill="#f1f2fb"/>
  <path d="M0,615 Q260,560 520,615 T1040,615 T1300,615 V680 H0 Z" fill="#5268ad" opacity="0.09"/>
  <text x="65" y="64" fill="#293451" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="30" font-weight="750">方向与受力图</text>
  <text x="1135" y="64" text-anchor="end" fill="#293451" opacity="0.72" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="21">示意图 · 不按比例</text>
  <rect x="425.0" y="180.0" width="350" height="300" rx="8" fill="#ffffff" stroke="#293451" stroke-width="2.5"/><path d="M600,205.0 C544.2,260.8 550.5,335.5 600,371.5 C649.5,335.5 655.8,260.8 600,205.0 Z" fill="#f1f2fb" stroke="#293451" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="600" cy="281.5" r="21.6" fill="#5268ad" stroke="#293451" stroke-width="2.7"/><polygon points="578.4,365.2 600,416.5 621.6,365.2" fill="#d48b49" stroke="none" stroke-width="0" stroke-linejoin="round"/><text x="600" y="435" text-anchor="middle" fill="#293451" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="26" font-weight="650"><tspan x="600" dy="0">火箭与发动机</tspan></text><line x1="520" y1="245" x2="520" y2="115" stroke="#5268ad" stroke-width="10" stroke-linecap="round" marker-end="url(#arrow)"/><text x="500" y="88" text-anchor="middle" fill="#293451" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="25" font-weight="650"><tspan x="500" dy="0">推力让火箭向前</tspan></text><line x1="680" y1="415" x2="680" y2="545" stroke="#d48b49" stroke-width="10" stroke-linecap="round" marker-end="url(#arrow)"/><text x="700" y="585" text-anchor="middle" fill="#293451" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="25" font-weight="650"><tspan x="700" dy="0">高速气体向后喷</tspan></text><rect x="80" y="215" width="215" height="225" rx="8" fill="#f1f2fb" stroke="#293451" stroke-width="2.5"/><text x="187" y="280" text-anchor="middle" fill="#293451" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="24" font-weight="600"><tspan x="187" dy="0">箭头表示力</tspan><tspan x="187" dy="32">或运动方向</tspan></text><path d="M135,385 H240" fill="none" stroke="#5268ad" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <rect x="12" y="12" width="1176" height="656" rx="8" fill="none" stroke="#293451" stroke-width="3" opacity="0.22"/>
</svg>
