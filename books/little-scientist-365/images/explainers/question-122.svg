<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">原理图：鸟为什么能飞起来？</title>
  <desc id="desc">鸟翼改变周围空气的速度和方向，空气对翅膀产生向上的合力。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#3b2f51"/></marker>
  </defs>
  <rect width="1200" height="680" fill="#f7f1fb"/>
  <path d="M0,615 Q260,560 520,615 T1040,615 T1300,615 V680 H0 Z" fill="#7b5da7" opacity="0.09"/>
  <text x="65" y="64" fill="#3b2f51" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="30" font-weight="750">方向与受力图</text>
  <text x="1135" y="64" text-anchor="end" fill="#3b2f51" opacity="0.72" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="21">示意图 · 不按比例</text>
  <rect x="425.0" y="180.0" width="350" height="300" rx="8" fill="#ffffff" stroke="#3b2f51" stroke-width="2.5"/><path d="M532.5,353.5 Q568.5,218.5 667.5,232.0 Q622.5,335.5 532.5,353.5 Z" fill="#f7f1fb" stroke="#3b2f51" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/><line x1="544.2" y1="342.7" x2="654.0" y2="242.8" stroke="#7b5da7" stroke-width="5.4" stroke-linecap="round"/><line x1="568.5" y1="317.5" x2="535.2" y2="290.5" stroke="#d96b67" stroke-width="2.7" stroke-linecap="round"/><line x1="584.7" y1="302.2" x2="546.0" y2="277.9" stroke="#d96b67" stroke-width="2.7" stroke-linecap="round"/><line x1="600.9" y1="286.9" x2="556.8000000000001" y2="265.3" stroke="#d96b67" stroke-width="2.7" stroke-linecap="round"/><line x1="617.1" y1="271.6" x2="567.6" y2="252.7" stroke="#d96b67" stroke-width="2.7" stroke-linecap="round"/><line x1="633.3" y1="256.3" x2="578.4000000000001" y2="240.1" stroke="#d96b67" stroke-width="2.7" stroke-linecap="round"/><text x="600" y="435" text-anchor="middle" fill="#3b2f51" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="26" font-weight="650"><tspan x="600" dy="0">有弧度和角</tspan><tspan x="600" dy="34">度的翅膀</tspan></text><line x1="520" y1="245" x2="520" y2="115" stroke="#7b5da7" stroke-width="10" stroke-linecap="round" marker-end="url(#arrow)"/><text x="500" y="88" text-anchor="middle" fill="#3b2f51" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="25" font-weight="650"><tspan x="500" dy="0">空气给翅膀</tspan><tspan x="500" dy="33">向上合力</tspan></text><line x1="680" y1="415" x2="680" y2="545" stroke="#d96b67" stroke-width="10" stroke-linecap="round" marker-end="url(#arrow)"/><text x="700" y="585" text-anchor="middle" fill="#3b2f51" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="25" font-weight="650"><tspan x="700" dy="0">翅膀把空气</tspan><tspan x="700" dy="33">推向下方</tspan></text><rect x="80" y="215" width="215" height="225" rx="8" fill="#f7f1fb" stroke="#3b2f51" stroke-width="2.5"/><text x="187" y="280" text-anchor="middle" fill="#3b2f51" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="24" font-weight="600"><tspan x="187" dy="0">箭头表示力</tspan><tspan x="187" dy="32">或运动方向</tspan></text><path d="M135,385 H240" fill="none" stroke="#7b5da7" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <rect x="12" y="12" width="1176" height="656" rx="8" fill="none" stroke="#3b2f51" stroke-width="3" opacity="0.22"/>
</svg>
