<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">原理图：斜坡为什么比直着抬省力？</title>
  <desc id="desc">斜坡把同样高度的提升分散到更长距离，所以通常需要较小的沿坡力。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#4b342d"/></marker>
  </defs>
  <rect width="1200" height="680" fill="#fff5ea"/>
  <path d="M0,615 Q260,560 520,615 T1040,615 T1300,615 V680 H0 Z" fill="#cf663f" opacity="0.09"/>
  <text x="65" y="64" fill="#4b342d" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="30" font-weight="750">比较图</text>
  <text x="1135" y="64" text-anchor="end" fill="#4b342d" opacity="0.72" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="21">示意图 · 不按比例</text>
  <rect x="170.0" y="137.5" width="360" height="395" rx="8" fill="#ffffff" stroke="#4b342d" stroke-width="2.5"/><polygon points="269.0,363.0 431.0,363.0 431.0,214.5" fill="#fff5ea" stroke="#4b342d" stroke-width="4.5" stroke-linejoin="round"/><circle cx="381.5" cy="295.5" r="24.3" fill="#397e8d" stroke="#4b342d" stroke-width="3.6"/><text x="350" y="440" text-anchor="middle" fill="#4b342d" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="26" font-weight="650"><tspan x="350" dy="0">直抬：距离</tspan><tspan x="350" dy="34">短、力较大</tspan></text><rect x="670.0" y="137.5" width="360" height="395" rx="8" fill="#ffffff" stroke="#4b342d" stroke-width="2.5"/><polygon points="769.0,363.0 931.0,363.0 931.0,241.5" fill="#fff5ea" stroke="#4b342d" stroke-width="4.5" stroke-linejoin="round"/><circle cx="881.5" cy="295.5" r="24.3" fill="#397e8d" stroke="#4b342d" stroke-width="3.6"/><text x="850" y="440" text-anchor="middle" fill="#4b342d" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="26" font-weight="650"><tspan x="850" dy="0">斜坡：距离</tspan><tspan x="850" dy="34">长、力较小</tspan></text><line x1="600.0" y1="170" x2="600.0" y2="500" stroke="#4b342d" stroke-width="3" stroke-linecap="round" stroke-dasharray="10 12"/><text x="600" y="570" text-anchor="middle" fill="#4b342d" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="500"><tspan x="600" dy="0">并排比较：结构或</tspan><tspan x="600" dy="31">条件不同，结果也会不同</tspan></text>
  <rect x="12" y="12" width="1176" height="656" rx="8" fill="none" stroke="#4b342d" stroke-width="3" opacity="0.22"/>
</svg>
