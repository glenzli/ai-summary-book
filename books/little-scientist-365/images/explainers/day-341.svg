    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#2b463b"/></marker>
  </defs>
  <rect width="1200" height="680" fill="#f1f7f3"/>
  <path d="M0,615 Q260,560 520,615 T1040,615 T1300,615 V680 H0 Z" fill="#3c7c63" opacity="0.09"/>
  <text x="65" y="64" fill="#2b463b" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="30" font-weight="750">过程图</text>
  <text x="1135" y="64" text-anchor="end" fill="#2b463b" opacity="0.72" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="21">示意图 · 不按比例</text>
  <rect x="77.5" y="140.0" width="265" height="390" rx="8" fill="#ffffff" stroke="#2b463b" stroke-width="2.5"/><circle cx="210" cy="319.5" r="45.24" fill="#2b463b" stroke="none" stroke-width="0"/><circle cx="210" cy="319.5" r="20.28" fill="#dc7655" stroke="none" stroke-width="0"/><line x1="128.1" y1="368.64" x2="291.9" y2="368.64" stroke="#2b463b" stroke-width="9.36" stroke-linecap="round"/><text x="210" y="440" text-anchor="middle" fill="#2b463b" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="26" font-weight="650"><tspan x="210" dy="0">钢轮在钢轨上滚动</tspan></text><rect x="467.5" y="140.0" width="265" height="390" rx="8" fill="#ffffff" stroke="#2b463b" stroke-width="2.5"/><path d="M522.0,319.5 Q588.3,239.16 666.3,293.76" fill="none" stroke="#3c7c63" stroke-width="8.58" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><circle cx="543.84" cy="314.04" r="18.72" fill="#dc7655" stroke="#2b463b" stroke-width="3.12"/><text x="600" y="440" text-anchor="middle" fill="#2b463b" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="26" font-weight="650"><tspan x="600" dy="0">滚动阻力较小</tspan></text><rect x="857.5" y="140.0" width="265" height="390" rx="8" fill="#ffffff" stroke="#2b463b" stroke-width="2.5"/><circle cx="990" cy="319.5" r="45.24" fill="#2b463b" stroke="none" stroke-width="0"/><circle cx="990" cy="319.5" r="20.28" fill="#dc7655" stroke="none" stroke-width="0"/><line x1="908.1" y1="368.64" x2="1071.9" y2="368.64" stroke="#2b463b" stroke-width="9.36" stroke-linecap="round"/><text x="990" y="440" text-anchor="middle" fill="#2b463b" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="26" font-weight="650"><tspan x="990" dy="0">轮面和轮缘</tspan><tspan x="990" dy="34">帮助导向</tspan></text><line x1="352" y1="335" x2="452" y2="335" stroke="#3c7c63" stroke-width="9" stroke-linecap="round" marker-end="url(#arrow)"/><line x1="742" y1="335" x2="842" y2="335" stroke="#dc7655" stroke-width="9" stroke-linecap="round" marker-end="url(#arrow)"/>
