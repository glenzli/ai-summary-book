<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">原理图：安全带为什么能保护人？</title>
  <desc id="desc">急停时身体因惯性继续向前；安全带延长减速时间，并把力分散到较强部位。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#2b463b"/></marker>
  </defs>
  <rect width="1200" height="680" fill="#f1f7f3"/>
  <path d="M0,615 Q260,560 520,615 T1040,615 T1300,615 V680 H0 Z" fill="#3c7c63" opacity="0.09"/>
  <text x="65" y="64" fill="#2b463b" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="30" font-weight="750">比较图</text>
  <text x="1135" y="64" text-anchor="end" fill="#2b463b" opacity="0.72" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="21">示意图 · 不按比例</text>
  <rect x="170.0" y="137.5" width="360" height="395" rx="8" fill="#ffffff" stroke="#2b463b" stroke-width="2.5"/><circle cx="350" cy="247.8" r="27.0" fill="#dc7655" stroke="#2b463b" stroke-width="3.6"/><line x1="350" y1="277.5" x2="350" y2="343.2" stroke="#2b463b" stroke-width="9.0" stroke-linecap="round"/><line x1="350" y1="300" x2="303.2" y2="327.0" stroke="#3c7c63" stroke-width="8.1" stroke-linecap="round"/><line x1="350" y1="300" x2="396.8" y2="322.5" stroke="#3c7c63" stroke-width="8.1" stroke-linecap="round"/><line x1="350" y1="343.2" x2="312.2" y2="390.0" stroke="#2b463b" stroke-width="9.0" stroke-linecap="round"/><line x1="350" y1="343.2" x2="393.2" y2="385.5" stroke="#2b463b" stroke-width="9.0" stroke-linecap="round"/><text x="350" y="440" text-anchor="middle" fill="#2b463b" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="26" font-weight="650"><tspan x="350" dy="0">没有约束：身</tspan><tspan x="350" dy="34">体继续前冲</tspan></text><rect x="670.0" y="137.5" width="360" height="395" rx="8" fill="#ffffff" stroke="#2b463b" stroke-width="2.5"/><circle cx="850" cy="247.8" r="27.0" fill="#dc7655" stroke="#2b463b" stroke-width="3.6"/><line x1="850" y1="277.5" x2="850" y2="343.2" stroke="#2b463b" stroke-width="9.0" stroke-linecap="round"/><line x1="850" y1="300" x2="803.2" y2="327.0" stroke="#3c7c63" stroke-width="8.1" stroke-linecap="round"/><line x1="850" y1="300" x2="896.8" y2="322.5" stroke="#3c7c63" stroke-width="8.1" stroke-linecap="round"/><line x1="850" y1="343.2" x2="812.2" y2="390.0" stroke="#2b463b" stroke-width="9.0" stroke-linecap="round"/><line x1="850" y1="343.2" x2="893.2" y2="385.5" stroke="#2b463b" stroke-width="9.0" stroke-linecap="round"/><line x1="824.8" y1="269.4" x2="890.5" y2="355.8" stroke="#dc7655" stroke-width="9.9" stroke-linecap="round"/><text x="850" y="440" text-anchor="middle" fill="#2b463b" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="26" font-weight="650"><tspan x="850" dy="0">安全带：较缓</tspan><tspan x="850" dy="34">地减速并分力</tspan></text><line x1="600.0" y1="170" x2="600.0" y2="500" stroke="#2b463b" stroke-width="3" stroke-linecap="round" stroke-dasharray="10 12"/><text x="600" y="570" text-anchor="middle" fill="#2b463b" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="500"><tspan x="600" dy="0">并排比较：结构或</tspan><tspan x="600" dy="31">条件不同，结果也会不同</tspan></text>
