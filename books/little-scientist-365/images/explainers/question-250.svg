<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">原理图：海里越深为什么越黑？</title>
  <desc id="desc">海水会逐步吸收和散射阳光；不同颜色穿透不同，足够深处几乎全黑。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#244354"/></marker>
  </defs>
  <rect width="1200" height="680" fill="#edf7f8"/>
  <path d="M0,615 Q260,560 520,615 T1040,615 T1300,615 V680 H0 Z" fill="#217d92" opacity="0.09"/>
  <text x="65" y="64" fill="#244354" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="30" font-weight="750">结构图</text>
  <text x="1135" y="64" text-anchor="end" fill="#244354" opacity="0.72" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="21">示意图 · 不按比例</text>
  <ellipse cx="480" cy="335" rx="255" ry="190" fill="#edf7f8" stroke="#244354" stroke-width="4"/><ellipse cx="480" cy="335" rx="180" ry="132" fill="#ffffff" stroke="#217d92" stroke-width="4"/><ellipse cx="480" cy="335" rx="105" ry="78" fill="#edf7f8" stroke="#e07955" stroke-width="4"/><rect x="417.0" y="290.0" width="126.0" height="93.0" rx="3.0" fill="#217d92" stroke="#244354" stroke-width="3.0"/><line x1="438.0" y1="263.0" x2="459.0" y2="338.0" stroke="#df5b52" stroke-width="4.8" stroke-linecap="round" marker-end="url(#arrow)"/><line x1="465.0" y1="263.0" x2="474.0" y2="354.8" stroke="#edbd43" stroke-width="4.8" stroke-linecap="round" marker-end="url(#arrow)"/><line x1="492.0" y1="263.0" x2="489.0" y2="371.6" stroke="#4d80c4" stroke-width="4.8" stroke-linecap="round" marker-end="url(#arrow)"/><line x1="650" y1="250" x2="795" y2="190" stroke="#244354" stroke-width="4" stroke-linecap="round"/><text x="815" y="182" text-anchor="start" fill="#244354" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="25" font-weight="650"><tspan x="815" dy="0">阳光进入海面</tspan></text><line x1="590" y1="298" x2="795" y2="315" stroke="#217d92" stroke-width="4" stroke-linecap="round"/><text x="815" y="307" text-anchor="start" fill="#244354" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="25" font-weight="650"><tspan x="815" dy="0">红光先减弱</tspan><tspan x="815" dy="33">、蓝光较深</tspan></text><line x1="530" y1="346" x2="795" y2="440" stroke="#e07955" stroke-width="4" stroke-linecap="round"/><text x="815" y="432" text-anchor="start" fill="#244354" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="25" font-weight="650"><tspan x="815" dy="0">深处剩下很少光</tspan></text><text x="480" y="575" text-anchor="middle" fill="#244354" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="500"><tspan x="480" dy="0">由外到内或由</tspan><tspan x="480" dy="31">整体到细部</tspan></text>
  <rect x="12" y="12" width="1176" height="656" rx="8" fill="none" stroke="#244354" stroke-width="3" opacity="0.22"/>
</svg>
