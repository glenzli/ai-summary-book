<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">原理图：直升机为什么能停在空中？</title>
  <desc id="desc">旋翼像不断旋转的机翼，把大量空气加速向下，反作用力托起直升机。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#2b463b"/></marker>
  </defs>
  <rect width="1200" height="680" fill="#f1f7f3"/>
  <path d="M0,615 Q260,560 520,615 T1040,615 T1300,615 V680 H0 Z" fill="#3c7c63" opacity="0.09"/>
  <text x="65" y="64" fill="#2b463b" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="30" font-weight="750">方向与受力图</text>
  <text x="1135" y="64" text-anchor="end" fill="#2b463b" opacity="0.72" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="21">示意图 · 不按比例</text>
  <rect x="425.0" y="180.0" width="350" height="300" rx="8" fill="#ffffff" stroke="#2b463b" stroke-width="2.5"/><path d="M510.0,313.0 Q591.0,236.5 690.0,295 Q600,335.5 510.0,313.0 Z" fill="#f1f7f3" stroke="#2b463b" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/><line x1="496.5" y1="295" x2="703.5" y2="295" stroke="#3c7c63" stroke-width="7.2" stroke-linecap="round"/><text x="600" y="435" text-anchor="middle" fill="#2b463b" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="26" font-weight="650"><tspan x="600" dy="0">高速旋转的旋翼</tspan></text><line x1="520" y1="245" x2="520" y2="115" stroke="#3c7c63" stroke-width="10" stroke-linecap="round" marker-end="url(#arrow)"/><text x="500" y="88" text-anchor="middle" fill="#2b463b" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="25" font-weight="650"><tspan x="500" dy="0">空气给旋翼</tspan><tspan x="500" dy="33">向上作用力</tspan></text><line x1="680" y1="415" x2="680" y2="545" stroke="#dc7655" stroke-width="10" stroke-linecap="round" marker-end="url(#arrow)"/><text x="700" y="585" text-anchor="middle" fill="#2b463b" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="25" font-weight="650"><tspan x="700" dy="0">旋翼把空气推向下</tspan></text><rect x="80" y="215" width="215" height="225" rx="8" fill="#f1f7f3" stroke="#2b463b" stroke-width="2.5"/><text x="187" y="280" text-anchor="middle" fill="#2b463b" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="24" font-weight="600"><tspan x="187" dy="0">箭头表示力</tspan><tspan x="187" dy="32">或运动方向</tspan></text><path d="M135,385 H240" fill="none" stroke="#3c7c63" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <rect x="12" y="12" width="1176" height="656" rx="8" fill="none" stroke="#2b463b" stroke-width="3" opacity="0.22"/>
</svg>
