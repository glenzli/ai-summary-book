<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">原理图：鱼怎么停在水中不上不下？</title>
  <desc id="desc">鱼改变鳔内气体体积来调节平均密度，使浮力接近自身重量。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#3b2f51"/></marker>
  </defs>
  <rect width="1200" height="680" fill="#f7f1fb"/>
  <path d="M0,615 Q260,560 520,615 T1040,615 T1300,615 V680 H0 Z" fill="#7b5da7" opacity="0.09"/>
  <text x="65" y="64" fill="#3b2f51" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="30" font-weight="750">方向与受力图</text>
  <text x="1135" y="64" text-anchor="end" fill="#3b2f51" opacity="0.72" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="21">示意图 · 不按比例</text>
  <rect x="425.0" y="180.0" width="350" height="300" rx="8" fill="#ffffff" stroke="#3b2f51" stroke-width="2.5"/><ellipse cx="600" cy="295" rx="70.2" ry="43.2" fill="#7b5da7" stroke="#3b2f51" stroke-width="4.5"/><polygon points="532.5,295 487.5,248.2 487.5,341.8" fill="#d96b67" stroke="#3b2f51" stroke-width="3.6" stroke-linejoin="round"/><circle cx="640.5" cy="284.2" r="7.2" fill="#3b2f51" stroke="none" stroke-width="0"/><ellipse cx="600" cy="299.5" rx="29.7" ry="14.4" fill="#f7f1fb" stroke="#3b2f51" stroke-width="2.7"/><text x="600" y="435" text-anchor="middle" fill="#3b2f51" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="26" font-weight="650"><tspan x="600" dy="0">鱼体内的鳔</tspan></text><line x1="520" y1="245" x2="520" y2="115" stroke="#7b5da7" stroke-width="10" stroke-linecap="round" marker-end="url(#arrow)"/><text x="500" y="88" text-anchor="middle" fill="#3b2f51" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="25" font-weight="650"><tspan x="500" dy="0">排水产生浮力</tspan></text><line x1="680" y1="415" x2="680" y2="545" stroke="#d96b67" stroke-width="10" stroke-linecap="round" marker-end="url(#arrow)"/><text x="700" y="585" text-anchor="middle" fill="#3b2f51" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="25" font-weight="650"><tspan x="700" dy="0">鱼的重量向下</tspan></text><rect x="80" y="215" width="215" height="225" rx="8" fill="#f7f1fb" stroke="#3b2f51" stroke-width="2.5"/><text x="187" y="280" text-anchor="middle" fill="#3b2f51" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="24" font-weight="600"><tspan x="187" dy="0">箭头表示力</tspan><tspan x="187" dy="32">或运动方向</tspan></text><path d="M135,385 H240" fill="none" stroke="#7b5da7" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <rect x="12" y="12" width="1176" height="656" rx="8" fill="none" stroke="#3b2f51" stroke-width="3" opacity="0.22"/>
</svg>
