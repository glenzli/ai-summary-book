<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">原理图：树干里的圆圈是什么？</title>
  <desc id="desc">形成层每年增加新组织；生长快慢不同会留下可辨认的年轮。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#28452d"/></marker>
  </defs>
  <rect width="1200" height="680" fill="#f3f8ea"/>
  <path d="M0,615 Q260,560 520,615 T1040,615 T1300,615 V680 H0 Z" fill="#4c8a4b" opacity="0.09"/>
  <text x="65" y="64" fill="#28452d" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="30" font-weight="750">结构图</text>
  <text x="1135" y="64" text-anchor="end" fill="#28452d" opacity="0.72" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="21">示意图 · 不按比例</text>
  <ellipse cx="480" cy="335" rx="255" ry="190" fill="#f3f8ea" stroke="#28452d" stroke-width="4"/><ellipse cx="480" cy="335" rx="180" ry="132" fill="#ffffff" stroke="#4c8a4b" stroke-width="4"/><ellipse cx="480" cy="335" rx="105" ry="78" fill="#f3f8ea" stroke="#d9a63c" stroke-width="4"/><circle cx="480" cy="335" r="48.0" fill="#d9a63c" stroke="#28452d" stroke-width="3.0"/><circle cx="480" cy="335" r="12.0" fill="none" stroke="#4c8a4b" stroke-width="2.4"/><circle cx="480" cy="335" r="24.0" fill="none" stroke="#4c8a4b" stroke-width="2.4"/><circle cx="480" cy="335" r="36.0" fill="none" stroke="#4c8a4b" stroke-width="2.4"/><line x1="650" y1="250" x2="795" y2="190" stroke="#28452d" stroke-width="4" stroke-linecap="round"/><text x="815" y="182" text-anchor="start" fill="#28452d" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="25" font-weight="650"><tspan x="815" dy="0">树干横切面</tspan></text><line x1="590" y1="298" x2="795" y2="315" stroke="#4c8a4b" stroke-width="4" stroke-linecap="round"/><text x="815" y="307" text-anchor="start" fill="#28452d" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="25" font-weight="650"><tspan x="815" dy="0">每年增加的新组织</tspan></text><line x1="530" y1="346" x2="795" y2="440" stroke="#d9a63c" stroke-width="4" stroke-linecap="round"/><text x="815" y="432" text-anchor="start" fill="#28452d" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="25" font-weight="650"><tspan x="815" dy="0">不同年份留下圆环</tspan></text><text x="480" y="575" text-anchor="middle" fill="#28452d" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="500"><tspan x="480" dy="0">由外到内或由</tspan><tspan x="480" dy="31">整体到细部</tspan></text>
  <rect x="12" y="12" width="1176" height="656" rx="8" fill="none" stroke="#28452d" stroke-width="3" opacity="0.22"/>
