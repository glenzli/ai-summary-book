<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">原理图：关节为什么能弯？</title>
  <desc id="desc">肩关节的球窝结构换来大活动范围；膝关节更像受引导的铰链。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#263e51"/></marker>
  </defs>
  <rect width="1200" height="680" fill="#f4f8f9"/>
  <path d="M0,615 Q260,560 520,615 T1040,615 T1300,615 V680 H0 Z" fill="#258097" opacity="0.09"/>
  <text x="65" y="64" fill="#263e51" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="30" font-weight="750">比较图</text>
  <text x="1135" y="64" text-anchor="end" fill="#263e51" opacity="0.72" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="21">示意图 · 不按比例</text>
  <rect x="170.0" y="137.5" width="360" height="395" rx="8" fill="#ffffff" stroke="#263e51" stroke-width="2.5"/><path d="M279.8,363.0 Q287.0,255.0 354.5,244.2" fill="none" stroke="#258097" stroke-width="28.8" stroke-linecap="round" stroke-linejoin="round"/><circle cx="354.5" cy="244.2" r="30.6" fill="#f4f8f9" stroke="#263e51" stroke-width="4.5"/><path d="M378.8,259.5 L420.2,352.2" fill="none" stroke="#e16b68" stroke-width="25.2" stroke-linecap="round" stroke-linejoin="round"/><text x="350" y="440" text-anchor="middle" fill="#263e51" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="26" font-weight="650"><tspan x="350" dy="0">肩：灵活的</tspan><tspan x="350" dy="34">球窝关节</tspan></text><rect x="670.0" y="137.5" width="360" height="395" rx="8" fill="#ffffff" stroke="#263e51" stroke-width="2.5"/><line x1="839.2" y1="214.5" x2="845.5" y2="289.2" stroke="#258097" stroke-width="27.0" stroke-linecap="round"/><circle cx="850" cy="300" r="7.2" fill="#f4f8f9" stroke="#263e51" stroke-width="4.5"/><line x1="854.5" y1="310.8" x2="890.5" y2="385.5" stroke="#e16b68" stroke-width="27.0" stroke-linecap="round"/><text x="850" y="440" text-anchor="middle" fill="#263e51" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="26" font-weight="650"><tspan x="850" dy="0">膝：较稳定</tspan><tspan x="850" dy="34">的铰链结构</tspan></text><line x1="600.0" y1="170" x2="600.0" y2="500" stroke="#263e51" stroke-width="3" stroke-linecap="round" stroke-dasharray="10 12"/><text x="600" y="570" text-anchor="middle" fill="#263e51" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="500"><tspan x="600" dy="0">并排比较：结构或</tspan><tspan x="600" dy="31">条件不同，结果也会不同</tspan></text>
