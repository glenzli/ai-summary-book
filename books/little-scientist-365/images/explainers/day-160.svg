<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">原理图：肺像两个气球吗？</title>
  <desc id="desc">气道不断分叉到肺泡；肺泡壁很薄，并紧贴毛细血管，便于气体扩散。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#263e51"/></marker>
  </defs>
  <rect width="1200" height="680" fill="#f4f8f9"/>
  <path d="M0,615 Q260,560 520,615 T1040,615 T1300,615 V680 H0 Z" fill="#258097" opacity="0.09"/>
  <text x="65" y="64" fill="#263e51" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="30" font-weight="750">结构图</text>
  <text x="1135" y="64" text-anchor="end" fill="#263e51" opacity="0.72" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="21">示意图 · 不按比例</text>
  <ellipse cx="480" cy="335" rx="255" ry="190" fill="#f4f8f9" stroke="#263e51" stroke-width="4"/><ellipse cx="480" cy="335" rx="180" ry="132" fill="#ffffff" stroke="#258097" stroke-width="4"/><ellipse cx="480" cy="335" rx="105" ry="78" fill="#f4f8f9" stroke="#e16b68" stroke-width="4"/><line x1="480" y1="287.0" x2="480" y2="329.0" stroke="#263e51" stroke-width="6.0" stroke-linecap="round"/><path d="M475.2,329.0 C459.0,299.0 417.0,318.2 424.8,374.0 C430.8,407.0 466.8,392.0 475.2,359.0 Z" fill="#258097" stroke="#263e51" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M484.8,329.0 C501.0,299.0 543.0,318.2 535.2,374.0 C529.2,407.0 493.2,392.0 484.8,359.0 Z" fill="#e16b68" stroke="#263e51" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><line x1="650" y1="250" x2="795" y2="190" stroke="#263e51" stroke-width="4" stroke-linecap="round"/><text x="815" y="182" text-anchor="start" fill="#263e51" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="25" font-weight="650"><tspan x="815" dy="0">不断分叉的气道</tspan></text><line x1="590" y1="298" x2="795" y2="315" stroke="#258097" stroke-width="4" stroke-linecap="round"/><text x="815" y="307" text-anchor="start" fill="#263e51" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="25" font-weight="650"><tspan x="815" dy="0">许多微小肺泡</tspan></text><line x1="530" y1="346" x2="795" y2="440" stroke="#e16b68" stroke-width="4" stroke-linecap="round"/><text x="815" y="432" text-anchor="start" fill="#263e51" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="25" font-weight="650"><tspan x="815" dy="0">氧和二氧化碳</tspan><tspan x="815" dy="33">跨薄壁交换</tspan></text><text x="480" y="575" text-anchor="middle" fill="#263e51" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="500"><tspan x="480" dy="0">由外到内或由</tspan><tspan x="480" dy="31">整体到细部</tspan></text>
