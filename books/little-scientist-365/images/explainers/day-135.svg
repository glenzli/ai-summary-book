<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">原理图：骆驼驼峰里装的是水吗？</title>
  <desc id="desc">驼峰主要储存脂肪；需要时脂肪可供能，代谢过程中也会产生少量水。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#3b2f51"/></marker>
  </defs>
  <rect width="1200" height="680" fill="#f7f1fb"/>
  <path d="M0,615 Q260,560 520,615 T1040,615 T1300,615 V680 H0 Z" fill="#7b5da7" opacity="0.09"/>
  <text x="65" y="64" fill="#3b2f51" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="30" font-weight="750">结构图</text>
  <text x="1135" y="64" text-anchor="end" fill="#3b2f51" opacity="0.72" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="21">示意图 · 不按比例</text>
