<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">原理图：地球另一边的人为什么不会掉下去？</title>
  <desc id="desc">无论站在地球哪一边，重力都大致指向地心，所以脚下都是当地的“下”。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#35402f"/></marker>
  </defs>
  <rect width="1200" height="680" fill="#f2f5ed"/>
  <path d="M0,615 Q260,560 520,615 T1040,615 T1300,615 V680 H0 Z" fill="#667d42" opacity="0.09"/>
  <text x="65" y="64" fill="#35402f" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="30" font-weight="750">方向与受力图</text>
  <text x="1135" y="64" text-anchor="end" fill="#35402f" opacity="0.72" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="21">示意图 · 不按比例</text>
  <rect x="425.0" y="180.0" width="350" height="300" rx="8" fill="#ffffff" stroke="#35402f" stroke-width="2.5"/><circle cx="600" cy="295" r="64.8" fill="#667d42" stroke="#35402f" stroke-width="4.5"/><path d="M553.2,263.5 Q586.5,232.0 607.2,266.2 L595.5,298.6 L555.0,305.8 Z M616.2,305.8 Q658.5,287.8 649.5,335.5 L610.8,347.2 Z" fill="#c47a45" stroke="#35402f" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"/><path d="M511.8,299.5 A88.2,73.8 0 1 1 682.8,272.5" fill="none" stroke="#c47a45" stroke-width="5.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="600" y="435" text-anchor="middle" fill="#35402f" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="26" font-weight="650"><tspan x="600" dy="0">站在球形地球各处</tspan></text><line x1="520" y1="245" x2="520" y2="115" stroke="#667d42" stroke-width="10" stroke-linecap="round" marker-end="url(#arrow)"/><text x="500" y="88" text-anchor="middle" fill="#35402f" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="25" font-weight="650"><tspan x="500" dy="0">地面支持身体</tspan></text><line x1="680" y1="415" x2="680" y2="545" stroke="#c47a45" stroke-width="10" stroke-linecap="round" marker-end="url(#arrow)"/><text x="700" y="585" text-anchor="middle" fill="#35402f" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="25" font-weight="650"><tspan x="700" dy="0">重力指向地心</tspan></text><rect x="80" y="215" width="215" height="225" rx="8" fill="#f2f5ed" stroke="#35402f" stroke-width="2.5"/><text x="187" y="280" text-anchor="middle" fill="#35402f" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="24" font-weight="600"><tspan x="187" dy="0">箭头表示力</tspan><tspan x="187" dy="32">或运动方向</tspan></text><path d="M135,385 H240" fill="none" stroke="#667d42" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <rect x="12" y="12" width="1176" height="656" rx="8" fill="none" stroke="#35402f" stroke-width="3" opacity="0.22"/>
</svg>
