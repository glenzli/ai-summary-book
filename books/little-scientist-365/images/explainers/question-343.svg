<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">原理图：钢做的大船为什么能浮？</title>
  <desc id="desc">空心船体排开大量水；排水产生的浮力等于船重时，大船便稳定漂浮。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#2b463b"/></marker>
  </defs>
  <rect width="1200" height="680" fill="#f1f7f3"/>
  <path d="M0,615 Q260,560 520,615 T1040,615 T1300,615 V680 H0 Z" fill="#3c7c63" opacity="0.09"/>
  <text x="65" y="64" fill="#2b463b" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="30" font-weight="750">方向与受力图</text>
  <text x="1135" y="64" text-anchor="end" fill="#2b463b" opacity="0.72" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="21">示意图 · 不按比例</text>
  <rect x="425.0" y="180.0" width="350" height="300" rx="8" fill="#ffffff" stroke="#2b463b" stroke-width="2.5"/><path d="M510.0,313.0 H690.0 L655.8,365.2 H541.5 Z" fill="#3c7c63" stroke="#2b463b" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/><text x="600" y="435" text-anchor="middle" fill="#2b463b" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="26" font-weight="650"><tspan x="600" dy="0">空心而宽大的船体</tspan></text><line x1="520" y1="245" x2="520" y2="115" stroke="#3c7c63" stroke-width="10" stroke-linecap="round" marker-end="url(#arrow)"/><text x="500" y="88" text-anchor="middle" fill="#2b463b" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="25" font-weight="650"><tspan x="500" dy="0">排开水产生浮力</tspan></text><line x1="680" y1="415" x2="680" y2="545" stroke="#dc7655" stroke-width="10" stroke-linecap="round" marker-end="url(#arrow)"/><text x="700" y="585" text-anchor="middle" fill="#2b463b" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="25" font-weight="650"><tspan x="700" dy="0">船和货物的重量</tspan></text><rect x="80" y="215" width="215" height="225" rx="8" fill="#f1f7f3" stroke="#2b463b" stroke-width="2.5"/><text x="187" y="280" text-anchor="middle" fill="#2b463b" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="24" font-weight="600"><tspan x="187" dy="0">箭头表示力</tspan><tspan x="187" dy="32">或运动方向</tspan></text><path d="M135,385 H240" fill="none" stroke="#3c7c63" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <rect x="12" y="12" width="1176" height="656" rx="8" fill="none" stroke="#2b463b" stroke-width="3" opacity="0.22"/>
</svg>
