  </defs>
  <rect width="1200" height="680" fill="#fbf5ed"/>
  <path d="M0,615 Q260,560 520,615 T1040,615 T1300,615 V680 H0 Z" fill="#a86a3d" opacity="0.09"/>
  <text x="65" y="64" fill="#49372c" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="30" font-weight="750">循环图</text>
  <text x="1135" y="64" text-anchor="end" fill="#49372c" opacity="0.72" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="21">示意图 · 不按比例</text>
