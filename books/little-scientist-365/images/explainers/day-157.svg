<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">原理图：肌肉怎样拉动骨头？</title>
  <desc id="desc">肌肉只能主动收缩拉动骨；弯肘和伸肘由不同肌群轮流主导。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#263e51"/></marker>
  </defs>
  <rect width="1200" height="680" fill="#f4f8f9"/>
  <path d="M0,615 Q260,560 520,615 T1040,615 T1300,615 V680 H0 Z" fill="#258097" opacity="0.09"/>
  <text x="65" y="64" fill="#263e51" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="30" font-weight="750">比较图</text>
  <text x="1135" y="64" text-anchor="end" fill="#263e51" opacity="0.72" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="21">示意图 · 不按比例</text>
  <rect x="170.0" y="137.5" width="360" height="395" rx="8" fill="#ffffff" stroke="#263e51" stroke-width="2.5"/><path d="M278.0,343.2 Q332.0,228.0 414.8,280.2 Q381.5,364.8 278.0,343.2 Z" fill="#e16b68" stroke="#263e51" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/><line x1="267.2" y1="352.2" x2="300.5" y2="331.5" stroke="#263e51" stroke-width="7.2" stroke-linecap="round"/><line x1="414.8" y1="280.2" x2="444.5" y2="259.5" stroke="#263e51" stroke-width="7.2" stroke-linecap="round"/><text x="350" y="440" text-anchor="middle" fill="#263e51" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="26" font-weight="650"><tspan x="350" dy="0">一组肌肉收缩弯肘</tspan></text><rect x="670.0" y="137.5" width="360" height="395" rx="8" fill="#ffffff" stroke="#263e51" stroke-width="2.5"/><path d="M778.0,343.2 Q832.0,228.0 914.8,280.2 Q881.5,364.8 778.0,343.2 Z" fill="#e16b68" stroke="#263e51" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/><line x1="767.2" y1="352.2" x2="800.5" y2="331.5" stroke="#263e51" stroke-width="7.2" stroke-linecap="round"/><line x1="914.8" y1="280.2" x2="944.5" y2="259.5" stroke="#263e51" stroke-width="7.2" stroke-linecap="round"/><text x="850" y="440" text-anchor="middle" fill="#263e51" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="26" font-weight="650"><tspan x="850" dy="0">另一组肌肉</tspan><tspan x="850" dy="34">收缩伸肘</tspan></text><line x1="600.0" y1="170" x2="600.0" y2="500" stroke="#263e51" stroke-width="3" stroke-linecap="round" stroke-dasharray="10 12"/><text x="600" y="570" text-anchor="middle" fill="#263e51" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="500"><tspan x="600" dy="0">并排比较：结构或</tspan><tspan x="600" dy="31">条件不同，结果也会不同</tspan></text>
