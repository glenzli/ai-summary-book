<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">原理图：月亮为什么不会掉到地球上？</title>
  <desc id="desc">月球不断向前运动，同时被地球引力拉弯路径，于是持续绕地球下落。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#293451"/></marker>
  </defs>
  <rect width="1200" height="680" fill="#f1f2fb"/>
  <path d="M0,615 Q260,560 520,615 T1040,615 T1300,615 V680 H0 Z" fill="#5268ad" opacity="0.09"/>
  <text x="65" y="64" fill="#293451" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="30" font-weight="750">方向与受力图</text>
  <text x="1135" y="64" text-anchor="end" fill="#293451" opacity="0.72" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="21">示意图 · 不按比例</text>
  <ellipse cx="505" cy="340" rx="355" ry="215" fill="none" stroke="#5268ad" stroke-width="5"/><circle cx="505" cy="340" r="61.199999999999996" fill="#5268ad" stroke="#293451" stroke-width="4.25"/><path d="M460.8,310.25 Q492.25,280.5 511.8,312.8 L500.75,343.4 L462.5,350.2 Z M520.3,350.2 Q560.25,333.2 551.75,378.25 L515.2,389.3 Z" fill="#d48b49" stroke="#293451" stroke-width="2.125" stroke-linecap="round" stroke-linejoin="round"/><circle cx="860" cy="340" r="41.58" fill="#f1f2fb" stroke="#293451" stroke-width="3.15"/><circle cx="846.14" cy="328.66" r="6.93" fill="#5268ad" stroke="none" stroke-width="0"/><circle cx="875.12" cy="356.38" r="9.45" fill="#5268ad" stroke="none" stroke-width="0"/><path d="M860,298.42 A41.58,41.58 0 0 1 860,381.58 Z" fill="#293451" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/><line x1="850" y1="275" x2="850" y2="125" stroke="#d48b49" stroke-width="10" stroke-linecap="round" marker-end="url(#arrow)"/><text x="850" y="92" text-anchor="middle" fill="#293451" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="25" font-weight="650"><tspan x="850" dy="0">原有速度指</tspan><tspan x="850" dy="33">向轨道切线</tspan></text><line x1="790" y1="340" x2="620" y2="340" stroke="#5268ad" stroke-width="10" stroke-linecap="round" marker-end="url(#arrow)"/><text x="705" y="305" text-anchor="middle" fill="#293451" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="25" font-weight="650"><tspan x="705" dy="0">地球引力指向地心</tspan></text><path d="M150,340 A355,215 0 0 0 505,555" fill="none" stroke="#5268ad" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="505" y="610" text-anchor="middle" fill="#293451" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="24" font-weight="550"><tspan x="505" dy="0">向前运动不断被引力拉弯</tspan><tspan x="505" dy="32">月球便持续绕地球下落</tspan></text>
  <rect x="12" y="12" width="1176" height="656" rx="8" fill="none" stroke="#293451" stroke-width="3" opacity="0.22"/>
</svg>
