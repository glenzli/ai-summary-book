<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">云是怎样长出来的？</title>
  <desc id="desc">围绕“云是怎样长出来的？”绘制的清晰主题图；具体对象优先，必要关系用箭头表示。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#173746"/></marker>
  </defs>
  <rect width="960" height="540" fill="#F0FDFA"/>
  <path d="M0,455 Q185,410 355,455 T700,455 T1040,455 V540 H0 Z" fill="#0F8A8A" opacity="0.07"/>

  <g data-question="038" data-layout="earth-weather" data-presentation="earth-weather" data-source="earth-weather" data-icons="earth-weather-plate-038"><text x="54" y="54" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="26" font-weight="760">湿空气上升冷却，水汽凝结在微粒周围，许多小滴组成云</text><rect x="34" y="82" width="892" height="382" rx="4" fill="#DCEEF4" stroke="none" stroke-width="0"/><path d="M34,300 Q180,265 325,300 T620,300 T930,300 V464 H34 Z" fill="#A9D9E2" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/><path d="M34,330 Q170,295 320,330 T620,330 T940,330" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="150" cy="130" r="38" fill="#E8B642" stroke="#DE753E" stroke-width="4"/><path d="M198.0,130.0 L226.0,130.0" fill="none" stroke="#DE753E" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M191.56921938165306,154.0 L215.81793068761735,168.0" fill="none" stroke="#DE753E" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M174.0,171.56921938165306 L188.0,195.81793068761732" fill="none" stroke="#DE753E" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M150.0,178.0 L150.0,206.0" fill="none" stroke="#DE753E" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M126.0,171.56921938165306 L112.00000000000001,195.81793068761735" fill="none" stroke="#DE753E" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M108.43078061834694,154.0 L84.18206931238265,168.0" fill="none" stroke="#DE753E" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M102.0,130.0 L74.0,130.0" fill="none" stroke="#DE753E" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M108.43078061834694,106.00000000000001 L84.18206931238265,92.00000000000001" fill="none" stroke="#DE753E" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M125.99999999999997,88.43078061834696 L111.99999999999997,64.18206931238268" fill="none" stroke="#DE753E" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M150.0,82.0 L150.0,54.0" fill="none" stroke="#DE753E" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M174.0,88.43078061834694 L188.0,64.18206931238267" fill="none" stroke="#DE753E" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M191.56921938165306,105.99999999999997 L215.81793068761732,91.99999999999997" fill="none" stroke="#DE753E" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="581.75" cy="202.6" r="47.25" fill="#FFFFFF" stroke="#24384A" stroke-width="3.1500000000000004"/><circle cx="634.25" cy="163.75" r="65.10000000000001" fill="#FFFFFF" stroke="#24384A" stroke-width="3.1500000000000004"/><circle cx="702.5" cy="184.75" r="54.6" fill="#FFFFFF" stroke="#24384A" stroke-width="3.1500000000000004"/><rect x="536.6" y="198.4" width="215.25" height="65.10000000000001" rx="29.400000000000002" fill="#FFFFFF" stroke="#24384A" stroke-width="3.1500000000000004"/><path d="M260,320 Q320,220 390,170" fill="none" stroke="#4B86B7" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M420,175 Q500,150 555,175" fill="none" stroke="#2D8178" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><circle cx="585" cy="190" r="7" fill="#4B86B7" stroke="#24384A" stroke-width="1.5"/><circle cx="630" cy="165" r="7" fill="#4B86B7" stroke="#24384A" stroke-width="1.5"/><circle cx="680" cy="195" r="7" fill="#4B86B7" stroke="#24384A" stroke-width="1.5"/><circle cx="720" cy="175" r="7" fill="#4B86B7" stroke="#24384A" stroke-width="1.5"/><path d="M350,220 L608,324" fill="none" stroke="#24384A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="350" cy="220" r="4.5" fill="#24384A" stroke="none" stroke-width="0"/><text x="620" y="330" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">上升空气膨胀并降温</text><path d="M650,180 L632,99" fill="none" stroke="#24384A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="650" cy="180" r="4.5" fill="#24384A" stroke="none" stroke-width="0"/><text x="620" y="105" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">凝结核周围长出微小水滴或冰晶</text><text x="420" y="490" fill="#24384A" text-anchor="middle" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="700">单个云滴很小，下降慢；云是大量云滴共同散射光的结果</text></g>
  <rect x="12" y="12" width="936" height="516" rx="8" fill="none" stroke="#173746" stroke-width="3" opacity="0.18"/>
