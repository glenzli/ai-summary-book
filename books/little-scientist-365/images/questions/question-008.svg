<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">为什么能透过窗户看外面？</title>
  <desc id="desc">围绕“为什么能透过窗户看外面？”绘制的清晰主题图；具体对象优先，必要关系用箭头表示。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#17213A"/></marker>
  </defs>
  <rect width="960" height="540" fill="#F4F9FF"/>
  <path d="M0,455 Q185,410 355,455 T700,455 T1040,455 V540 H0 Z" fill="#2563EB" opacity="0.07"/>

  <g data-question="008" data-layout="earth-weather" data-presentation="earth-weather" data-source="earth-weather" data-icons="earth-weather-plate-008"><text x="54" y="54" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="26" font-weight="760">透明玻璃让大部分可见光穿过，也反射一小部分</text><rect x="34" y="82" width="892" height="382" rx="4" fill="#DCEEF4" stroke="none" stroke-width="0"/><path d="M34,350 Q175,285 325,350 T635,350 T945,350 V464 H34 Z" fill="#A6C982" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/><path d="M34,425 Q190,380 355,425 T690,425 T1030,425 V464 H34 Z" fill="#5A9258" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/><rect x="260" y="105" width="440" height="285" rx="4" fill="#D6EEF2" stroke="#24384A" stroke-width="5"/><path d="M480,105 L480,390" fill="none" stroke="#24384A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M260,247 L700,247" fill="none" stroke="#24384A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="365" cy="170" r="32" fill="#E8B642" stroke="#DE753E" stroke-width="4"/><path d="M407.0,170.0 L435.0,170.0" fill="none" stroke="#DE753E" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M401.3730669589464,191.0 L425.6217782649107,205.0" fill="none" stroke="#DE753E" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M386.0,206.37306695894642 L400.0,230.6217782649107" fill="none" stroke="#DE753E" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M365.0,212.0 L365.0,240.0" fill="none" stroke="#DE753E" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M344.0,206.37306695894642 L330.0,230.62177826491072" fill="none" stroke="#DE753E" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M328.6269330410536,191.0 L304.3782217350893,205.0" fill="none" stroke="#DE753E" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M323.0,170.0 L295.0,170.0" fill="none" stroke="#DE753E" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M328.6269330410536,149.0 L304.37822173508926,135.0" fill="none" stroke="#DE753E" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M344.0,133.62693304105358 L330.0,109.37822173508931" fill="none" stroke="#DE753E" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M365.0,128.0 L365.0,100.0" fill="none" stroke="#DE753E" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M386.0,133.62693304105358 L400.0,109.3782217350893" fill="none" stroke="#DE753E" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M401.3730669589464,148.99999999999997 L425.6217782649107,134.99999999999997" fill="none" stroke="#DE753E" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M275,340 Q380,245 470,340 Q565,255 690,340" fill="#5A9258" stroke="#24384A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M120,220 L285,220" fill="none" stroke="#DE753E" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M285,220 L650,220" fill="none" stroke="#DE753E" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M285,220 L170,145" fill="none" stroke="#4B86B7" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M285,220 L618,114" fill="none" stroke="#24384A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="285" cy="220" r="4.5" fill="#24384A" stroke="none" stroke-width="0"/><text x="630" y="120" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">多数光穿过玻璃和室内空气</text><path d="M225,185 L618,264" fill="none" stroke="#24384A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="225" cy="185" r="4.5" fill="#24384A" stroke="none" stroke-width="0"/><text x="630" y="270" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">少量光被表面反射，所以</text><text x="630" y="292" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">夜里窗上会见到室内倒影</text><text x="470" y="485" fill="#24384A" text-anchor="middle" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="690">透明不等于对所有光都透明，厚度、颜色和波长都会影响</text></g>
  <rect x="12" y="12" width="936" height="516" rx="8" fill="none" stroke="#17213A" stroke-width="3" opacity="0.18"/>
</svg>
