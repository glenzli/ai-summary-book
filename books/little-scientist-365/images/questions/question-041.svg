  <g data-question="041" data-layout="earth-weather" data-presentation="earth-weather" data-source="earth-weather" data-icons="earth-weather-plate-041"><text x="54" y="54" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="26" font-weight="760">云中降水常先以冰晶形成，穿过暖层时可能融化成雨</text><rect x="34" y="82" width="892" height="382" rx="4" fill="#DCEEF4" stroke="none" stroke-width="0"/><circle cx="351.75" cy="177.6" r="47.25" fill="#75838C" stroke="#24384A" stroke-width="3.1500000000000004"/><circle cx="404.25" cy="138.75" r="65.10000000000001" fill="#75838C" stroke="#24384A" stroke-width="3.1500000000000004"/><circle cx="472.5" cy="159.75" r="54.6" fill="#75838C" stroke="#24384A" stroke-width="3.1500000000000004"/><rect x="306.6" y="173.4" width="215.25" height="65.10000000000001" rx="29.400000000000002" fill="#75838C" stroke="#24384A" stroke-width="3.1500000000000004"/><rect x="34" y="285" width="892" height="65" rx="0" fill="#F4C78A" stroke="none" stroke-width="0"/><path d="M238,225 H262 M250,213 V274 M241,216 L259,234 M259,216 L241,234" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M328,225 H352 M340,213 V364 M331,216 L349,234 M349,216 L331,234" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M418,225 H442 M430,213 V454 M421,216 L439,234 M439,216 L421,234" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M508,225 H532 M520,213 V544 M511,216 L529,234 M529,216 L511,234" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M300,369.4 C294.72,379.0 288.48,387.4 288.48,394.12 C288.48,408.52 311.52,408.52 311.52,394.12 C311.52,387.4 305.28,379.0 300,369.4 Z" fill="#4B86B7" stroke="#24384A" stroke-width="0.72" stroke-linecap="round" stroke-linejoin="round"/><path d="M410,369.4 C404.72,379.0 398.48,387.4 398.48,394.12 C398.48,408.52 421.52,408.52 421.52,394.12 C421.52,387.4 415.28,379.0 410,369.4 Z" fill="#4B86B7" stroke="#24384A" stroke-width="0.72" stroke-linecap="round" stroke-linejoin="round"/><path d="M520,369.4 C514.72,379.0 508.48,387.4 508.48,394.12 C508.48,408.52 531.52,408.52 531.52,394.12 C531.52,387.4 525.28,379.0 520,369.4 Z" fill="#4B86B7" stroke="#24384A" stroke-width="0.72" stroke-linecap="round" stroke-linejoin="round"/><text x="750" y="255" fill="#24384A" text-anchor="middle" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="650">0°C 以下的冷层</text><text x="750" y="330" fill="#24384A" text-anchor="middle" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="650">较暖空气层</text><path d="M410,325 L608,404" fill="none" stroke="#24384A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="410" cy="325" r="4.5" fill="#24384A" stroke="none" stroke-width="0"/><text x="620" y="410" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">冰晶完全融化后成为雨；若地</text><text x="620" y="432" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">面附近仍冷，也可能形成冻雨</text></g>
