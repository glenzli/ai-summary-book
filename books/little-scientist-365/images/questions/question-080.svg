  <path d="M0,455 Q185,410 355,455 T700,455 T1040,455 V540 H0 Z" fill="#3B8C5A" opacity="0.07"/>

  <g data-question="080" data-layout="plant" data-presentation="plant" data-source="plant" data-icons="plant-plate-080"><text x="54" y="54" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="26" font-weight="760">仙人掌把水储在肥厚茎里，叶退化成刺以减少蒸腾</text><rect x="34" y="82" width="892" height="382" rx="4" fill="#DDEFF3" stroke="none" stroke-width="0"/><path d="M34,330 Q170,280 315,330 T610,330 T920,330 V464 H34 Z" fill="#A7C97E" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/><rect x="34" y="360" width="892" height="104" rx="0" fill="#B8845D" stroke="none" stroke-width="0"/><path d="M34,360 Q175,328 320,360 T610,360 T930,360" fill="none" stroke="#4F8A55" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><path d="M350,390 V190 Q350,130 410,130 Q470,130 470,190 V390 Z" fill="#4F8A55" stroke="#24384A" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M350,270 Q285,270 285,220 V190 Q285,160 315,160 Q340,160 340,190" fill="none" stroke="#4F8A55" stroke-width="40" stroke-linecap="round" stroke-linejoin="round"/><path d="M470,245 Q540,245 540,195" fill="none" stroke="#4F8A55" stroke-width="40" stroke-linecap="round" stroke-linejoin="round"/><path d="M365,210 L350,195" fill="none" stroke="#F7E9C9" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M365,210 L380,195" fill="none" stroke="#F7E9C9" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M440,180 L425,165" fill="none" stroke="#F7E9C9" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M440,180 L455,165" fill="none" stroke="#F7E9C9" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M390,300 L375,285" fill="none" stroke="#F7E9C9" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M390,300 L405,285" fill="none" stroke="#F7E9C9" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M455,335 L440,320" fill="none" stroke="#F7E9C9" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M455,335 L470,320" fill="none" stroke="#F7E9C9" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M300,210 L285,195" fill="none" stroke="#F7E9C9" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M300,210 L315,195" fill="none" stroke="#F7E9C9" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M525,215 L510,200" fill="none" stroke="#F7E9C9" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M525,215 L540,200" fill="none" stroke="#F7E9C9" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="650" y="145" width="210" height="210" rx="12" fill="#F7E9C9" stroke="#24384A" stroke-width="3"/><ellipse cx="755" cy="250" rx="72" ry="90" fill="#79B46C" stroke="#24384A" stroke-width="4"/><ellipse cx="755" cy="250" rx="45" ry="62" fill="#B9D99E" stroke="#24384A" stroke-width="3"/><circle cx="740" cy="235" r="9" fill="#4D86B5" stroke="none" stroke-width="0"/><circle cx="770" cy="270" r="10" fill="#4D86B5" stroke="none" stroke-width="0"/><path d="M755,250 L632,404" fill="none" stroke="#24384A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="755" cy="250" r="4.5" fill="#24384A" stroke="none" stroke-width="0"/><text x="620" y="410" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">储水组织含大量薄壁细胞；</text><text x="620" y="432" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">茎表皮与气孔还会控制失水</text><path d="M350,205 L638,109" fill="none" stroke="#24384A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="350" cy="205" r="4.5" fill="#24384A" stroke="none" stroke-width="0"/><text x="650" y="115" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">刺是变态叶，也能</text><text x="650" y="137" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">遮阴和防止动物啃食</text></g>
