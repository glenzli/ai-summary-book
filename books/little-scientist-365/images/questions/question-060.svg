  <path d="M0,455 Q185,410 355,455 T700,455 T1040,455 V540 H0 Z" fill="#3B8C5A" opacity="0.07"/>

  <g data-question="060" data-layout="plant" data-presentation="plant" data-source="plant" data-icons="plant-plate-060"><text x="54" y="54" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="26" font-weight="760">种皮里面有幼小的胚，也有供刚发芽时使用的食物</text><rect x="34" y="82" width="892" height="190" rx="4" fill="#DDEFF3" stroke="none" stroke-width="0"/><rect x="34" y="272" width="892" height="192" rx="0" fill="#B8845D" stroke="none" stroke-width="0"/><path d="M34,272 Q165,245 300,272 T580,272 T860,272 T980,272" fill="none" stroke="#4F8A55" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><circle cx="115" cy="335" r="8" fill="#76523B" stroke="none" stroke-width="0"/><circle cx="175" cy="402" r="6" fill="#76523B" stroke="none" stroke-width="0"/><circle cx="820" cy="330" r="9" fill="#76523B" stroke="none" stroke-width="0"/><circle cx="745" cy="420" r="7" fill="#76523B" stroke="none" stroke-width="0"/><path d="M237.76,285 C257.28,181.3 396.36,163.0 462.24,265.48 C429.3,378.94 286.56,392.36 237.76,285 Z" fill="#C68B50" stroke="#24384A" stroke-width="4.88" stroke-linecap="round" stroke-linejoin="round"/><path d="M274.36,282.56 C295.1,214.24 382.94,199.60000000000002 425.64,270.36 C398.8,342.34 307.3,348.44 274.36,282.56 Z" fill="#F7E9C9" stroke="#5A4032" stroke-width="3.66" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="345.12" cy="281.34" rx="46.36" ry="57.339999999999996" fill="#E6B542" stroke="#5A4032" stroke-width="3.66"/><path d="M376.84,309.4 q40.26,36.6 58.56,63.44" fill="none" stroke="#2F6744" stroke-width="8.54" stroke-linecap="round" stroke-linejoin="round"/><circle cx="376.84" cy="306.96" r="9.76" fill="#2F6744" stroke="none" stroke-width="0"/><path d="M250,260 L643,119" fill="none" stroke="#24384A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="250" cy="260" r="4.5" fill="#24384A" stroke="none" stroke-width="0"/><text x="655" y="125" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">种皮保护内部，吸水后逐渐变软</text><path d="M350,280 L643,249" fill="none" stroke="#24384A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="350" cy="280" r="4.5" fill="#24384A" stroke="none" stroke-width="0"/><text x="655" y="255" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">胚会长成新的根、茎和叶</text><path d="M410,330 L643,379" fill="none" stroke="#24384A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="410" cy="330" r="4.5" fill="#24384A" stroke="none" stroke-width="0"/><text x="655" y="385" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">子叶或胚乳储存淀粉、油和蛋白质</text></g>
  <rect x="12" y="12" width="936" height="516" rx="8" fill="none" stroke="#203D2D" stroke-width="3" opacity="0.18"/>
