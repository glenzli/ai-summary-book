<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">椰子为什么能漂在海上？</title>
  <desc id="desc">围绕“椰子为什么能漂在海上？”绘制的清晰主题图；具体对象优先，必要关系用箭头表示。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#203D2D"/></marker>
  </defs>
  <rect width="960" height="540" fill="#F5FBEF"/>
  <path d="M0,455 Q185,410 355,455 T700,455 T1040,455 V540 H0 Z" fill="#3B8C5A" opacity="0.07"/>

  <g data-question="075" data-layout="plant" data-presentation="plant" data-source="plant" data-icons="plant-plate-075"><text x="54" y="54" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="26" font-weight="760">椰子果皮中有厚纤维层和空气空隙，能浮水并抗碰撞</text><rect x="34" y="82" width="892" height="382" rx="4" fill="#DDEFF3" stroke="none" stroke-width="0"/><path d="M34,285 Q180,250 330,285 T630,285 T940,285 V464 H34 Z" fill="#9BD4DE" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="330" cy="300" rx="125" ry="92" fill="#8D6546" stroke="#24384A" stroke-width="5"/><path d="M330,210 A125,92 0 0 1 330,392 L330,210" fill="#D7B475" stroke="#24384A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="355" cy="300" rx="72" ry="62" fill="#FFFFFF" stroke="#24384A" stroke-width="3"/><ellipse cx="370" cy="300" rx="47" ry="42" fill="#DDEEF5" stroke="#24384A" stroke-width="2"/><path d="M34,330 L926,330" fill="none" stroke="#4D86B5" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M260,280 L638,124" fill="none" stroke="#24384A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="260" cy="280" r="4.5" fill="#24384A" stroke="none" stroke-width="0"/><text x="650" y="130" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">外层果皮耐磨</text><path d="M330,250 L638,254" fill="none" stroke="#24384A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="330" cy="250" r="4.5" fill="#24384A" stroke="none" stroke-width="0"/><text x="650" y="260" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">纤维层夹着空气，平均密度较低</text><path d="M380,300 L638,384" fill="none" stroke="#24384A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="380" cy="300" r="4.5" fill="#24384A" stroke="none" stroke-width="0"/><text x="650" y="390" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">坚硬内果皮和胚乳保护种子</text></g>
