d" stroke-linejoin="round" stroke-dasharray="7 7"/><path d="M312,166 L656,108" fill="none" stroke="#24384A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="312" cy="166" r="5" fill="#24384A" stroke="none" stroke-width="0"/><text x="670" y="115" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="650">不同味觉感受器广泛分布</text><path d="M720,255 L791,228" fill="none" stroke="#24384A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="720" cy="255" r="5" fill="#24384A" stroke="none" stroke-width="0"/><text x="805" y="235" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="650">味蕾局部放大</text><path d="M720,285 L791,338" fill="none" stroke="#24384A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="720" cy="285" r="5" fill="#24384A" stroke="none" stroke-width="0"/><text x="805" y="345" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="650">甜、酸、咸、苦、鲜都要靠大脑辨认</text><text x="365" y="492" fill="#24384A" text-anchor="middle" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="560">彩色点只表示多种受体混合分布，不是舌头分区地图</text><text x="365" y="80" fill="#A54E58" text-anchor="middle" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="21" font-weight="700">五种基本味觉并非五块专属区域</text></g>
