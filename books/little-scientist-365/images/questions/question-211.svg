  <g data-question="211" data-layout="machine" data-presentation="machine" data-source="machine" data-icons="machine-plate-211"><text x="54" y="54" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="26" font-weight="760">电梯控制器结合楼层传感器、曳引机和制动器准确停车</text><rect x="34" y="82" width="892" height="382" rx="4" fill="#E8ECEC" stroke="none" stroke-width="0"/><rect x="180" y="110" width="360" height="320" rx="4" fill="none" stroke="#24384A" stroke-width="5"/><rect x="230" y="210" width="150" height="170" rx="5" fill="#AAB7BD" stroke="#24384A" stroke-width="4"/><circle cx="470" cy="155" r="50" fill="#FFFFFF" stroke="#24384A" stroke-width="4"/><path d="M305,210 V155 H470 Q520,155 520,205 V375" fill="none" stroke="#24384A" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><rect x="475" y="340" width="90" height="55" rx="5" fill="#4B82B3" stroke="#24384A" stroke-width="3"/><circle cx="590" cy="150" r="10" fill="#C95757" stroke="none" stroke-width="0"/><path d="M540,150 L590,150" fill="none" stroke="#2C8178" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 6"/><circle cx="590" cy="250" r="10" fill="#C95757" stroke="none" stroke-width="0"/><path d="M540,250 L590,250" fill="none" stroke="#2C8178" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 6"/><circle cx="590" cy="350" r="10" fill="#C95757" stroke="none" stroke-width="0"/><path d="M540,350 L590,350" fill="none" stroke="#2C8178" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 6"/><rect x="680" y="145" width="150" height="210" rx="12" fill="#F7E9CA" stroke="#24384A" stroke-width="3"/><circle cx="755" cy="195" r="22" fill="#5B9159" stroke="#24384A" stroke-width="2"/><circle cx="755" cy="255" r="22" fill="#E6B441" stroke="#24384A" stroke-width="2"/><circle cx="755" cy="315" r="22" fill="#C95757" stroke="#24384A" stroke-width="2"/><path d="M590,250 L608,99" fill="none" stroke="#24384A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="590" cy="250" r="4.5" fill="#24384A" stroke="none" stroke-width="0"/><text x="620" y="105" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">位置传感器告诉控</text><text x="620" y="127" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">制器轿厢经过哪里</text><path d="M470,155 L608,389" fill="none" stroke="#24384A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="470" cy="155" r="4.5" fill="#24384A" stroke="none" stroke-width="0"/><text x="620" y="395" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">电机减速接近楼层，</text><text x="620" y="417" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">制动器最后保持静止</text></g>
