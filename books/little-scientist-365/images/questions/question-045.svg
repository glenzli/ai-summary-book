<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">雾为什么像落到地上的云？</title>
  <desc id="desc">围绕“雾为什么像落到地上的云？”绘制的清晰主题图；具体对象优先，必要关系用箭头表示。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#173746"/></marker>
  </defs>
  <rect width="960" height="540" fill="#F0FDFA"/>
  <path d="M0,455 Q185,410 355,455 T700,455 T1040,455 V540 H0 Z" fill="#0F8A8A" opacity="0.07"/>

  <g data-question="045" data-layout="earth-weather" data-presentation="earth-weather" data-source="earth-weather" data-icons="earth-weather-plate-045"><text x="54" y="54" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="26" font-weight="760">地面附近的空气冷到接近饱和，微小水滴悬浮起来就是雾</text><rect x="34" y="82" width="892" height="382" rx="4" fill="#DCEEF4" stroke="none" stroke-width="0"/><path d="M34,350 Q175,285 325,350 T635,350 T945,350 V464 H34 Z" fill="#A6C982" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/><path d="M34,425 Q190,380 355,425 T690,425 T1030,425 V464 H34 Z" fill="#5A9258" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/><circle cx="161.25" cy="319.0" r="33.75" fill="#FFFFFF" stroke="#24384A" stroke-width="2.25"/><circle cx="198.75" cy="291.25" r="46.5" fill="#FFFFFF" stroke="#24384A" stroke-width="2.25"/><circle cx="247.5" cy="306.25" r="39.0" fill="#FFFFFF" stroke="#24384A" stroke-width="2.25"/><rect x="129.0" y="316.0" width="153.75" height="46.5" rx="21.0" fill="#FFFFFF" stroke="#24384A" stroke-width="2.25"/><circle cx="378.0" cy="339.6" r="36.0" fill="#FFFFFF" stroke="#24384A" stroke-width="2.4000000000000004"/><circle cx="418.0" cy="310.0" r="49.6" fill="#FFFFFF" stroke="#24384A" stroke-width="2.4000000000000004"/><circle cx="470.0" cy="326.0" r="41.6" fill="#FFFFFF" stroke="#24384A" stroke-width="2.4000000000000004"/><rect x="343.6" y="336.4" width="164.0" height="49.6" rx="22.400000000000002" fill="#FFFFFF" stroke="#24384A" stroke-width="2.4000000000000004"/><circle cx="603.2" cy="313.64" r="32.4" fill="#FFFFFF" stroke="#24384A" stroke-width="2.16"/><circle cx="639.2" cy="287.0" r="44.64" fill="#FFFFFF" stroke="#24384A" stroke-width="2.16"/><circle cx="686.0" cy="301.4" r="37.44" fill="#FFFFFF" stroke="#24384A" stroke-width="2.16"/><rect x="572.24" y="310.76" width="147.6" height="44.64" rx="20.16" fill="#FFFFFF" stroke="#24384A" stroke-width="2.16"/><rect x="736.4" y="329.0" width="67.2" height="52.5" rx="1.68" fill="#F7E9CA" stroke="#24384A" stroke-width="1.68"/><polygon points="728.0,329.0 770,293.3 812.0,329.0" fill="#C85555" stroke="#24384A" stroke-width="1.68" stroke-linejoin="round"/><rect x="760.76" y="352.1" width="18.48" height="29.4" rx="1.26" fill="#8A654A" stroke="#24384A" stroke-width="1.26"/><path d="M430,330 L608,99" fill="none" stroke="#24384A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="430" cy="330" r="4.5" fill="#24384A" stroke="none" stroke-width="0"/><text x="620" y="105" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">雾滴与云滴相似，区</text><text x="620" y="127" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">别主要是它接触地面</text><path d="M250,335 L608,264" fill="none" stroke="#24384A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="250" cy="335" r="4.5" fill="#24384A" stroke="none" stroke-width="0"/><text x="620" y="270" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">夜间地面降温、暖湿空</text><text x="620" y="292" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">气移到冷地面等都能成雾</text><text x="420" y="490" fill="#24384A" text-anchor="middle" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="620">看不清远处，是因为光被大量小滴散射</text></g>
  <rect x="12" y="12" width="936" height="516" rx="8" fill="none" stroke="#173746" stroke-width="3" opacity="0.18"/>
</svg>
