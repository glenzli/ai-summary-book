  <g data-question="033" data-layout="earth-weather" data-presentation="earth-weather" data-source="earth-weather" data-icons="earth-weather-plate-033"><text x="54" y="54" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="26" font-weight="760">地表受热不均使空气密度和气压不同，空气便发生水平流动</text><rect x="34" y="82" width="892" height="382" rx="4" fill="#DCEEF4" stroke="none" stroke-width="0"/><path d="M34,350 Q175,285 325,350 T635,350 T945,350 V464 H34 Z" fill="#A6C982" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/><path d="M34,425 Q190,380 355,425 T690,425 T1030,425 V464 H34 Z" fill="#5A9258" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/><circle cx="200" cy="130" r="42" fill="#E8B642" stroke="#DE753E" stroke-width="4"/><path d="M252.0,130.0 L280.0,130.0" fill="none" stroke="#DE753E" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M245.03332099679082,156.0 L269.2820323027551,170.0" fill="none" stroke="#DE753E" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M226.0,175.0333209967908 L240.0,199.28203230275508" fill="none" stroke="#DE753E" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M200.0,182.0 L200.0,210.0" fill="none" stroke="#DE753E" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M174.0,175.03332099679082 L160.0,199.2820323027551" fill="none" stroke="#DE753E" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M154.96667900320918,156.0 L130.7179676972449,170.0" fill="none" stroke="#DE753E" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M148.0,130.0 L120.0,130.0" fill="none" stroke="#DE753E" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M154.96667900320918,104.00000000000001 L130.7179676972449,90.00000000000001" fill="none" stroke="#DE753E" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M173.99999999999997,84.96667900320921 L159.99999999999997,60.71796769724493" fill="none" stroke="#DE753E" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M200.0,78.0 L199.99999999999997,50.0" fill="none" stroke="#DE753E" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M226.0,84.9666790032092 L240.0,60.717967697244916" fill="none" stroke="#DE753E" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M245.0333209967908,103.99999999999997 L269.28203230275506,89.99999999999997" fill="none" stroke="#DE753E" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><rect x="100" y="355" width="300" height="70" rx="0" fill="#D99155" stroke="#24384A" stroke-width="3"/><rect x="560" y="355" width="300" height="70" rx="0" fill="#A9D9E2" stroke="#24384A" stroke-width="3"/><path d="M180,350 Q150,260 180,190" fill="none" stroke="#DE753E" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M260,350 Q230,260 260,190" fill="none" stroke="#DE753E" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M340,350 Q310,260 340,190" fill="none" stroke="#DE753E" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M620,205 Q640,285 620,345" fill="none" stroke="#4B86B7" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M700,205 Q720,285 700,345" fill="none" stroke="#4B86B7" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M780,205 Q800,285 780,345" fill="none" stroke="#4B86B7" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M560,330 Q450,310 400,330" fill="none" stroke="#2D8178" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M400,180 Q500,155 560,180" fill="none" stroke="#2D8178" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="250" y="455" fill="#24384A" text-anchor="middle" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="650">暖地面上方空气上升</text><text x="710" y="455" fill="#24384A" text-anchor="middle" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="650">较冷空气补过来</text><path d="M470,320 L608,99" fill="none" stroke="#24384A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="470" cy="320" r="4.5" fill="#24384A" stroke="none" stroke-width="0"/><text x="620" y="105" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">这种循环的一部分</text><text x="620" y="127" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">在地面附近表现为风</text></g>
