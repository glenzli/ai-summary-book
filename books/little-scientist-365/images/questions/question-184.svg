<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">跷跷板怎样坐得平？</title>
  <desc id="desc">围绕“跷跷板怎样坐得平？”绘制的清晰主题图；具体对象优先，必要关系用箭头表示。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#293747"/></marker>
  </defs>
  <rect width="960" height="540" fill="#FFF7ED"/>
  <path d="M0,455 Q185,410 355,455 T700,455 T1040,455 V540 H0 Z" fill="#3B78A8" opacity="0.07"/>

  <g data-question="184" data-layout="machine" data-presentation="machine" data-source="machine" data-icons="machine-plate-184"><text x="54" y="54" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="26" font-weight="760">跷跷板是否平衡，取决于两边“重量 × 到支点距离”</text><rect x="34" y="82" width="892" height="382" rx="4" fill="#EFEAE1" stroke="none" stroke-width="0"/><rect x="34" y="360" width="892" height="104" rx="0" fill="#C99B70" stroke="none" stroke-width="0"/><path d="M34,360 L926,360" fill="none" stroke="#24384A" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M150,265 L810,330" fill="none" stroke="#4B82B3" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/><polygon points="430,365 480,295 530,365" fill="#DC713E" stroke="#24384A" stroke-width="4" stroke-linejoin="round"/><circle cx="270" cy="205" r="42" fill="#C95757" stroke="#24384A" stroke-width="3"/><rect x="235" y="245" width="70" height="50" rx="5" fill="#C95757" stroke="#24384A" stroke-width="3"/><circle cx="700" cy="260" r="30" fill="#E6B441" stroke="#24384A" stroke-width="3"/><rect x="675" y="295" width="50" height="38" rx="5" fill="#E6B441" stroke="#24384A" stroke-width="3"/><path d="M270,350 L480,350" fill="none" stroke="#2C8178" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M480,380 L700,380" fill="none" stroke="#2C8178" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="375" y="340" fill="#24384A" text-anchor="middle" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">距离较长</text><text x="590" y="420" fill="#24384A" text-anchor="middle" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">距离较短</text><text x="480" y="490" fill="#24384A" text-anchor="middle" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="620">较轻的人坐得更远，也可能和较重的人平衡</text></g>
  <rect x="12" y="12" width="936" height="516" rx="8" fill="none" stroke="#293747" stroke-width="3" opacity="0.18"/>
