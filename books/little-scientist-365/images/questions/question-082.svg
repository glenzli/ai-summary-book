<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">藤为什么要爬架子？</title>
  <desc id="desc">围绕“藤为什么要爬架子？”绘制的清晰主题图；具体对象优先，必要关系用箭头表示。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#203D2D"/></marker>
  </defs>
  <rect width="960" height="540" fill="#F5FBEF"/>
  <path d="M0,455 Q185,410 355,455 T700,455 T1040,455 V540 H0 Z" fill="#3B8C5A" opacity="0.07"/>

  <g data-question="082" data-layout="plant" data-presentation="plant" data-source="plant" data-icons="plant-plate-082"><text x="54" y="54" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="26" font-weight="760">藤本植物用卷须或缠绕茎攀附支架，把叶片带到有光处</text><rect x="34" y="82" width="892" height="382" rx="4" fill="#DDEFF3" stroke="none" stroke-width="0"/><path d="M34,330 Q170,280 315,330 T610,330 T920,330 V464 H34 Z" fill="#A7C97E" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/><rect x="34" y="360" width="892" height="104" rx="0" fill="#B8845D" stroke="none" stroke-width="0"/><path d="M34,360 Q175,328 320,360 T610,360 T930,360" fill="none" stroke="#4F8A55" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><rect x="420" y="110" width="35" height="320" rx="10" fill="#8D6546" stroke="#24384A" stroke-width="3"/><path d="M260,410 C270,330 420,350 335,255 C265,175 430,185 350,105" fill="none" stroke="#2F6744" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/><path d="M350,230 q95,-75 75,25 q-15,65 -60,25" fill="none" stroke="#4F8A55" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><path d="M232.5,310.25 Q271.0,261.25 335.75,298.0 Q297.25,347.0 232.5,310.25 Z" fill="#4F8A55" stroke="#24384A" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M239.5,308.5 Q285,305 328.75,298.7" fill="none" stroke="#2F6744" stroke-width="2.0999999999999996" stroke-linecap="round" stroke-linejoin="round"/><path d="M260.5,305.7 l-8.75,-50 M276.25,303.95 l-7.0,-62 M295.5,302.2 l-3.5,-63 M307.75,300.8 l35,-45" fill="none" stroke="#2F6744" stroke-width="1.0499999999999998" stroke-linecap="round" stroke-linejoin="round"/><path d="M332.0,174.8 Q367.2,130.0 426.4,163.6 Q391.2,208.4 332.0,174.8 Z" fill="#4F8A55" stroke="#24384A" stroke-width="1.28" stroke-linecap="round" stroke-linejoin="round"/><path d="M338.4,173.2 Q380,170 420.0,164.24" fill="none" stroke="#2F6744" stroke-width="1.92" stroke-linecap="round" stroke-linejoin="round"/><path d="M357.6,170.64 l-8.0,-50 M372.0,169.04 l-6.4,-62 M389.6,167.44 l-3.2,-63 M400.8,166.16 l35,-45" fill="none" stroke="#2F6744" stroke-width="0.96" stroke-linecap="round" stroke-linejoin="round"/><path d="M410,245 L638,119" fill="none" stroke="#24384A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="410" cy="245" r="4.5" fill="#24384A" stroke="none" stroke-width="0"/><text x="650" y="125" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">触碰支架的一侧生长</text><text x="650" y="147" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">改变，卷须逐渐弯曲</text><path d="M290,305 L638,264" fill="none" stroke="#24384A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="290" cy="305" r="4.5" fill="#24384A" stroke="none" stroke-width="0"/><text x="650" y="270" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">攀爬减少自己制造</text><text x="650" y="292" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">粗壮支撑茎的成本</text><path d="M350,410 L638,399" fill="none" stroke="#24384A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="350" cy="410" r="4.5" fill="#24384A" stroke="none" stroke-width="0"/><text x="650" y="405" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">根仍在土中吸水，藤</text><text x="650" y="427" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">不是靠支架“吸食”</text></g>
