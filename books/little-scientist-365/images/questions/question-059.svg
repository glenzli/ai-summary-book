  <path d="M0,455 Q185,410 355,455 T700,455 T1040,455 V540 H0 Z" fill="#0F8A8A" opacity="0.07"/>

  <g data-question="059" data-layout="earth-weather" data-presentation="earth-weather" data-source="earth-weather" data-icons="earth-weather-plate-059"><text x="54" y="54" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="26" font-weight="760">天气预报把地面、雷达、气球和卫星观测送入物理模型</text><rect x="34" y="82" width="892" height="382" rx="4" fill="#DCEEF4" stroke="none" stroke-width="0"/><path d="M34,350 Q175,285 325,350 T635,350 T945,350 V464 H34 Z" fill="#A6C982" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/><path d="M34,425 Q190,380 355,425 T690,425 T1030,425 V464 H34 Z" fill="#5A9258" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/><rect x="100" y="250" width="120" height="160" rx="6" fill="#AAB7BC" stroke="#24384A" stroke-width="4"/><path d="M160,250 L160,135" fill="none" stroke="#24384A" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><path d="M135,170 Q160,120 185,170" fill="none" stroke="#4B86B7" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="345" cy="225" r="55" fill="#FFFFFF" stroke="#24384A" stroke-width="3"/><path d="M345,280 L345,405" fill="none" stroke="#24384A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M345,225 Q430,170 500,225" fill="none" stroke="#4B86B7" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="735" cy="335" r="75" fill="#4B86B7" stroke="#24384A" stroke-width="4"/><path d="M677,300 q35,-42 72,-22 q8,28 -14,45 q-32,18 -55,5 Z" fill="#5A9258" stroke="#24384A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M745,353 q45,-20 62,12 q-12,48 -60,47 q-27,-18 -2,-59 Z" fill="#5A9258" stroke="#24384A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="650" y="120" width="170" height="70" rx="8" fill="#B8C5CC" stroke="#24384A" stroke-width="4"/><rect x="700" y="88" width="70" height="35" rx="4" fill="#4B86B7" stroke="#24384A" stroke-width="3"/><path d="M735,190 L735,245" fill="none" stroke="#24384A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M735,205 Q735,255 735,270" fill="none" stroke="#2D8178" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M220,250 Q300,180 335,185" fill="none" stroke="#2D8178" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M500,225 Q600,200 650,155" fill="none" stroke="#2D8178" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="160" y="445" fill="#24384A" text-anchor="middle" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">地面站</text><text x="350" y="445" fill="#24384A" text-anchor="middle" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">气球和雷达</text><text x="735" y="445" fill="#24384A" text-anchor="middle" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">卫星</text><text x="480" y="495" fill="#24384A" text-anchor="middle" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="700">模型从当前状态计算未来变化；时间越远，不确定性通常越大</text></g>
