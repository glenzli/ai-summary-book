"700">全身</text><path d="M360,205 L114,123" fill="none" stroke="#24384A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="360" cy="205" r="5" fill="#24384A" stroke="none" stroke-width="0"/><text x="100" y="130" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="650">缺氧血到肺</text><path d="M593,205 L731,108" fill="none" stroke="#24384A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="593" cy="205" r="5" fill="#24384A" stroke="none" stroke-width="0"/><text x="745" y="115" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="650">富氧血回心</text><path d="M686,417 L726,468" fill="none" stroke="#24384A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="686" cy="417" r="5" fill="#24384A" stroke="none" stroke-width="0"/><text x="740" y="475" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="650">动脉送出，静脉送回</text></g>
