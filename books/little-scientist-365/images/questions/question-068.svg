<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">植物会呼吸吗？</title>
  <desc id="desc">围绕“植物会呼吸吗？”绘制的清晰主题图；具体对象优先，必要关系用箭头表示。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#203D2D"/></marker>
  </defs>
  <rect width="960" height="540" fill="#F5FBEF"/>
  <path d="M0,455 Q185,410 355,455 T700,455 T1040,455 V540 H0 Z" fill="#3B8C5A" opacity="0.07"/>

  <g data-question="068" data-layout="plant" data-presentation="plant" data-source="plant" data-icons="plant-plate-068"><text x="54" y="54" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="26" font-weight="760">叶片通过气孔交换气体，白天和夜晚都进行细胞呼吸</text><rect x="34" y="82" width="892" height="382" rx="4" fill="#DDEFF3" stroke="none" stroke-width="0"/><path d="M34,330 Q170,280 315,330 T610,330 T920,330 V464 H34 Z" fill="#A7C97E" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/><rect x="34" y="360" width="892" height="104" rx="0" fill="#B8845D" stroke="none" stroke-width="0"/><path d="M34,360 Q175,328 320,360 T610,360 T930,360" fill="none" stroke="#4F8A55" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><path d="M162.0,283.8 Q263.2,155.0 433.4,251.6 Q332.2,380.4 162.0,283.8 Z" fill="#4F8A55" stroke="#24384A" stroke-width="3.68" stroke-linecap="round" stroke-linejoin="round"/><path d="M180.39999999999998,279.2 Q300,270 415.0,253.44" fill="none" stroke="#2F6744" stroke-width="5.5200000000000005" stroke-linecap="round" stroke-linejoin="round"/><path d="M235.6,271.84 l-23.0,-50 M277.0,267.24 l-18.400000000000002,-62 M327.6,262.64 l-9.200000000000001,-63 M359.8,258.96 l35,-45" fill="none" stroke="#2F6744" stroke-width="2.7600000000000002" stroke-linecap="round" stroke-linejoin="round"/><rect x="630" y="135" width="250" height="235" rx="12" fill="#F7E9C9" stroke="#24384A" stroke-width="3"/><ellipse cx="755" cy="250" rx="90" ry="58" fill="#B8D895" stroke="#24384A" stroke-width="3"/><ellipse cx="715" cy="250" rx="48" ry="35" fill="#4F8A55" stroke="#24384A" stroke-width="3"/><ellipse cx="795" cy="250" rx="48" ry="35" fill="#4F8A55" stroke="#24384A" stroke-width="3"/><ellipse cx="755" cy="250" rx="20" ry="38" fill="#FFFFFF" stroke="#24384A" stroke-width="3"/><path d="M755,205 Q755,165 755,145" fill="none" stroke="#4D86B5" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M755,295 Q755,335 755,355" fill="none" stroke="#2D8178" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M755,250 L632,404" fill="none" stroke="#24384A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="755" cy="250" r="4.5" fill="#24384A" stroke="none" stroke-width="0"/><text x="620" y="410" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">一对保卫细胞调节孔隙大</text><text x="620" y="432" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">小，控制气体和水汽进出</text><text x="380" y="490" fill="#24384A" text-anchor="middle" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="650">光合作用和呼吸不是同一件事：有光时两者可同时发生</text></g>
  <rect x="12" y="12" width="936" height="516" rx="8" fill="none" stroke="#203D2D" stroke-width="3" opacity="0.18"/>
