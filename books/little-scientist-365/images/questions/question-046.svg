<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">早晨的露珠从哪里来？</title>
  <desc id="desc">围绕“早晨的露珠从哪里来？”绘制的清晰主题图；具体对象优先，必要关系用箭头表示。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#173746"/></marker>
  </defs>
  <rect width="960" height="540" fill="#F0FDFA"/>
  <path d="M0,455 Q185,410 355,455 T700,455 T1040,455 V540 H0 Z" fill="#0F8A8A" opacity="0.07"/>

  <g data-question="046" data-layout="earth-weather" data-presentation="earth-weather" data-source="earth-weather" data-icons="earth-weather-plate-046"><text x="54" y="54" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="26" font-weight="760">叶面夜里变冷，附近空气中的水汽凝结成露珠</text><rect x="34" y="82" width="892" height="382" rx="4" fill="#DCEEF4" stroke="none" stroke-width="0"/><path d="M34,350 Q175,285 325,350 T635,350 T945,350 V464 H34 Z" fill="#A6C982" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/><path d="M34,425 Q190,380 355,425 T690,425 T1030,425 V464 H34 Z" fill="#5A9258" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/><path d="M233.0,339.5 Q324.0,229.0 467.0,307.0 Q376.0,421.4 233.0,339.5 Z" fill="#5A9258" stroke="#24384A" stroke-width="3.9000000000000004" stroke-linecap="round" stroke-linejoin="round"/><path d="M252.5,333.0 L441.0,310.9" fill="none" stroke="#A6C982" stroke-width="5.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M260,257.25 C252.3,271.25 243.2,283.5 243.2,293.3 C243.2,314.3 276.8,314.3 276.8,293.3 C276.8,283.5 267.7,271.25 260,257.25 Z" fill="#BEE5EA" stroke="#24384A" stroke-width="1.0499999999999998" stroke-linecap="round" stroke-linejoin="round"/><path d="M340,281.8 C333.84,293.0 326.56,302.8 326.56,310.64 C326.56,327.44 353.44,327.44 353.44,310.64 C353.44,302.8 346.16,293.0 340,281.8 Z" fill="#BEE5EA" stroke="#24384A" stroke-width="0.8400000000000001" stroke-linecap="round" stroke-linejoin="round"/><path d="M420,254.2 C412.96,267.0 404.64,278.2 404.64,287.16 C404.64,306.36 435.36,306.36 435.36,287.16 C435.36,278.2 427.04,267.0 420,254.2 Z" fill="#BEE5EA" stroke="#24384A" stroke-width="0.96" stroke-linecap="round" stroke-linejoin="round"/><path d="M180,150 Q240,220 285,265" fill="none" stroke="#A9D9E2" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M340,290 L608,99" fill="none" stroke="#24384A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="340" cy="290" r="4.5" fill="#24384A" stroke="none" stroke-width="0"/><text x="620" y="105" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">露珠来自空气水汽，</text><text x="620" y="127" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">不是叶子把水挤出来</text><path d="M250,340 L608,279" fill="none" stroke="#24384A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="250" cy="340" r="4.5" fill="#24384A" stroke="none" stroke-width="0"/><text x="620" y="285" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">表面温度低于露点时</text><text x="620" y="307" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">，凝结速度超过蒸发</text><text x="420" y="490" fill="#24384A" text-anchor="middle" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="620">风、云、表面材料和位置都会影响露珠多少</text></g>
  <rect x="12" y="12" width="936" height="516" rx="8" fill="none" stroke="#173746" stroke-width="3" opacity="0.18"/>
</svg>
