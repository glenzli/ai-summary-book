<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">齿轮为什么要长牙齿？</title>
  <desc id="desc">围绕“齿轮为什么要长牙齿？”绘制的清晰主题图；具体对象优先，必要关系用箭头表示。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#293747"/></marker>
  </defs>
  <rect width="960" height="540" fill="#FFF7ED"/>
  <path d="M0,455 Q185,410 355,455 T700,455 T1040,455 V540 H0 Z" fill="#3B78A8" opacity="0.07"/>

  <g data-question="187" data-layout="machine" data-presentation="machine" data-source="machine" data-icons="machine-plate-187"><text x="54" y="54" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="26" font-weight="760">相邻齿轮的齿逐个接触传力，转向相反，转速由齿数比决定</text><rect x="34" y="82" width="892" height="382" rx="4" fill="#EFEAE1" stroke="none" stroke-width="0"/><rect x="34" y="360" width="892" height="104" rx="0" fill="#C99B70" stroke="none" stroke-width="0"/><path d="M34,360 L926,360" fill="none" stroke="#24384A" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="330" cy="275" r="95" fill="#4B82B3" stroke="#24384A" stroke-width="4"/><circle cx="330" cy="275" r="30.400000000000002" fill="#FFFFFF" stroke="#24384A" stroke-width="3"/><path d="M425.0,275.0 L442.0,275.0" fill="none" stroke="#24384A" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/><path d="M417.7685555885722,311.35492607468353 L433.4745076412641,317.86054442489007" fill="none" stroke="#24384A" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/><path d="M397.175144212722,342.175144212722 L409.19595949289334,354.1959594928933" fill="none" stroke="#24384A" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/><path d="M366.35492607468353,362.7685555885722 L372.86054442489007,378.4745076412641" fill="none" stroke="#24384A" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/><path d="M330.0,370.0 L330.0,387.0" fill="none" stroke="#24384A" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/><path d="M293.64507392531647,362.7685555885722 L287.13945557510993,378.4745076412641" fill="none" stroke="#24384A" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/><path d="M262.824855787278,342.175144212722 L250.8040405071067,354.19595949289334" fill="none" stroke="#24384A" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/><path d="M242.23144441142776,311.35492607468353 L226.5254923587359,317.86054442489007" fill="none" stroke="#24384A" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/><path d="M235.0,275.0 L218.0,275.0" fill="none" stroke="#24384A" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/><path d="M242.23144441142773,238.64507392531647 L226.52549235873587,232.13945557510996" fill="none" stroke="#24384A" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/><path d="M262.82485578727795,207.824855787278 L250.80404050710666,195.8040405071067" fill="none" stroke="#24384A" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/><path d="M293.6450739253164,187.2314444114278 L287.1394555751099,171.5254923587359" fill="none" stroke="#24384A" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/><path d="M330.0,180.0 L330.0,163.0" fill="none" stroke="#24384A" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/><path d="M366.35492607468353,187.2314444114278 L372.86054442489007,171.5254923587359" fill="none" stroke="#24384A" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/><path d="M397.175144212722,207.82485578727795 L409.1959594928933,195.80404050710666" fill="none" stroke="#24384A" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/><path d="M417.7685555885722,238.6450739253164 L433.4745076412641,232.13945557510988" fill="none" stroke="#24384A" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/><circle cx="580" cy="305" r="62" fill="#DC713E" stroke="#24384A" stroke-width="4"/><circle cx="580" cy="305" r="19.84" fill="#FFFFFF" stroke="#24384A" stroke-width="3"/><path d="M642.0,305.0 L659.0,305.0" fill="none" stroke="#24384A" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/><path d="M632.1577190355332,338.51973068224703 L646.4590290936633,347.7106245789922" fill="none" stroke="#24384A" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/><path d="M605.755730806117,361.3971837119801 L612.817786027149,376.86092763300695" fill="none" stroke="#24384A" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/><path d="M571.1764800270563,366.36892939661783 L568.7571277764105,383.1958939085937" fill="none" stroke="#24384A" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/><path d="M539.3986344953923,351.85647360996404 L528.2660020183225,364.7042163739864" fill="none" stroke="#24384A" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/><path d="M520.5114356359012,322.46741852416864 L504.2000550844547,327.256871990473" fill="none" stroke="#24384A" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/><path d="M520.5114356359012,287.53258147583136 L504.2000550844547,282.7431280095271" fill="none" stroke="#24384A" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/><path d="M539.3986344953923,258.143526390036 L528.2660020183225,245.2957836260136" fill="none" stroke="#24384A" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/><path d="M571.1764800270563,243.63107060338217 L568.7571277764105,226.8041060914063" fill="none" stroke="#24384A" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/><path d="M605.755730806117,248.60281628801985 L612.8177860271489,233.13907236699305" fill="none" stroke="#24384A" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/><path d="M632.1577190355332,271.48026931775297 L646.4590290936633,262.2893754210078" fill="none" stroke="#24384A" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/><path d="M225,180 A130,130 0 0 1 330,135" fill="none" stroke="#2A5F89" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M655,220 A95,95 0 0 1 675,320" fill="none" stroke="#C95757" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M455,285 L638,109" fill="none" stroke="#24384A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="455" cy="285" r="4.5" fill="#24384A" stroke="none" stroke-width="0"/><text x="650" y="115" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">接触点沿共同切线传递力</text><path d="M330,275 L638,249" fill="none" stroke="#24384A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="330" cy="275" r="4.5" fill="#24384A" stroke="none" stroke-width="0"/><text x="650" y="255" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">大齿轮齿数多，同一时间转角较小</text><path d="M580,305 L638,389" fill="none" stroke="#24384A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="580" cy="305" r="4.5" fill="#24384A" stroke="none" stroke-width="0"/><text x="650" y="395" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">小齿轮转得更快，</text><text x="650" y="417" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">但可用扭矩相应改变</text></g>
  <rect x="12" y="12" width="936" height="516" rx="8" fill="none" stroke="#293747" stroke-width="3" opacity="0.18"/>
