  <g data-question="067" data-layout="plant" data-presentation="plant" data-source="plant" data-icons="plant-plate-067"><text x="54" y="54" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="26" font-weight="760">植物用光能把二氧化碳和水重新组合成糖</text><rect x="34" y="82" width="892" height="382" rx="4" fill="#DDEFF3" stroke="none" stroke-width="0"/><path d="M34,330 Q170,280 315,330 T610,330 T920,330 V464 H34 Z" fill="#A7C97E" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/><rect x="34" y="360" width="892" height="104" rx="0" fill="#B8845D" stroke="none" stroke-width="0"/><path d="M34,360 Q175,328 320,360 T610,360 T930,360" fill="none" stroke="#4F8A55" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><path d="M470,330 L470,211.25" fill="none" stroke="#2F6744" stroke-width="9.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M470,249.25 Q408.25,192.25 370.25,236.9 Q411.1,282.5 470,263.5 Z" fill="#4F8A55" stroke="#24384A" stroke-width="2.8499999999999996" stroke-linecap="round" stroke-linejoin="round"/><path d="M470,223.60000000000002 Q531.75,171.35 574.5,220.75 Q528.9,269.2 470,246.4 Z" fill="#8FC676" stroke="#24384A" stroke-width="2.8499999999999996" stroke-linecap="round" stroke-linejoin="round"/><circle cx="150" cy="145" r="48" fill="#E6B542" stroke="#24384A" stroke-width="3"/><path d="M185,165 Q305,180 390,230" fill="none" stroke="#D9703D" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M160,355 Q290,340 400,300" fill="none" stroke="#4D86B5" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M780,250 Q650,230 555,250" fill="none" stroke="#2D8178" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M555,285 Q655,330 785,335" fill="none" stroke="#2F6744" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="145" y="230" fill="#24384A" text-anchor="middle" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="21" font-weight="650">光能</text><text x="150" y="390" fill="#24384A" text-anchor="middle" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="21" font-weight="650">根吸收的水</text><text x="795" y="225" fill="#24384A" text-anchor="middle" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="21" font-weight="650">二氧化碳</text><text x="800" y="375" fill="#24384A" text-anchor="middle" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="21" font-weight="650">糖和氧气</text><text x="480" y="485" fill="#24384A" text-anchor="middle" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="680">糖既能供呼吸释放能量，也能变成淀粉、纤维和新的身体</text></g>
