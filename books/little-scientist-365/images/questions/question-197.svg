  <g data-question="197" data-layout="machine" data-presentation="machine" data-source="machine" data-icons="machine-plate-197"><text x="54" y="54" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="26" font-weight="760">闭合电路给电荷提供连续路径，灯丝或 LED 才能持续传递能量</text><rect x="34" y="82" width="892" height="382" rx="4" fill="#EFEAE1" stroke="none" stroke-width="0"/><rect x="34" y="360" width="892" height="104" rx="0" fill="#C99B70" stroke="none" stroke-width="0"/><path d="M34,360 L926,360" fill="none" stroke="#24384A" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><rect x="171.5" y="209.5" width="77.0" height="121.00000000000001" rx="5.5" fill="#4B82B3" stroke="#24384A" stroke-width="2.2"/><rect x="196.25" y="198.5" width="27.500000000000004" height="11.0" rx="1.6500000000000001" fill="#DC713E" stroke="#24384A" stroke-width="1.6500000000000001"/><text x="210" y="250.75" fill="#FFFFFF" text-anchor="middle" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="750">+</text><text x="210" y="303.0" fill="#FFFFFF" text-anchor="middle" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="750">−</text><circle cx="690" cy="226.25" r="37.5" fill="#E6B441" stroke="#24384A" stroke-width="3.0"/><rect x="669.0" y="261.5" width="42.0" height="37.5" rx="3.75" fill="#AAB7BD" stroke="#24384A" stroke-width="2.25"/><path d="M739.5,226.25 L759.0,226.25" fill="none" stroke="#DC713E" stroke-width="3.0" stroke-linecap="round" stroke-linejoin="round"/><path d="M725.0017856687341,261.2517856687341 L738.7903679018718,275.0403679018718" fill="none" stroke="#DC713E" stroke-width="3.0" stroke-linecap="round" stroke-linejoin="round"/><path d="M690.0,275.75 L690.0,295.25" fill="none" stroke="#DC713E" stroke-width="3.0" stroke-linecap="round" stroke-linejoin="round"/><path d="M654.9982143312659,261.2517856687341 L641.2096320981282,275.0403679018718" fill="none" stroke="#DC713E" stroke-width="3.0" stroke-linecap="round" stroke-linejoin="round"/><path d="M640.5,226.25 L621.0,226.25" fill="none" stroke="#DC713E" stroke-width="3.0" stroke-linecap="round" stroke-linejoin="round"/><path d="M654.9982143312659,191.2482143312659 L641.2096320981282,177.45963209812822" fill="none" stroke="#DC713E" stroke-width="3.0" stroke-linecap="round" stroke-linejoin="round"/><path d="M690.0,176.75 L690.0,157.25" fill="none" stroke="#DC713E" stroke-width="3.0" stroke-linecap="round" stroke-linejoin="round"/><path d="M725.0017856687341,191.2482143312659 L738.7903679018717,177.45963209812822" fill="none" stroke="#DC713E" stroke-width="3.0" stroke-linecap="round" stroke-linejoin="round"/><rect x="420" y="205" width="90" height="45" rx="5" fill="#FFFFFF" stroke="#24384A" stroke-width="3"/><circle cx="440" cy="227" r="10" fill="#4B82B3" stroke="none" stroke-width="0"/><circle cx="490" cy="227" r="10" fill="#4B82B3" stroke="none" stroke-width="0"/><path d="M210,135 H690 V180 M210,405 H690 V315" fill="none" stroke="#2A5F89" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><path d="M420,227 L510,227" fill="none" stroke="#5B9159" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><path d="M465,227 L608,99" fill="none" stroke="#24384A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="465" cy="227" r="4.5" fill="#24384A" stroke="none" stroke-width="0"/><text x="620" y="105" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">开关闭合，整条回路连续</text><path d="M690,245 L632,399" fill="none" stroke="#24384A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="690" cy="245" r="4.5" fill="#24384A" stroke="none" stroke-width="0"/><text x="620" y="405" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">能量从电源