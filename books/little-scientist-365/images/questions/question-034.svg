<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">为什么风有大有小？</title>
  <desc id="desc">围绕“为什么风有大有小？”绘制的清晰主题图；具体对象优先，必要关系用箭头表示。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#173746"/></marker>
  </defs>
  <rect width="960" height="540" fill="#F0FDFA"/>
  <path d="M0,455 Q185,410 355,455 T700,455 T1040,455 V540 H0 Z" fill="#0F8A8A" opacity="0.07"/>

  <g data-question="034" data-layout="earth-weather" data-presentation="earth-weather" data-source="earth-weather" data-icons="earth-weather-plate-034"><text x="54" y="54" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="26" font-weight="760">风速不同会让风袋、树枝和旗帜呈现不同弯曲程度</text><rect x="34" y="82" width="892" height="382" rx="4" fill="#DCEEF4" stroke="none" stroke-width="0"/><path d="M34,350 Q175,285 325,350 T635,350 T945,350 V464 H34 Z" fill="#A6C982" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/><path d="M34,425 Q190,380 355,425 T690,425 T1030,425 V464 H34 Z" fill="#5A9258" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/><path d="M250,390 L250,155" fill="none" stroke="#24384A" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/><path d="M250,170 Q285.0,180 320,220 Q285.0,250 250,230 Z" fill="#5A9258" stroke="#24384A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M100,190 L205,190" fill="none" stroke="#4B86B7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M100,225 L205,225" fill="none" stroke="#4B86B7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M700,390 L700,155" fill="none" stroke="#24384A" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/><path d="M700,170 Q775.0,180 850,220 Q775.0,250 700,230 Z" fill="#DE753E" stroke="#24384A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M550,190 L655,190" fill="none" stroke="#4B86B7" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M550,225 L655,225" fill="none" stroke="#4B86B7" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M550,260 L655,260" fill="none" stroke="#4B86B7" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M550,295 L655,295" fill="none" stroke="#4B86B7" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M550,330 L655,330" fill="none" stroke="#4B86B7" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="250" y="455" fill="#24384A" text-anchor="middle" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="21" font-weight="650">较小风速</text><text x="700" y="455" fill="#24384A" text-anchor="middle" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="21" font-weight="650">较大风速</text><text x="480" y="500" fill="#24384A" text-anchor="middle" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="700">阵风会不断变化；测量风速要在规定条件下重复取样</text></g>
  <rect x="12" y="12" width="936" height="516" rx="8" fill="none" stroke="#173746" stroke-width="3" opacity="0.18"/>
</svg>
