  <g data-question="096" data-layout="invertebrate" data-presentation="invertebrate" data-source="invertebrate" data-icons="butterfly-feeding,proboscis,flower,nectar"><text x="54" y="54" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="26" font-weight="760">蝴蝶把卷曲的口器伸进花里吸取花蜜</text><ellipse cx="315" cy="230" rx="62" ry="92" fill="#D9693F" stroke="#24384A" stroke-width="4"/><ellipse cx="455" cy="230" rx="62" ry="92" fill="#287F78" stroke="#24384A" stroke-width="4"/><ellipse cx="325" cy="355" rx="52" ry="65" fill="#E7B33F" stroke="#24384A" stroke-width="4"/><ellipse cx="445" cy="355" rx="52" ry="65" fill="#D9693F" stroke="#24384A" stroke-width="4"/><rect x="376" y="180" width="18" height="210" rx="9" fill="#24384A" stroke="#24384A" stroke-width="2"/><circle cx="385" cy="164" r="24" fill="#24384A" stroke="none" stroke-width="0"/><path d="M382,174 C430,175 500,245 520,326 C529,365 551,360 555,334" fill="none" stroke="#57483D" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><path d="M555,334 q22,28 39,0 q14,-22 30,1" fill="none" stroke="#57483D" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><path d="M565,360 L565,440" fill="none" stroke="#568A58" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/><circle cx="565" cy="330" r="35" fill="#C94F4F" stroke="#24384A" stroke-width="3"/><circle cx="530" cy="350" r="30" fill="#D9693F" stroke="#24384A" stroke-width="3"/><circle cx="600" cy="350" r="30" fill="#E7B33F" stroke="#24384A" stroke-width="3"/><circle cx="565" cy="370" r="30" fill="#E889AA" stroke="#24384A" stroke-width="3"/><circle cx="565" cy="345" r="20" fill="#F2C75C" stroke="#24384A" stroke-width="2"/><path d="M505,302 L693,139" fill="none" stroke="#24384A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="505" cy="302" r="4.5" fill="#24384A" stroke="none" stroke-width="0"/><text x="705" y="145" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">口器平时卷起</text><path d="M555,334 L693,249" fill="none" stroke="#24384A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="555" cy="334" r="4.5" fill="#24384A" stroke="none" stroke-width="0"/><text x="705" y="255" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">吸食时伸成长管</text><path d="M565,350 L693,364" fill="none" stroke="#24384A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="565" cy="350" r="4.5" fill="#24384A" stroke="none" stroke-width="0"/><text x="705" y="370" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">花蜜藏在花的深处</text><text x="330" y="485" fill="#24384A" text-anchor="middle" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="600">这根长管叫喙，不是吸管一样的硬管</text></g>
