<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">螳螂为什么把前腿举起来？</title>
  <desc id="desc">围绕“螳螂为什么把前腿举起来？”绘制的清晰主题图；具体对象优先，必要关系用箭头表示。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#3D2E35"/></marker>
  </defs>
  <rect width="960" height="540" fill="#FFF8ED"/>
  <path d="M0,455 Q185,410 355,455 T700,455 T1040,455 V540 H0 Z" fill="#E66A3D" opacity="0.07"/>
  <g opacity="0.16"><path d="M40,460 Q160,390 280,460 T520,460 T760,460 T1000,460" fill="none" stroke="#E66A3D" stroke-width="8.0" stroke-linecap="round" stroke-linejoin="round"/></g>
  <g data-question="105" data-layout="invertebrate" data-presentation="invertebrate" data-source="invertebrate" data-icons="mantis-foreleg,raptorial-leg,spines,joint"><text x="54" y="54" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="26" font-weight="760">螳螂举起的是带刺、能快速折叠的捕捉前足</text><ellipse cx="410" cy="275" rx="45" ry="115" fill="#568A58" stroke="#24384A" stroke-width="4"/><polygon points="390,165 430,165 460,95 410,70 360,95" fill="#287F78" stroke="#24384A" stroke-width="3" stroke-linejoin="round"/><circle cx="390" cy="100" r="8" fill="#FFFFFF" stroke="#24384A" stroke-width="2"/><circle cx="430" cy="100" r="8" fill="#FFFFFF" stroke="#24384A" stroke-width="2"/><path d="M382,205 L275,135 L215,235 L315,260" fill="none" stroke="#568A58" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/><path d="M438,205 L545,135 L605,235 L505,260" fill="none" stroke="#568A58" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/><path d="M275,135 L215,235 M545,135 L605,235" fill="none" stroke="#24384A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><polygon points="215,220 198,239 211,244" fill="#D9693F" stroke="#24384A" stroke-width="1.5" stroke-linejoin="round"/><polygon points="230,223 213,241 226,247" fill="#D9693F" stroke="#24384A" stroke-width="1.5" stroke-linejoin="round"/><polygon points="245,226 228,243 241,250" fill="#D9693F" stroke="#24384A" stroke-width="1.5" stroke-linejoin="round"/><polygon points="260,229 243,245 256,253" fill="#D9693F" stroke="#24384A" stroke-width="1.5" stroke-linejoin="round"/><polygon points="275,232 258,247 271,256" fill="#D9693F" stroke="#24384A" stroke-width="1.5" stroke-linejoin="round"/><polygon points="605,220 622,239 609,244" fill="#D9693F" stroke="#24384A" stroke-width="1.5" stroke-linejoin="round"/><polygon points="590,223 607,241 594,247" fill="#D9693F" stroke="#24384A" stroke-width="1.5" stroke-linejoin="round"/><polygon points="575,226 592,243 579,250" fill="#D9693F" stroke="#24384A" stroke-width="1.5" stroke-linejoin="round"/><polygon points="560,229 577,245 564,253" fill="#D9693F" stroke="#24384A" stroke-width="1.5" stroke-linejoin="round"/><polygon points="545,232 562,247 549,256" fill="#D9693F" stroke="#24384A" stroke-width="1.5" stroke-linejoin="round"/><path d="M392,330 L300,435 L245,425 M428,330 L520,435 L575,425" fill="none" stroke="#24384A" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/><path d="M275,135 L693,109" fill="none" stroke="#24384A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="275" cy="135" r="4.5" fill="#24384A" stroke="none" stroke-width="0"/><text x="705" y="107" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">前足的多个关</text><text x="705" y="128" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">节能迅速折叠</text><path d="M230,235 L693,229" fill="none" stroke="#24384A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="230" cy="235" r="4.5" fill="#24384A" stroke="none" stroke-width="0"/><text x="705" y="235" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">内侧尖刺帮助夹住猎物</text><path d="M410,185 L693,349" fill="none" stroke="#24384A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="410" cy="185" r="4.5" fill="#24384A" stroke="none" stroke-width="0"/><text x="705" y="347" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">静止举起是在等</text><text x="705" y="368" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">待，不是在祈祷</text></g>
  <rect x="12" y="12" width="936" height="516" rx="8" fill="none" stroke="#3D2E35" stroke-width="3" opacity="0.18"/>
