<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">星星为什么一闪一闪？</title>
  <desc id="desc">围绕“星星为什么一闪一闪？”绘制的清晰主题图；具体对象优先，必要关系用箭头表示。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#17213A"/></marker>
  </defs>
  <rect width="960" height="540" fill="#F4F9FF"/>
  <path d="M0,455 Q185,410 355,455 T700,455 T1040,455 V540 H0 Z" fill="#2563EB" opacity="0.07"/>

  <g data-question="013" data-layout="earth-weather" data-presentation="earth-weather" data-source="earth-weather" data-icons="earth-weather-plate-013"><text x="54" y="54" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="26" font-weight="760">星光穿过不停流动的空气层，方向和亮度会快速微变</text><rect x="34" y="82" width="892" height="382" rx="4" fill="#273552" stroke="none" stroke-width="0"/><circle cx="170" cy="150" r="13" fill="#E8B642" stroke="none" stroke-width="0"/><path d="M175,160 C240,185 205,220 290,245 S355,305 420,300 S505,345 560,330" fill="none" stroke="#E8B642" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M560,330 Q655,340 730,355" fill="none" stroke="#F7E9CA" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="810" cy="307.25" r="13.5" fill="#E7B39E" stroke="#24384A" stroke-width="1.35"/><path d="M810,322.1 L810,370.25" fill="none" stroke="#273552" stroke-width="5.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M810,341.0 L782.1,356.75" fill="none" stroke="#273552" stroke-width="4.05" stroke-linecap="round" stroke-linejoin="round"/><path d="M810,341.0 L837.9,356.75" fill="none" stroke="#273552" stroke-width="4.05" stroke-linecap="round" stroke-linejoin="round"/><path d="M810,368.9 L788.4,401.75" fill="none" stroke="#273552" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M810,368.9 L831.6,401.75" fill="none" stroke="#273552" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M205,205 q45,-28 90,0" fill="none" stroke="#2D8178" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M315,275 q45,-28 90,0" fill="none" stroke="#2D8178" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M455,325 q45,-28 90,0" fill="none" stroke="#2D8178" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M360,275 L608,109" fill="none" stroke="#24384A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="360" cy="275" r="4.5" fill="#24384A" stroke="none" stroke-width="0"/><text x="620" y="115" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">温度不同的空气团密度</text><text x="620" y="137" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">稍有差别，光路跟着弯动</text><text x="420" y="490" fill="#FFFFFF" text-anchor="middle" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="650">行星也会受大气影响，但视面较大，通常比恒星闪烁少</text></g>
  <rect x="12" y="12" width="936" height="516" rx="8" fill="none" stroke="#17213A" stroke-width="3" opacity="0.18"/>
</svg>
