  <g data-question="195" data-layout="machine" data-presentation="machine" data-source="machine" data-icons="machine-plate-195"><text x="54" y="54" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="26" font-weight="760">指南针磁针沿地球附近的磁场方向转动</text><rect x="34" y="82" width="892" height="382" rx="4" fill="#EFEAE1" stroke="none" stroke-width="0"/><rect x="34" y="360" width="892" height="104" rx="0" fill="#C99B70" stroke="none" stroke-width="0"/><path d="M34,360 L926,360" fill="none" stroke="#24384A" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="330" cy="275" r="150" fill="#FFFFFF" stroke="#24384A" stroke-width="5"/><polygon points="330,125 350,275 330,245 310,275" fill="#C95757" stroke="#24384A" stroke-width="3" stroke-linejoin="round"/><polygon points="330,425 350,275 330,305 310,275" fill="#4B82B3" stroke="#24384A" stroke-width="3" stroke-linejoin="round"/><circle cx="700" cy="270" r="95" fill="#4B82B3" stroke="#24384A" stroke-width="4"/><path d="M650,210 Q700,175 750,210 M650,330 Q700,365 750,330" fill="none" stroke="#5B9159" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><path d="M700,120 Q565,270 700,420 M700,120 Q835,270 700,420" fill="none" stroke="#2A5F89" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M330,150 L608,99" fill="none" stroke="#24384A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="330" cy="150" r="4.5" fill="#24384A" stroke="none" stroke-width="0"/><text x="620" y="105" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">红端通常指向磁北附近</text><text x="620" y="127" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">，不是精确地理北极</text><path d="M700,270 L632,399" fill="none" stroke="#24384A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="700" cy="270" r="4.5" fill="#24384A" stroke="none" stroke-width="0"/><text x="620" y="405" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">地核流动产生的地磁场会缓慢变化</text></g>
