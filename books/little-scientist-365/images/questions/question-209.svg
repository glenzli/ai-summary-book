  <g data-question="209" data-layout="machine" data-presentation="machine" data-source="machine" data-icons="machine-plate-209"><text x="54" y="54" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="26" font-weight="760">拱把桥面重量沿弧形变成压力，并推向两侧桥墩和地基</text><rect x="34" y="82" width="892" height="382" rx="4" fill="#DFEEF1" stroke="none" stroke-width="0"/><path d="M120,390 Q480,70 840,390" fill="none" stroke="#AAB7BD" stroke-width="70" stroke-linecap="round" stroke-linejoin="round"/><path d="M120,390 Q480,135 840,390" fill="none" stroke="#DFEEF1" stroke-width="40" stroke-linecap="round" stroke-linejoin="round"/><rect x="70" y="370" width="120" height="70" rx="4" fill="#896448" stroke="#24384A" stroke-width="4"/><rect x="770" y="370" width="120" height="70" rx="4" fill="#896448" stroke="#24384A" stroke-width="4"/><path d="M249.6,174.44799999999998 L249.6,224.44799999999998" fill="none" stroke="#C95757" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M357.6,99.47799999999998 L357.6,149.47799999999998" fill="none" stroke="#C95757" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M480.0,70.0 L480.0,120.0" fill="none" stroke="#C95757" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M602.4000000000001,99.47800000000001 L602.4000000000001,149.478" fill="none" stroke="#C95757" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M710.4,174.44799999999995 L710.4,224.44799999999995" fill="none" stroke="#C95757" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M160,385 L80,420" fill="none" stroke="#4B82B3" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M800,385 L880,420" fill="none" stroke="#4B82B3" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M480,150 L608,99" fill="none" stroke="#24384A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="480" cy="150" r="4.5" fill="#24384A" stroke="none" stroke-width="0"/><text x="620" y="105" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">石块互相挤压，把力沿拱圈传递</text><path d="M800,390 L632,374" fill="none" stroke="#24384A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="800" cy="390" r="4.5" fill="#24384A" stroke="none" stroke-width="0"/><text x="620" y="380" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">桥台必须抵抗向外推力</text></g>
