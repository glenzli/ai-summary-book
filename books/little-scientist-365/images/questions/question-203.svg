<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">水龙头怎样让水停下来？</title>
  <desc id="desc">围绕“水龙头怎样让水停下来？”绘制的清晰主题图；具体对象优先，必要关系用箭头表示。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#293747"/></marker>
  </defs>
  <rect width="960" height="540" fill="#FFF7ED"/>
  <path d="M0,455 Q185,410 355,455 T700,455 T1040,455 V540 H0 Z" fill="#3B78A8" opacity="0.07"/>

  <g data-question="203" data-layout="machine" data-presentation="machine" data-source="machine" data-icons="machine-plate-203"><text x="54" y="54" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="26" font-weight="760">水龙头转动阀芯，改变水能通过的开口面积</text><rect x="34" y="82" width="892" height="382" rx="4" fill="#EFEAE1" stroke="none" stroke-width="0"/><rect x="34" y="360" width="892" height="104" rx="0" fill="#C99B70" stroke="none" stroke-width="0"/><path d="M34,360 L926,360" fill="none" stroke="#24384A" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M160,315 H430 V205 H650 Q710,205 710,265 V315" fill="none" stroke="#AAB7BD" stroke-width="42" stroke-linecap="round" stroke-linejoin="round"/><path d="M160,315 H430 V205 H650 Q710,205 710,265 V315" fill="none" stroke="#A8D9E2" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/><rect x="360" y="170" width="140" height="70" rx="8" fill="#4B82B3" stroke="#24384A" stroke-width="4"/><path d="M430,170 L430,120" fill="none" stroke="#24384A" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><rect x="350" y="95" width="160" height="35" rx="15" fill="#C95757" stroke="#24384A" stroke-width="3"/><circle cx="430" cy="205" r="28" fill="#F7E9CA" stroke="#24384A" stroke-width="3"/><path d="M405,205 L455,205" fill="none" stroke="#C95757" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><path d="M710,315 L710,395" fill="none" stroke="#4B82B3" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M430,205 L608,99" fill="none" stroke="#24384A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="430" cy="205" r="4.5" fill="#24384A" stroke="none" stroke-width="0"/><text x="620" y="105" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">阀芯开口与管道对齐时水可通过</text><path d="M430,120 L608,244" fill="none" stroke="#24384A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="430" cy="120" r="4.5" fill="#24384A" stroke="none" stroke-width="0"/><text x="620" y="250" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">手柄通过螺纹、陶</text><text x="620" y="272" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">瓷片或球阀控制开度</text><text x="430" y="495" fill="#24384A" text-anchor="middle" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="660">关上不是把水“消失”，而是阻断压差驱动的流路</text></g>
  <rect x="12" y="12" width="936" height="516" rx="8" fill="none" stroke="#293747" stroke-width="3" opacity="0.18"/>
</svg>
