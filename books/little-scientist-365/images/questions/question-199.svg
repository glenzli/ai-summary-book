A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">转矩持续同一转向</text><path d="M720,255 L632,399" fill="none" stroke="#24384A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="720" cy="255" r="4.5" fill="#24384A" stroke="none" stroke-width="0"/><text x="620" y="405" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">转轴把旋转传给齿轮、风扇或车轮</text></g>
