<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">钥匙为什么只能开合适的锁？</title>
  <desc id="desc">围绕“钥匙为什么只能开合适的锁？”绘制的清晰主题图；具体对象优先，必要关系用箭头表示。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#293747"/></marker>
  </defs>
  <rect width="960" height="540" fill="#FFF7ED"/>
  <path d="M0,455 Q185,410 355,455 T700,455 T1040,455 V540 H0 Z" fill="#3B78A8" opacity="0.07"/>

  <g data-question="206" data-layout="machine" data-presentation="machine" data-source="machine" data-icons="machine-plate-206"><text x="54" y="54" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="26" font-weight="760">合适钥匙把每一组锁芯弹子顶到同一剪切线，锁芯才能转动</text><rect x="34" y="82" width="892" height="382" rx="4" fill="#EFEAE1" stroke="none" stroke-width="0"/><rect x="34" y="360" width="892" height="104" rx="0" fill="#C99B70" stroke="none" stroke-width="0"/><path d="M34,360 L926,360" fill="none" stroke="#24384A" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="330" cy="275" r="155" fill="#AAB7BD" stroke="#24384A" stroke-width="5"/><circle cx="330" cy="275" r="105" fill="#F7E9CA" stroke="#24384A" stroke-width="4"/><rect x="250" y="150" width="22" height="55" rx="4" fill="#4B82B3" stroke="#24384A" stroke-width="2"/><rect x="250" y="205" width="22" height="170" rx="4" fill="#C95757" stroke="#24384A" stroke-width="2"/><rect x="290" y="150" width="22" height="85" rx="4" fill="#4B82B3" stroke="#24384A" stroke-width="2"/><rect x="290" y="235" width="22" height="140" rx="4" fill="#C95757" stroke="#24384A" stroke-width="2"/><rect x="330" y="150" width="22" height="42" rx="4" fill="#4B82B3" stroke="#24384A" stroke-width="2"/><rect x="330" y="192" width="22" height="183" rx="4" fill="#C95757" stroke="#24384A" stroke-width="2"/><rect x="370" y="150" width="22" height="72" rx="4" fill="#4B82B3" stroke="#24384A" stroke-width="2"/><rect x="370" y="222" width="22" height="153" rx="4" fill="#C95757" stroke="#24384A" stroke-width="2"/><rect x="410" y="150" width="22" height="60" rx="4" fill="#4B82B3" stroke="#24384A" stroke-width="2"/><rect x="410" y="210" width="22" height="165" rx="4" fill="#C95757" stroke="#24384A" stroke-width="2"/><path d="M170,330 H520 L560,300 L530,280 L560,260 L520,235 H170 Z" fill="#E6B441" stroke="#24384A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M180,250 L500,250" fill="none" stroke="#2C8178" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="8 6"/><path d="M350,250 L608,99" fill="none" stroke="#24384A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="350" cy="250" r="4.5" fill="#24384A" stroke="none" stroke-width="0"/><text x="620" y="105" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">正确钥匙让各接缝正好落在剪切线</text><path d="M260,180 L608,274" fill="none" stroke="#24384A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="260" cy="180" r="4.5" fill="#24384A" stroke="none" stroke-width="0"/><text x="620" y="280" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">高度不对时弹子跨过</text><text x="620" y="302" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">边界，阻止锁芯旋转</text></g>
  <rect x="12" y="12" width="936" height="516" rx="8" fill="none" stroke="#293747" stroke-width="3" opacity="0.18"/>
</svg>
