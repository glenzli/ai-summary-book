  <g data-question="121" data-layout="vertebrate" data-presentation="vertebrate" data-source="vertebrate" data-icons="vertebrate-plate-121"><text x="54" y="54" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="26" font-weight="760">一根羽毛由羽轴、羽枝和互相扣住的小钩组成</text><path d="M335,458.4 Q345.2,285 380.9,121.80000000000001" fill="none" stroke="#57483D" stroke-width="8.16" stroke-linecap="round" stroke-linejoin="round"/><path d="M343.16,387.0 Q243.2,330.9 197.3,228.9 Q278.9,164.64 375.8,137.1" fill="#F6E9CF" stroke="#24384A" stroke-width="4.08" stroke-linecap="round" stroke-linejoin="round"/><path d="M347.24,382.92 Q431.9,320.7 457.4,213.6 Q418.64,156.48 377.84000000000003,132.0" fill="#FFFFFF" stroke="#24384A" stroke-width="4.08" stroke-linecap="round" stroke-linejoin="round"/><path d="M355.4,172.8 L275.84,137.1" fill="none" stroke="#C95555" stroke-width="2.55" stroke-linecap="round" stroke-linejoin="round"/><path d="M355.4,203.4 L269.72,167.7" fill="none" stroke="#C95555" stroke-width="2.55" stroke-linecap="round" stroke-linejoin="round"/><path d="M355.4,234.0 L263.6,198.3" fill="none" stroke="#C95555" stroke-width="2.55" stroke-linecap="round" stroke-linejoin="round"/><path d="M355.4,264.6 L257.48,228.9" fill="none" stroke="#C95555" stroke-width="2.55" stroke-linecap="round" stroke-linejoin="round"/><path d="M355.4,295.2 L251.36,259.5" fill="none" stroke="#C95555" stroke-width="2.55" stroke-linecap="round" stroke-linejoin="round"/><path d="M355.4,325.8 L245.24,290.1" fill="none" stroke="#C95555" stroke-width="2.55" stroke-linecap="round" stroke-linejoin="round"/><path d="M355.4,356.4 L239.12,320.7" fill="none" stroke="#C95555" stroke-width="2.55" stroke-linecap="round" stroke-linejoin="round"/><rect x="625" y="130" width="240" height="225" rx="12" fill="#F6E9CF" stroke="#24384A" stroke-width="3"/><path d="M660,315 L820,175" fill="none" stroke="#57483D" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M690,292 L650,245" fill="none" stroke="#4C86B8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M720,265 L680,217" fill="none" stroke="#4C86B8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M750,238 L710,190" fill="none" stroke="#4C86B8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M720,265 L770,300" fill="none" stroke="#C95555" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M750,238 L800,273" fill="none" stroke="#C95555" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M355,300 L663,399" fill="none" stroke="#24384A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="355" cy="300" r="4.5" fill="#24384A" stroke="none" stroke-width="0"/><text x="675" y="405" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">羽轴支撑整片羽毛</text><path d="M738,250 L662,99" fill="none" stroke="#24384A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="738" cy="250" r="4.5" fill="#24384A" stroke="none" stroke-width="0"/><text x="650" y="105" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">小钩把相邻羽枝扣成连续的羽片</text><text x="410" y="500" fill="#24384A" text-anchor="middle" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="650">飞羽推空气，绒羽留住空气，体表羽毛也能防水和展示</text></g>
