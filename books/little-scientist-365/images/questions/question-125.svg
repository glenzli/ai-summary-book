<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">啄木鸟不停啄树，头不晕吗？</title>
  <desc id="desc">围绕“啄木鸟不停啄树，头不晕吗？”绘制的清晰主题图；具体对象优先，必要关系用箭头表示。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#24324A"/></marker>
  </defs>
  <rect width="960" height="540" fill="#FFF4F7"/>
  <path d="M0,455 Q185,410 355,455 T700,455 T1040,455 V540 H0 Z" fill="#2563A6" opacity="0.07"/>

  <g data-question="125" data-layout="vertebrate" data-presentation="vertebrate" data-source="vertebrate" data-icons="vertebrate-plate-125"><text x="54" y="54" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="26" font-weight="760">啄木鸟用直线啄击、强壮颈肌和特殊头部结构分散冲击</text><rect x="34" y="82" width="892" height="382" rx="4" fill="#DDEEF4" stroke="none" stroke-width="0"/><path d="M34,350 Q180,285 335,350 T650,350 T960,350 V464 H34 Z" fill="#A8CA83" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/><path d="M34,425 Q190,382 360,425 T700,425 T1040,425 V464 H34 Z" fill="#5C9659" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/><rect x="475" y="90" width="92" height="365" rx="35" fill="#8B6549" stroke="#24384A" stroke-width="4"/><ellipse cx="360" cy="265" rx="86.1" ry="52.48" fill="#3E77AF" stroke="#24384A" stroke-width="3.28"/><circle cx="428.88" cy="225.64" r="34.44" fill="#D9693F" stroke="#24384A" stroke-width="3.28"/><polygon points="456.76,222.36 499.4,236.3 457.58,248.6" fill="#E6B542" stroke="#24384A" stroke-width="2.46" stroke-linejoin="round"/><polygon points="282.1,256.8 224.70000000000002,219.9 243.56,285.5" fill="#C95555" stroke="#24384A" stroke-width="2.46" stroke-linejoin="round"/><path d="M309.16,258.44 Q360,191.2 399.36,263.36 Q360,296.15999999999997 309.16,258.44 Z" fill="#F6E9CF" stroke="#24384A" stroke-width="2.46" stroke-linecap="round" stroke-linejoin="round"/><circle cx="435.44" cy="219.9" r="4.1" fill="#24384A" stroke="none" stroke-width="0"/><polygon points="417.4,192.84 435.44,161.68 451.84,197.76" fill="#C95555" stroke="#24384A" stroke-width="2.46" stroke-linejoin="round"/><path d="M500,235 q40,-18 0,-36 q42,-18 0,-36" fill="none" stroke="#D9693F" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><rect x="665" y="135" width="205" height="205" rx="100" fill="#F6E9CF" stroke="#24384A" stroke-width="3"/><circle cx="765" cy="230" r="68" fill="#E7D9BF" stroke="#24384A" stroke-width="4"/><ellipse cx="775" cy="235" rx="42" ry="27" fill="#D88D9A" stroke="#24384A" stroke-width="3"/><path d="M765,230 L637,394" fill="none" stroke="#24384A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="765" cy="230" r="4.5" fill="#24384A" stroke="none" stroke-width="0"/><text x="625" y="400" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">紧贴头骨的大脑与</text><text x="625" y="422" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">缓冲组织减少晃动</text><path d="M415,235 L618,104" fill="none" stroke="#24384A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="415" cy="235" r="4.5" fill="#24384A" stroke="none" stroke-width="0"/><text x="630" y="110" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">喙尽量沿直线撞击树干</text><text x="405" y="495" fill="#24384A" text-anchor="middle" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">这不是“完全不怕震”，而是多种结构一起降低损伤风险</text></g>
  <rect x="12" y="12" width="936" height="516" rx="8" fill="none" stroke="#24324A" stroke-width="3" opacity="0.18"/>
