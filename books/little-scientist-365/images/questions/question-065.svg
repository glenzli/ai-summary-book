<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">叶子为什么又薄又平？</title>
  <desc id="desc">围绕“叶子为什么又薄又平？”绘制的清晰主题图；具体对象优先，必要关系用箭头表示。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#203D2D"/></marker>
  </defs>
  <rect width="960" height="540" fill="#F5FBEF"/>
  <path d="M0,455 Q185,410 355,455 T700,455 T1040,455 V540 H0 Z" fill="#3B8C5A" opacity="0.07"/>

  <g data-question="065" data-layout="plant" data-presentation="plant" data-source="plant" data-icons="plant-plate-065"><text x="54" y="54" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="26" font-weight="760">薄而平的叶片能接到更多光，也缩短气体进入细胞的距离</text><rect x="34" y="82" width="892" height="382" rx="4" fill="#DDEFF3" stroke="none" stroke-width="0"/><path d="M34,330 Q170,280 315,330 T610,330 T920,330 V464 H34 Z" fill="#A7C97E" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/><rect x="34" y="360" width="892" height="104" rx="0" fill="#B8845D" stroke="none" stroke-width="0"/><path d="M34,360 Q175,328 320,360 T610,360 T930,360" fill="none" stroke="#4F8A55" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><path d="M180.0,295.0 Q290.0,155.0 475.0,260.0 Q365.0,400.0 180.0,295.0 Z" fill="#4F8A55" stroke="#24384A" stroke-width="4.0" stroke-linecap="round" stroke-linejoin="round"/><path d="M200.0,290.0 Q330,280 455.0,262.0" fill="none" stroke="#2F6744" stroke-width="6.0" stroke-linecap="round" stroke-linejoin="round"/><path d="M260.0,282.0 l-25.0,-50 M305.0,277.0 l-20.0,-62 M360.0,272.0 l-10.0,-63 M395.0,268.0 l35,-45" fill="none" stroke="#2F6744" stroke-width="3.0" stroke-linecap="round" stroke-linejoin="round"/><rect x="650" y="145" width="220" height="205" rx="12" fill="#F7E9C9" stroke="#24384A" stroke-width="3"/><rect x="680" y="190" width="160" height="22" rx="8" fill="#2F6744" stroke="#24384A" stroke-width="2"/><rect x="680" y="212" width="160" height="55" rx="0" fill="#8FC676" stroke="#24384A" stroke-width="2"/><rect x="680" y="267" width="160" height="55" rx="0" fill="#B9D893" stroke="#24384A" stroke-width="2"/><circle cx="720" cy="285" r="10" fill="#FFFFFF" stroke="#24384A" stroke-width="2"/><circle cx="760" cy="292" r="12" fill="#FFFFFF" stroke="#24384A" stroke-width="2"/><circle cx="800" cy="280" r="9" fill="#FFFFFF" stroke="#24384A" stroke-width="2"/><path d="M760,245 L632,399" fill="none" stroke="#24384A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="760" cy="245" r="4.5" fill="#24384A" stroke="none" stroke-width="0"/><text x="620" y="405" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">横切面很薄，内部仍有</text><text x="620" y="427" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">表皮、叶肉、叶脉和气孔</text><text x="395" y="485" fill="#24384A" text-anchor="middle" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="650">叶形很多，但“扩大受光面、方便交换”是常见原则</text></g>
  <rect x="12" y="12" width="936" height="516" rx="8" fill="none" stroke="#203D2D" stroke-width="3" opacity="0.18"/>
</svg>
