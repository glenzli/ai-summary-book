<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">弹簧为什么会弹回来？</title>
  <desc id="desc">围绕“弹簧为什么会弹回来？”绘制的清晰主题图；具体对象优先，必要关系用箭头表示。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#293747"/></marker>
  </defs>
  <rect width="960" height="540" fill="#FFF7ED"/>
  <path d="M0,455 Q185,410 355,455 T700,455 T1040,455 V540 H0 Z" fill="#3B78A8" opacity="0.07"/>

  <g data-question="192" data-layout="machine" data-presentation="machine" data-source="machine" data-icons="machine-plate-192"><text x="54" y="54" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="26" font-weight="760">弹簧变形时储存弹性势能，回复力把它拉回原来长度</text><rect x="34" y="82" width="892" height="382" rx="4" fill="#EFEAE1" stroke="none" stroke-width="0"/><rect x="34" y="360" width="892" height="104" rx="0" fill="#C99B70" stroke="none" stroke-width="0"/><path d="M34,360 L926,360" fill="none" stroke="#24384A" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M232,350.0 L148,335.7142857142857 L232,321.42857142857144 L148,307.14285714285717 L232,292.85714285714283 L148,278.57142857142856 L232,264.2857142857143 L148,250.0 L232,235.71428571428572 L148,221.42857142857142 L232,207.14285714285714 L148,192.85714285714286 L232,178.57142857142858 L148,164.28571428571428 L232,150.0" fill="none" stroke="#4B82B3" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><path d="M522,350.0 L438,342.14285714285717 L522,334.2857142857143 L438,326.42857142857144 L522,318.57142857142856 L438,310.7142857142857 L522,302.85714285714283 L438,295.0 L522,287.1428571428571 L438,279.2857142857143 L522,271.42857142857144 L438,263.57142857142856 L522,255.7142857142857 L438,247.85714285714283 L522,240.0" fill="none" stroke="#4B82B3" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><path d="M762,350.0 L678,330.7142857142857 L762,311.42857142857144 L678,292.14285714285717 L762,272.8571428571429 L678,253.57142857142856 L762,234.28571428571428 L678,215.0 L762,195.71428571428572 L678,176.42857142857142 L762,157.14285714285714 L678,137.85714285714286 L762,118.57142857142858 L678,99.28571428571428 L762,80.0" fill="none" stroke="#4B82B3" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><path d="M480,110 L480,175" fill="none" stroke="#C95757" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M720,135 L720,85" fill="none" stroke="#2C8178" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="190" y="430" fill="#24384A" text-anchor="middle" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="650">原长</text><text x="480" y="430" fill="#24384A" text-anchor="middle" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="650">压缩</text><text x="720" y="430" fill="#24384A" text-anchor="middle" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="650">拉伸</text><text x="480" y="495" fill="#24384A" text-anchor="middle" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="680">超过弹性限度后可能不能完全回来，反复使用也会疲劳</text></g>
  <rect x="12" y="12" width="936" height="516" rx="8" fill="none" stroke="#293747" stroke-width="3" opacity="0.18"/>
