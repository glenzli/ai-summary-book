  <path d="M0,455 Q185,410 355,455 T700,455 T1040,455 V540 H0 Z" fill="#0F8A8A" opacity="0.07"/>

  <g data-question="043" data-layout="earth-weather" data-presentation="earth-weather" data-source="earth-weather" data-icons="earth-weather-plate-043"><text x="54" y="54" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="26" font-weight="760">闪电把空气瞬间加热膨胀，产生向外传播的冲击波和雷声</text><rect x="34" y="82" width="892" height="382" rx="4" fill="#273552" stroke="none" stroke-width="0"/><circle cx="55" cy="100" r="2" fill="#E8B642" stroke="none" stroke-width="0"/><circle cx="134" cy="153" r="3" fill="#FFFFFF" stroke="none" stroke-width="0"/><circle cx="213" cy="206" r="4" fill="#E8B642" stroke="none" stroke-width="0"/><circle cx="292" cy="259" r="2" fill="#FFFFFF" stroke="none" stroke-width="0"/><circle cx="371" cy="312" r="3" fill="#E8B642" stroke="none" stroke-width="0"/><circle cx="450" cy="135" r="4" fill="#FFFFFF" stroke="none" stroke-width="0"/><circle cx="529" cy="188" r="2" fill="#E8B642" stroke="none" stroke-width="0"/><circle cx="608" cy="241" r="3" fill="#FFFFFF" stroke="none" stroke-width="0"/><circle cx="687" cy="294" r="4" fill="#E8B642" stroke="none" stroke-width="0"/><circle cx="766" cy="117" r="2" fill="#FFFFFF" stroke="none" stroke-width="0"/><circle cx="845" cy="170" r="3" fill="#E8B642" stroke="none" stroke-width="0"/><circle cx="74" cy="223" r="4" fill="#FFFFFF" stroke="none" stroke-width="0"/><circle cx="153" cy="276" r="2" fill="#E8B642" stroke="none" stroke-width="0"/><circle cx="232" cy="329" r="3" fill="#FFFFFF" stroke="none" stroke-width="0"/><circle cx="311" cy="152" r="4" fill="#E8B642" stroke="none" stroke-width="0"/><circle cx="390" cy="205" r="2" fill="#FFFFFF" stroke="none" stroke-width="0"/><circle cx="469" cy="258" r="3" fill="#E8B642" stroke="none" stroke-width="0"/><circle cx="548" cy="311" r="4" fill="#FFFFFF" stroke="none" stroke-width="0"/><circle cx="627" cy="134" r="2" fill="#E8B642" stroke="none" stroke-width="0"/><circle cx="706" cy="187" r="3" fill="#FFFFFF" stroke="none" stroke-width="0"/><circle cx="785" cy="240" r="4" fill="#E8B642" stroke="none" stroke-width="0"/><circle cx="864" cy="293" r="2" fill="#FFFFFF" stroke="none" stroke-width="0"/><circle cx="93" cy="116" r="3" fill="#E8B642" stroke="none" stroke-width="0"/><circle cx="172" cy="169" r="4" fill="#FFFFFF" stroke="none" stroke-width="0"/><path d="M34,350 Q175,285 325,350 T635,350 T945,350 V464 H34 Z" fill="#A6C982" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/><path d="M34,425 Q190,380 355,425 T690,425 T1030,425 V464 H34 Z" fill="#5A9258" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/><circle cx="285.0" cy="177.0" r="45.0" fill="#75838C" stroke="#24384A" stroke-width="3.0"/><circle cx="335.0" cy="140.0" r="62.0" fill="#75838C" stroke="#24384A" stroke-width="3.0"/><circle cx="400.0" cy="160.0" r="52.0" fill="#75838C" stroke="#24384A" stroke-width="3.0"/><rect x="242.0" y="173.0" width="205.0" height="62.0" rx="28.0" fill="#75838C" stroke="#24384A" stroke-width="3.0"/><path d="M365,220 L315,310 L360,300 L305,410" fill="none" stroke="#E8B642" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/><path d="M405,275.25 Q418.5,300 405,324.75" fill="none" stroke="#2D8178" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M440,256.0 Q464.0,300 440,344.0" fill="none" stroke="#4B86B7" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M480,234.0 Q516.0,300 480,366.0" fill="none" stroke="#4B86B7" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M525,209.25 Q574.5,300 525,390.75" fill="none" stroke="#2D8178" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M345,290 L608,99" fill="none" stroke="#24384A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="345" cy="290" r="4.5" fill="#24384A" stroke="none" stroke-width="0"/><text x="620" y="105" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">闪电通道温度骤升，空气急剧膨胀</text><path d="M570,300 L608,294" fill="none" stroke="#24384A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="570" cy="300" r="4.5" fill="#24384A" stroke="none" stroke-width="0"/><text x="620" y="300" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">声波被地面、云层和不同温度</text><text x="620" y="322" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">空气折射反射，形成轰隆延续</text><text x="420" y="490" fill="#FFFFFF" text-anchor="middle" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="650">先看见闪光再听到雷声，是因为光比声音快得多</text></g>
