<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">气球为什么会鼓起来？</title>
  <desc id="desc">围绕“气球为什么会鼓起来？”绘制的清晰主题图；具体对象优先，必要关系用箭头表示。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#173746"/></marker>
  </defs>
  <rect width="960" height="540" fill="#F0FDFA"/>
  <path d="M0,455 Q185,410 355,455 T700,455 T1040,455 V540 H0 Z" fill="#0F8A8A" opacity="0.07"/>

  <g data-question="036" data-layout="earth-weather" data-presentation="earth-weather" data-source="earth-weather" data-icons="earth-weather-plate-036"><text x="54" y="54" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="26" font-weight="760">吹气或打气会增加气球中的气体，内压把橡胶膜撑开</text><rect x="34" y="82" width="892" height="382" rx="4" fill="#EEE9DF" stroke="none" stroke-width="0"/><ellipse cx="250" cy="270" rx="65" ry="85" fill="#C85555" stroke="#24384A" stroke-width="4"/><ellipse cx="620" cy="260" rx="145" ry="165" fill="#C85555" stroke="#24384A" stroke-width="4"/><rect x="230" y="350" width="40" height="38" rx="4" fill="#8A654A" stroke="#24384A" stroke-width="3"/><rect x="600" y="420" width="40" height="28" rx="4" fill="#8A654A" stroke="#24384A" stroke-width="3"/><rect x="340" y="250" width="120" height="70" rx="5" fill="#4B86B7" stroke="#24384A" stroke-width="3"/><path d="M460,285 L505,285" fill="none" stroke="#273552" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/><path d="M330,285 L290,285" fill="none" stroke="#2D8178" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M500,285 L535,285" fill="none" stroke="#2D8178" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><circle cx="585" cy="220" r="7" fill="#FFFFFF" stroke="#4B86B7" stroke-width="2"/><circle cx="650" cy="200" r="7" fill="#FFFFFF" stroke="#4B86B7" stroke-width="2"/><circle cx="690" cy="280" r="7" fill="#FFFFFF" stroke="#4B86B7" stroke-width="2"/><circle cx="600" cy="330" r="7" fill="#FFFFFF" stroke="#4B86B7" stroke-width="2"/><circle cx="660" cy="350" r="7" fill="#FFFFFF" stroke="#4B86B7" stroke-width="2"/><text x="250" y="435" fill="#24384A" text-anchor="middle" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="21" font-weight="650">空气少</text><text x="620" y="470" fill="#24384A" text-anchor="middle" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="21" font-weight="650">空气多、橡胶拉伸</text><path d="M620,260 L608,99" fill="none" stroke="#24384A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="620" cy="260" r="4.5" fill="#24384A" stroke="none" stroke-width="0"/><text x="620" y="105" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">气球停止变大时，内外</text><text x="620" y="127" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">压力和橡胶拉力达到平衡</text></g>
  <rect x="12" y="12" width="936" height="516" rx="8" fill="none" stroke="#173746" stroke-width="3" opacity="0.18"/>
