<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">大象的鼻子为什么这么灵活？</title>
  <desc id="desc">围绕“大象的鼻子为什么这么灵活？”绘制的清晰主题图；具体对象优先，必要关系用箭头表示。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#24324A"/></marker>
  </defs>
  <rect width="960" height="540" fill="#FFF4F7"/>
  <path d="M0,455 Q185,410 355,455 T700,455 T1040,455 V540 H0 Z" fill="#2563A6" opacity="0.07"/>

  <g data-question="132" data-layout="vertebrate" data-presentation="vertebrate" data-source="vertebrate" data-icons="vertebrate-plate-132"><text x="54" y="54" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="26" font-weight="760">象鼻是一束没有骨头的肌肉，能缩短、伸长和弯曲</text><rect x="34" y="82" width="892" height="382" rx="4" fill="#DDEEF4" stroke="none" stroke-width="0"/><path d="M34,350 Q180,285 335,350 T650,350 T960,350 V464 H34 Z" fill="#A8CA83" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/><path d="M34,425 Q190,382 360,425 T700,425 T1040,425 V464 H34 Z" fill="#5C9659" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="360" cy="310" rx="93.60000000000001" ry="48.36" fill="#7D8B91" stroke="#24384A" stroke-width="3.12"/><path d="M416.16,290.5 Q426.29999999999995,284.26 441.9,268.65999999999997" fill="none" stroke="#7D8B91" stroke-width="21.84" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="455.94" cy="256.96" rx="37.44" ry="30.42" fill="#7D8B91" stroke="#24384A" stroke-width="3.12"/><circle cx="469.2" cy="250.71999999999997" r="3.9000000000000004" fill="#24384A" stroke="none" stroke-width="0"/><path d="M303.84,342.76 L296.03999999999996,423.1 L288.23999999999995,429.34000000000003" fill="none" stroke="#24384A" stroke-width="8.58" stroke-linecap="round" stroke-linejoin="round"/><path d="M340.5,342.76 L332.7,423.1 L324.9,429.34000000000003" fill="none" stroke="#24384A" stroke-width="8.58" stroke-linecap="round" stroke-linejoin="round"/><path d="M392.76,342.76 L402.9,423.1 L395.09999999999997,429.34000000000003" fill="none" stroke="#24384A" stroke-width="8.58" stroke-linecap="round" stroke-linejoin="round"/><path d="M423.96,342.76 L434.09999999999997,423.1 L426.29999999999995,429.34000000000003" fill="none" stroke="#24384A" stroke-width="8.58" stroke-linecap="round" stroke-linejoin="round"/><path d="M270.3,298.3 Q223.5,271.0 211.79999999999998,317.8" fill="none" stroke="#7D8B91" stroke-width="10.92" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="430.2" cy="260.85999999999996" rx="37.44" ry="46.02" fill="#909CA1" stroke="#24384A" stroke-width="2.34"/><path d="M477.78,260.85999999999996 C508.2,307.65999999999997 490.26,370.06 463.73999999999995,370.06" fill="none" stroke="#7D8B91" stroke-width="17.94" stroke-linecap="round" stroke-linejoin="round"/><path d="M475,255 L638,124" fill="none" stroke="#24384A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="475" cy="255" r="4.5" fill="#24384A" stroke="none" stroke-width="0"/><text x="650" y="130" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">两类肌肉沿不同方向排列</text><path d="M290,310 L638,254" fill="none" stroke="#24384A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="290" cy="310" r="4.5" fill="#24384A" stroke="none" stroke-width="0"/><text x="650" y="260" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">鼻端像手指一样抓取和感触</text><path d="M385,390 L638,389" fill="none" stroke="#24384A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="385" cy="390" r="4.5" fill="#24384A" stroke="none" stroke-width="0"/><text x="650" y="395" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">也能吸入水后再喷</text><text x="650" y="417" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">出，但水不会进入肺</text></g>
  <rect x="12" y="12" width="936" height="516" rx="8" fill="none" stroke="#24324A" stroke-width="3" opacity="0.18"/>
