  <g data-question="138" data-layout="vertebrate" data-presentation="vertebrate" data-source="vertebrate" data-icons="vertebrate-plate-138"><text x="54" y="54" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="26" font-weight="760">袋鼠幼仔出生很小，会爬进育儿袋继续发育</text><rect x="34" y="82" width="892" height="382" rx="4" fill="#DDEEF4" stroke="none" stroke-width="0"/><path d="M34,350 Q180,285 335,350 T650,350 T960,350 V464 H34 Z" fill="#A8CA83" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/><path d="M34,425 Q190,382 360,425 T700,425 T1040,425 V464 H34 Z" fill="#5C9659" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="360" cy="310" rx="60.84" ry="76.44" fill="#B98058" stroke="#24384A" stroke-width="3.12"/><path d="M416.16,290.5 Q395.09999999999997,267.1 410.7,251.5" fill="none" stroke="#B98058" stroke-width="21.84" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="424.74" cy="239.8" rx="37.44" ry="30.42" fill="#B98058" stroke="#24384A" stroke-width="3.12"/><circle cx="438.0" cy="233.56" r="3.9000000000000004" fill="#24384A" stroke="none" stroke-width="0"/><path d="M328.8,342.76 L321.0,423.1 L313.2,429.34000000000003" fill="none" stroke="#24384A" stroke-width="8.58" stroke-linecap="round" stroke-linejoin="round"/><path d="M387.3,342.76 L397.44,423.1 L389.64,429.34000000000003" fill="none" stroke="#24384A" stroke-width="8.58" stroke-linecap="round" stroke-linejoin="round"/><path d="M270.3,298.3 Q223.5,271.0 211.79999999999998,317.8" fill="none" stroke="#B98058" stroke-width="10.92" stroke-linecap="round" stroke-linejoin="round"/><path d="M303.84,321.7 Q211.79999999999998,368.5 165.0,411.4" fill="none" stroke="#B98058" stroke-width="18.72" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="387.3" cy="325.6" rx="32.76" ry="40.56" fill="#F6E9CF" stroke="#24384A" stroke-width="2.34"/><circle cx="392.76" cy="317.8" r="14.040000000000001" fill="#8B6549" stroke="#24384A" stroke-width="2.34"/><path d="M390,330 L638,124" fill="none" stroke="#24384A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="390" cy="330" r="4.5" fill="#24384A" stroke="none" stroke-width="0"/><text x="650" y="130" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">幼仔沿母体腹部爬向袋口</text><path d="M310,255 L638,254" fill="none" stroke="#24384A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="310" cy="255" r="4.5" fill="#24384A" stroke="none" stroke-width="0"/><text x="650" y="260" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">在育儿袋里含住乳头</text><path d="M210,390 L638,389" fill="none" stroke="#24384A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="210" cy="390" r="4.5" fill="#24384A" stroke="none" stroke-width="0"/><text x="650" y="395" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">袋子保护幼仔，但不是另一个子宫</text></g>
