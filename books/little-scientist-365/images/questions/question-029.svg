<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">我们为什么要睡觉？</title>
  <desc id="desc">围绕“我们为什么要睡觉？”绘制的清晰主题图；具体对象优先，必要关系用箭头表示。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#17213A"/></marker>
  </defs>
  <rect width="960" height="540" fill="#F4F9FF"/>
  <path d="M0,455 Q185,410 355,455 T700,455 T1040,455 V540 H0 Z" fill="#2563EB" opacity="0.07"/>

  <g data-question="029" data-layout="earth-weather" data-presentation="earth-weather" data-source="earth-weather" data-icons="earth-weather-plate-029"><text x="54" y="54" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="26" font-weight="760">睡眠让大脑和身体按阶段调整，不是简单地“关机”</text><rect x="34" y="82" width="892" height="382" rx="4" fill="#273552" stroke="none" stroke-width="0"/><rect x="200.0" y="300.0" width="250.0" height="90.0" rx="10.0" fill="#8AA6C4" stroke="#24384A" stroke-width="3.0"/><circle cx="260.0" cy="292.0" r="28.0" fill="#E7B39E" stroke="#24384A" stroke-width="3.0"/><path d="M292.0,310.0 Q365.0,272.0 425.0,336.0 V378.0 H300.0 Z" fill="#7667A5" stroke="#24384A" stroke-width="3.0" stroke-linecap="round" stroke-linejoin="round"/><path d="M248.0,290.0 q12,8 24,0" fill="none" stroke="#24384A" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"/><path d="M560,315 C590,240 620,360 650,285 S715,230 745,315 S805,360 845,275" fill="none" stroke="#2D8178" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><text x="700" y="370" fill="#FFFFFF" text-anchor="middle" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="650">一夜中睡眠阶段反复循环</text><path d="M260,292 L608,99" fill="none" stroke="#24384A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="260" cy="292" r="4.5" fill="#24384A" stroke="none" stroke-width="0"/><text x="620" y="105" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">身体修复、生长和</text><text x="620" y="127" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">免疫调节持续进行</text><path d="M620,285 L608,204" fill="none" stroke="#24384A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="620" cy="285" r="4.5" fill="#24384A" stroke="none" stroke-width="0"/><text x="620" y="210" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">大脑整理记忆，也会出现梦境</text><text x="435" y="490" fill="#FFFFFF" text-anchor="middle" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="690">规律睡眠帮助注意、情绪和学习；不同年龄需要的时长不同</text></g>
  <rect x="12" y="12" width="936" height="516" rx="8" fill="none" stroke="#17213A" stroke-width="3" opacity="0.18"/>
</svg>
