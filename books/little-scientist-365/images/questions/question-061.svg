<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">种子怎样知道可以发芽？</title>
  <desc id="desc">围绕“种子怎样知道可以发芽？”绘制的清晰主题图；具体对象优先，必要关系用箭头表示。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#203D2D"/></marker>
  </defs>
  <rect width="960" height="540" fill="#F5FBEF"/>
  <path d="M0,455 Q185,410 355,455 T700,455 T1040,455 V540 H0 Z" fill="#3B8C5A" opacity="0.07"/>

  <g data-question="061" data-layout="plant" data-presentation="plant" data-source="plant" data-icons="plant-plate-061"><text x="54" y="54" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="26" font-weight="760">水、氧气和合适温度共同启动种子的代谢</text><rect x="34" y="82" width="892" height="190" rx="4" fill="#DDEFF3" stroke="none" stroke-width="0"/><rect x="34" y="272" width="892" height="192" rx="0" fill="#B8845D" stroke="none" stroke-width="0"/><path d="M34,272 Q165,245 300,272 T580,272 T860,272 T980,272" fill="none" stroke="#4F8A55" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><circle cx="115" cy="335" r="8" fill="#76523B" stroke="none" stroke-width="0"/><circle cx="175" cy="402" r="6" fill="#76523B" stroke="none" stroke-width="0"/><circle cx="820" cy="330" r="9" fill="#76523B" stroke="none" stroke-width="0"/><circle cx="745" cy="420" r="7" fill="#76523B" stroke="none" stroke-width="0"/><path d="M278.0,310 C294.0,225.0 408.0,210.0 462.0,294.0 C435.0,387.0 318.0,398.0 278.0,310 Z" fill="#C68B50" stroke="#24384A" stroke-width="4.0" stroke-linecap="round" stroke-linejoin="round"/><path d="M180,155 q-35,55 0,90 q35,-35 0,-90" fill="#4D86B5" stroke="#24384A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M510,180 q25,-55 50,0 q25,55 50,0" fill="none" stroke="#2D8178" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="750" cy="185" r="48" fill="#E6B542" stroke="#24384A" stroke-width="3"/><path d="M205,235 Q265,270 300,285" fill="none" stroke="#4D86B5" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M575,230 Q500,270 440,290" fill="none" stroke="#2D8178" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M710,220 Q565,255 450,300" fill="none" stroke="#D9703D" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="180" y="125" fill="#24384A" text-anchor="middle" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="650">水</text><text x="560" y="135" fill="#24384A" text-anchor="middle" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="650">氧气</text><text x="750" y="125" fill="#24384A" text-anchor="middle" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="650">适宜温度</text><text x="480" y="475" fill="#24384A" text-anchor="middle" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="650">光对不同种子的作用不同，许多种子在土中也能开始萌发</text></g>
