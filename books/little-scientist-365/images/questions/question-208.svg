<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">桥为什么爱用三角形？</title>
  <desc id="desc">围绕“桥为什么爱用三角形？”绘制的清晰主题图；具体对象优先，必要关系用箭头表示。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#293747"/></marker>
  </defs>
  <rect width="960" height="540" fill="#FFF7ED"/>
  <path d="M0,455 Q185,410 355,455 T700,455 T1040,455 V540 H0 Z" fill="#3B78A8" opacity="0.07"/>

  <g data-question="208" data-layout="machine" data-presentation="machine" data-source="machine" data-icons="machine-plate-208"><text x="54" y="54" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="26" font-weight="760">三角桁架把桥面荷载分成杆件中的拉力和压力</text><rect x="34" y="82" width="892" height="382" rx="4" fill="#DFEEF1" stroke="none" stroke-width="0"/><rect x="80" y="350" width="800" height="35" rx="4" fill="#AAB7BD" stroke="#24384A" stroke-width="4"/><path d="M100,350 L220,190" fill="none" stroke="#4B82B3" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/><circle cx="100" cy="350" r="9" fill="#24384A" stroke="none" stroke-width="0"/><path d="M220,190 L340,350" fill="none" stroke="#4B82B3" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/><circle cx="220" cy="190" r="9" fill="#24384A" stroke="none" stroke-width="0"/><path d="M340,350 L460,190" fill="none" stroke="#4B82B3" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/><circle cx="340" cy="350" r="9" fill="#24384A" stroke="none" stroke-width="0"/><path d="M460,190 L580,350" fill="none" stroke="#4B82B3" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/><circle cx="460" cy="190" r="9" fill="#24384A" stroke="none" stroke-width="0"/><path d="M580,350 L700,190" fill="none" stroke="#4B82B3" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/><circle cx="580" cy="350" r="9" fill="#24384A" stroke="none" stroke-width="0"/><path d="M700,190 L820,350" fill="none" stroke="#4B82B3" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/><circle cx="700" cy="190" r="9" fill="#24384A" stroke="none" stroke-width="0"/><path d="M100,350 L340,350" fill="none" stroke="#2C8178" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/><path d="M340,350 L580,350" fill="none" stroke="#2C8178" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/><path d="M580,350 L820,350" fill="none" stroke="#2C8178" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/><path d="M480,105 L480,185" fill="none" stroke="#C95757" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M480,190 L608,99" fill="none" stroke="#24384A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="480" cy="190" r="4.5" fill="#24384A" stroke="none" stroke-width="0"/><text x="620" y="105" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">节点受力后，三角</text><text x="620" y="127" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">形不容易改变形状</text><path d="M360,280 L608,299" fill="none" stroke="#24384A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="360" cy="280" r="4.5" fill="#24384A" stroke="none" stroke-width="0"/><text x="620" y="305" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">有些杆受拉、有些杆受</text><text x="620" y="327" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">压，共同把力送向桥墩</text><text x="430" y="490" fill="#24384A" text-anchor="middle" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="650">工程师还要检查连接、材料屈曲、振动和疲劳</text></g>
  <rect x="12" y="12" width="936" height="516" rx="8" fill="none" stroke="#293747" stroke-width="3" opacity="0.18"/>
</svg>
