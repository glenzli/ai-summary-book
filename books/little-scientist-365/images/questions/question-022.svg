<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">冷天说话为什么冒白气？</title>
  <desc id="desc">围绕“冷天说话为什么冒白气？”绘制的清晰主题图；具体对象优先，必要关系用箭头表示。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#17213A"/></marker>
  </defs>
  <rect width="960" height="540" fill="#F4F9FF"/>
  <path d="M0,455 Q185,410 355,455 T700,455 T1040,455 V540 H0 Z" fill="#2563EB" opacity="0.07"/>

  <g data-question="022" data-layout="earth-weather" data-presentation="earth-weather" data-source="earth-weather" data-icons="earth-weather-plate-022"><text x="54" y="54" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="26" font-weight="760">呼出的温暖湿气遇到冷空气，凝结成能看见的小水滴</text><rect x="34" y="82" width="892" height="382" rx="4" fill="#DCEEF4" stroke="none" stroke-width="0"/><path d="M34,350 Q175,285 325,350 T635,350 T945,350 V464 H34 Z" fill="#A6C982" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/><path d="M34,425 Q190,380 355,425 T690,425 T1030,425 V464 H34 Z" fill="#5A9258" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/><circle cx="280" cy="268.25" r="19.5" fill="#E7B39E" stroke="#24384A" stroke-width="1.9500000000000002"/><path d="M280,289.7 L280,359.25" fill="none" stroke="#273552" stroke-width="7.800000000000001" stroke-linecap="round" stroke-linejoin="round"/><path d="M280,317.0 L239.7,339.75" fill="none" stroke="#273552" stroke-width="5.8500000000000005" stroke-linecap="round" stroke-linejoin="round"/><path d="M280,317.0 L320.3,339.75" fill="none" stroke="#273552" stroke-width="5.8500000000000005" stroke-linecap="round" stroke-linejoin="round"/><path d="M280,357.3 L248.8,404.75" fill="none" stroke="#273552" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M280,357.3 L311.2,404.75" fill="none" stroke="#273552" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="390" cy="225" r="10" fill="#FFFFFF" stroke="#4B86B7" stroke-width="2"/><circle cx="430" cy="205" r="14" fill="#FFFFFF" stroke="#4B86B7" stroke-width="2"/><circle cx="475" cy="190" r="18" fill="#FFFFFF" stroke="#4B86B7" stroke-width="2"/><circle cx="525" cy="180" r="13" fill="#FFFFFF" stroke="#4B86B7" stroke-width="2"/><circle cx="565" cy="175" r="9" fill="#FFFFFF" stroke="#4B86B7" stroke-width="2"/><path d="M310,230 Q390,205 455,190" fill="none" stroke="#DE753E" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M475,190 L608,109" fill="none" stroke="#24384A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="475" cy="190" r="4.5" fill="#24384A" stroke="none" stroke-width="0"/><text x="620" y="115" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">白气是液态微滴，</text><text x="620" y="137" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">不是看得见的水蒸气</text><path d="M380,220 L608,274" fill="none" stroke="#24384A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="380" cy="220" r="4.5" fill="#24384A" stroke="none" stroke-width="0"/><text x="620" y="280" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">空气越冷，能保持为气态的水越少</text><text x="430" y="490" fill="#24384A" text-anchor="middle" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="650">微滴再蒸发后会消失；原理和云、雾相似</text></g>
  <rect x="12" y="12" width="936" height="516" rx="8" fill="none" stroke="#17213A" stroke-width="3" opacity="0.18"/>
</svg>
