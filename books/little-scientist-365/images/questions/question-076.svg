<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">树干里的圆圈是什么？</title>
  <desc id="desc">围绕“树干里的圆圈是什么？”绘制的清晰主题图；具体对象优先，必要关系用箭头表示。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#203D2D"/></marker>
  </defs>
  <rect width="960" height="540" fill="#F5FBEF"/>
  <path d="M0,455 Q185,410 355,455 T700,455 T1040,455 V540 H0 Z" fill="#3B8C5A" opacity="0.07"/>

  <g data-question="076" data-layout="plant" data-presentation="plant" data-source="plant" data-icons="plant-plate-076"><text x="54" y="54" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="26" font-weight="760">温带树木每年形成一圈早材和晚材，宽窄记录生长条件</text><rect x="34" y="82" width="892" height="382" rx="4" fill="#DDEFF3" stroke="none" stroke-width="0"/><path d="M34,330 Q170,280 315,330 T610,330 T920,330 V464 H34 Z" fill="#A7C97E" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/><rect x="34" y="360" width="892" height="104" rx="0" fill="#B8845D" stroke="none" stroke-width="0"/><path d="M34,360 Q175,328 320,360 T610,360 T930,360" fill="none" stroke="#4F8A55" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><circle cx="360" cy="285" r="170" fill="#D6A66F" stroke="#24384A" stroke-width="5"/><circle cx="360" cy="285" r="30" fill="none" stroke="#F7E9C9" stroke-width="5"/><circle cx="360" cy="285" r="55" fill="none" stroke="#5A4032" stroke-width="5"/><circle cx="360" cy="285" r="82" fill="none" stroke="#F7E9C9" stroke-width="5"/><circle cx="360" cy="285" r="112" fill="none" stroke="#F7E9C9" stroke-width="5"/><circle cx="360" cy="285" r="143" fill="none" stroke="#5A4032" stroke-width="5"/><path d="M360,285 L510,210" fill="none" stroke="#C95858" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M425,250 L638,134" fill="none" stroke="#24384A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="425" cy="250" r="4.5" fill="#24384A" stroke="none" stroke-width="0"/><text x="650" y="140" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">一组浅色早材与深</text><text x="650" y="162" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">色晚材常组成一年轮</text><path d="M300,285 L638,279" fill="none" stroke="#24384A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="300" cy="285" r="4.5" fill="#24384A" stroke="none" stroke-width="0"/><text x="650" y="285" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">最里面不是树的出生日期标</text><text x="650" y="307" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">签，而是较早形成的木材</text><path d="M505,330 L638,404" fill="none" stroke="#24384A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="505" cy="330" r="4.5" fill="#24384A" stroke="none" stroke-width="0"/><text x="650" y="410" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">干旱、损伤等会改变宽</text><text x="650" y="432" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">度，所以年轮并不总规则</text></g>
  <rect x="12" y="12" width="936" height="516" rx="8" fill="none" stroke="#203D2D" stroke-width="3" opacity="0.18"/>
</svg>
