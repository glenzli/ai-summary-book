<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">电风扇会制造冷空气吗？</title>
  <desc id="desc">围绕“电风扇会制造冷空气吗？”绘制的清晰主题图；具体对象优先，必要关系用箭头表示。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#293747"/></marker>
  </defs>
  <rect width="960" height="540" fill="#FFF7ED"/>
  <path d="M0,455 Q185,410 355,455 T700,455 T1040,455 V540 H0 Z" fill="#3B78A8" opacity="0.07"/>

  <g data-question="201" data-layout="machine" data-presentation="machine" data-source="machine" data-icons="machine-plate-201"><text x="54" y="54" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="26" font-weight="760">风扇让空气流动；人体觉得凉主要因为对流和汗液蒸发加快</text><rect x="34" y="82" width="892" height="382" rx="4" fill="#EFEAE1" stroke="none" stroke-width="0"/><rect x="34" y="360" width="892" height="104" rx="0" fill="#C99B70" stroke="none" stroke-width="0"/><path d="M34,360 L926,360" fill="none" stroke="#24384A" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="330" cy="255" r="130" fill="#FFFFFF" stroke="#24384A" stroke-width="5"/><circle cx="330" cy="255" r="24" fill="#4B82B3" stroke="#24384A" stroke-width="3"/><path d="M350.0,255.0 Q432.3,317.7 364.4,343.5 Q378.3,281.4 350.0,255.0 Z" fill="#4B82B3" stroke="#24384A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M320.0,272.3205080756888 Q224.5,312.2 236.1,240.5 Q283.0,283.6 320.0,272.3205080756888 Z" fill="#4B82B3" stroke="#24384A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M320.0,237.67949192431124 Q333.2,135.0 389.5,180.9 Q328.7,200.0 320.0,237.67949192431124 Z" fill="#4B82B3" stroke="#24384A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M500,190 Q620,180 745,190" fill="none" stroke="#2C8178" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M500,255 Q620,245 745,255" fill="none" stroke="#2C8178" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M500,320 Q620,310 745,320" fill="none" stroke="#2C8178" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><circle cx="815" cy="255" r="45" fill="#E7B39E" stroke="#24384A" stroke-width="3"/><circle cx="795" cy="315" r="9" fill="#4B82B3" stroke="none" stroke-width="0"/><path d="M815,255 L632,104" fill="none" stroke="#24384A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="815" cy="255" r="4.5" fill="#24384A" stroke="none" stroke-width="0"/><text x="620" y="110" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">风扇不主动降低整个房间空气温度</text><text x="430" y="490" fill="#24384A" text-anchor="middle" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="650">关在无人房间的电风扇反而会把电能最终变成少量热</text></g>
  <rect x="12" y="12" width="936" height="516" rx="8" fill="none" stroke="#293747" stroke-width="3" opacity="0.18"/>
</svg>
