<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">水汽看得见吗？</title>
  <desc id="desc">围绕“水汽看得见吗？”绘制的清晰主题图；具体对象优先，必要关系用箭头表示。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#173746"/></marker>
  </defs>
  <rect width="960" height="540" fill="#F0FDFA"/>
  <path d="M0,455 Q185,410 355,455 T700,455 T1040,455 V540 H0 Z" fill="#0F8A8A" opacity="0.07"/>

  <g data-question="049" data-layout="earth-weather" data-presentation="earth-weather" data-source="earth-weather" data-icons="earth-weather-plate-049"><text x="54" y="54" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="26" font-weight="760">真正的水蒸气是看不见的；白雾是已经凝结的小水滴</text><rect x="34" y="82" width="892" height="382" rx="4" fill="#EEE9DF" stroke="none" stroke-width="0"/><rect x="120" y="280" width="250" height="125" rx="8" fill="#A9B4B8" stroke="#24384A" stroke-width="4"/><path d="M150,280 Q245,220 340,280" fill="none" stroke="#24384A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="230" cy="235" r="5" fill="#2D8178" stroke="none" stroke-width="0"/><circle cx="270" cy="205" r="5" fill="#2D8178" stroke="none" stroke-width="0"/><circle cx="310" cy="185" r="5" fill="#2D8178" stroke="none" stroke-width="0"/><circle cx="390" cy="175" r="12" fill="#FFFFFF" stroke="#4B86B7" stroke-width="2"/><circle cx="430" cy="155" r="18" fill="#FFFFFF" stroke="#4B86B7" stroke-width="2"/><circle cx="475" cy="165" r="23" fill="#FFFFFF" stroke="#4B86B7" stroke-width="2"/><circle cx="525" cy="145" r="18" fill="#FFFFFF" stroke="#4B86B7" stroke-width="2"/><circle cx="565" cy="160" r="12" fill="#FFFFFF" stroke="#4B86B7" stroke-width="2"/><path d="M275,205 L608,99" fill="none" stroke="#24384A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="275" cy="205" r="4.5" fill="#24384A" stroke="none" stroke-width="0"/><text x="620" y="105" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">壶嘴附近高温区：</text><text x="620" y="127" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">气态水分子不可见</text><path d="M475,160 L608,279" fill="none" stroke="#24384A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="475" cy="160" r="4.5" fill="#24384A" stroke="none" stroke-width="0"/><text x="620" y="285" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">稍远处冷却凝结：微</text><text x="620" y="307" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">滴散射光，出现白雾</text><text x="420" y="490" fill="#24384A" text-anchor="middle" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="680">云、雾和冷天白气都是微滴或冰晶，不是水蒸气本身</text></g>
  <rect x="12" y="12" width="936" height="516" rx="8" fill="none" stroke="#173746" stroke-width="3" opacity="0.18"/>
</svg>
