<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">电池里面装着“电”吗？</title>
  <desc id="desc">围绕“电池里面装着“电”吗？”绘制的清晰主题图；具体对象优先，必要关系用箭头表示。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#293747"/></marker>
  </defs>
  <rect width="960" height="540" fill="#FFF7ED"/>
  <path d="M0,455 Q185,410 355,455 T700,455 T1040,455 V540 H0 Z" fill="#3B78A8" opacity="0.07"/>

  <g data-question="198" data-layout="machine" data-presentation="machine" data-source="machine" data-icons="machine-plate-198"><text x="54" y="54" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="26" font-weight="760">电池用化学反应维持两端电势差，不是把“电”装在壳里</text><rect x="34" y="82" width="892" height="382" rx="4" fill="#EFEAE1" stroke="none" stroke-width="0"/><rect x="34" y="360" width="892" height="104" rx="0" fill="#C99B70" stroke="none" stroke-width="0"/><path d="M34,360 L926,360" fill="none" stroke="#24384A" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><rect x="190" y="125" width="300" height="295" rx="12" fill="#4B82B3" stroke="#24384A" stroke-width="5"/><rect x="235" y="145" width="70" height="250" rx="6" fill="#C95757" stroke="#24384A" stroke-width="3"/><rect x="375" y="145" width="70" height="250" rx="6" fill="#AAB7BD" stroke="#24384A" stroke-width="3"/><rect x="305" y="145" width="70" height="250" rx="6" fill="#D8E9C5" stroke="#24384A" stroke-width="3"/><text x="270" y="445" fill="#24384A" text-anchor="middle" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="650">负极</text><text x="340" y="445" fill="#24384A" text-anchor="middle" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="650">电解质</text><text x="410" y="445" fill="#24384A" text-anchor="middle" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="650">正极</text><path d="M305,210 L375,210" fill="none" stroke="#2C8178" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M375,320 L305,320" fill="none" stroke="#DC713E" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M340,265 L608,99" fill="none" stroke="#24384A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="340" cy="265" r="4.5" fill="#24384A" stroke="none" stroke-width="0"/><text x="620" y="105" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">离子在电解质中移</text><text x="620" y="127" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">动，电子走外部电路</text><path d="M430,180 L608,279" fill="none" stroke="#24384A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="430" cy="180" r="4.5" fill="#24384A" stroke="none" stroke-width="0"/><text x="620" y="285" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">化学物质逐渐转变，</text><text x="620" y="307" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">能提供的电势差下降</text><text x="430" y="495" fill="#24384A" text-anchor="middle" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="700">不同电池化学体系的材料、可充性和安全要求不同</text></g>
  <rect x="12" y="12" width="936" height="516" rx="8" fill="none" stroke="#293747" stroke-width="3" opacity="0.18"/>
</svg>
