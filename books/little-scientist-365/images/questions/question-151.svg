  <g data-question="151" data-layout="vertebrate" data-presentation="vertebrate" data-source="vertebrate" data-icons="vertebrate-plate-151"><text x="54" y="54" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="26" font-weight="760">迁徙把繁殖地、食物地和季节性路线连接起来</text><rect x="34" y="82" width="892" height="382" rx="4" fill="#DCECF1" stroke="none" stroke-width="0"/><path d="M90,170 Q210,105 330,165 Q420,225 510,170 Q610,90 715,150 Q820,205 890,155" fill="#A8CA83" stroke="#24384A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M130,360 Q220,300 315,365 Q420,420 515,355 Q625,285 760,350" fill="#5C9659" stroke="#24384A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M205,330 C250,250 330,220 390,250 C465,280 500,185 585,175 C665,165 720,225 790,205" fill="none" stroke="#C95555" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="12 10"/><path d="M197,320 q18,-24 36,0 M233,320 q18,-24 36,0" fill="none" stroke="#2D618F" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M372,250 q18,-24 36,0 M408,250 q18,-24 36,0" fill="none" stroke="#2D618F" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M567,175 q18,-24 36,0 M603,175 q18,-24 36,0" fill="none" stroke="#2D618F" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M772,205 q18,-24 36,0 M808,205 q18,-24 36,0" fill="none" stroke="#2D618F" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M215,320 L102,434" fill="none" stroke="#24384A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="215" cy="320" r="4.5" fill="#24384A" stroke="none" stroke-width="0"/><text x="90" y="440" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">食物丰富的越冬或觅食地</text><path d="M790,205 L662,104" fill="none" stroke="#24384A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="790" cy="205" r="4.5" fill="#24384A" stroke="none" stroke-width="0"/><text x="650" y="110" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">适合繁殖和育幼的地点</text><path d="M500,220 L638,354" fill="none" stroke="#24384A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="500" cy="220" r="4.5" fill="#24384A" stroke="none" stroke-width="0"/><text x="650" y="360" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">太阳、星空、地标、气</text><text x="650" y="382" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">味和地磁都可能参与导航</text></g>
