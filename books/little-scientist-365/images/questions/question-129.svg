<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">鲸为什么要浮出水面？</title>
  <desc id="desc">围绕“鲸为什么要浮出水面？”绘制的清晰主题图；具体对象优先，必要关系用箭头表示。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#24324A"/></marker>
  </defs>
  <rect width="960" height="540" fill="#FFF4F7"/>
  <path d="M0,455 Q185,410 355,455 T700,455 T1040,455 V540 H0 Z" fill="#2563A6" opacity="0.07"/>

  <g data-question="129" data-layout="vertebrate" data-presentation="vertebrate" data-source="vertebrate" data-icons="vertebrate-plate-129"><text x="54" y="54" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="26" font-weight="760">鲸用肺呼吸，必须把头顶的呼吸孔带到水面</text><rect x="34" y="82" width="892" height="382" rx="4" fill="#BDE4EA" stroke="none" stroke-width="0"/><path d="M34,420 Q190,375 350,420 T680,420 T1000,420 V464 H34 Z" fill="#D4C28A" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/><path d="M95,425 q18,-85 36,0 M770,425 q20,-95 40,0 M830,425 q17,-70 34,0" fill="none" stroke="#2D8079" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><circle cx="120" cy="160" r="7" fill="none" stroke="#FFFFFF" stroke-width="2"/><circle cx="150" cy="125" r="4" fill="none" stroke="#FFFFFF" stroke-width="2"/><circle cx="810" cy="175" r="7" fill="none" stroke="#FFFFFF" stroke-width="2"/><circle cx="845" cy="135" r="4" fill="none" stroke="#FFFFFF" stroke-width="2"/><circle cx="750" cy="240" r="5" fill="none" stroke="#FFFFFF" stroke-width="2"/><path d="M255.0,300 C327.0,214.5 462.0,226.2 496.2,286.5 C442.2,364.8 309.0,372.0 255.0,300 Z" fill="#2D618F" stroke="#24384A" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/><polygon points="259.5,300 187.5,237.0 201.0,309.0" fill="#C95555" stroke="#24384A" stroke-width="2.7" stroke-linejoin="round"/><polygon points="259.5,300 192.0,367.5 205.5,296.4" fill="#D9693F" stroke="#24384A" stroke-width="2.7" stroke-linejoin="round"/><polygon points="376.5,334.2 426.0,394.5 444.0,337.8" fill="#2D618F" stroke="#24384A" stroke-width="2.7" stroke-linejoin="round"/><circle cx="466.5" cy="278.4" r="4.5" fill="#24384A" stroke="none" stroke-width="0"/><path d="M397.2,241.5 q-7.2,-52.2 -27.0,-85.5 M397.2,241.5 q16.2,-52.2 40.5,-82.8" fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M410,230 q-20,-70 -42,-110 M410,230 q20,-72 50,-105" fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><path d="M34,175 L926,175" fill="none" stroke="#4C86B8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M405,230 L638,109" fill="none" stroke="#24384A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="405" cy="230" r="4.5" fill="#24384A" stroke="none" stroke-width="0"/><text x="650" y="115" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">呼吸孔连接肺，不连接鳃</text><path d="M390,300 L638,254" fill="none" stroke="#24384A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="390" cy="300" r="4.5" fill="#24384A" stroke="none" stroke-width="0"/><text x="650" y="260" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">潜水时储存氧气并</text><text x="650" y="282" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">减慢部分器官活动</text><path d="M375,175 L638,394" fill="none" stroke="#24384A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="375" cy="175" r="4.5" fill="#24384A" stroke="none" stroke-width="0"/><text x="650" y="400" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">浮到水面快速呼气</text><text x="650" y="422" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">，再吸入新鲜空气</text></g>
  <rect x="12" y="12" width="936" height="516" rx="8" fill="none" stroke="#24324A" stroke-width="3" opacity="0.18"/>
