cap="round" stroke-linejoin="round"/><circle cx="470" cy="270" r="4.5" fill="#24384A" stroke="none" stroke-width="0"/><text x="650" y="110" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">换挡改变前后齿盘的齿数比</text><text x="450" y="495" fill="#24384A" text-anchor="middle" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="710">链条传力，不是链条把自行车向前拉；后轮推地才让车前进</text></g>
