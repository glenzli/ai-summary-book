<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">衣服怎么把人变暖？</title>
  <desc id="desc">围绕“衣服怎么把人变暖？”绘制的清晰主题图；具体对象优先，必要关系用箭头表示。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#17213A"/></marker>
  </defs>
  <rect width="960" height="540" fill="#F4F9FF"/>
  <path d="M0,455 Q185,410 355,455 T700,455 T1040,455 V540 H0 Z" fill="#2563EB" opacity="0.07"/>

  <g data-question="024" data-layout="earth-weather" data-presentation="earth-weather" data-source="earth-weather" data-icons="earth-weather-plate-024"><text x="54" y="54" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="26" font-weight="760">衣服夹住许多不流动的空气，减慢身体向外传热</text><rect x="34" y="82" width="892" height="382" rx="4" fill="#E8EFF0" stroke="none" stroke-width="0"/><circle cx="310" cy="258.75" r="22.5" fill="#E7B39E" stroke="#24384A" stroke-width="2.25"/><path d="M310,283.5 L310,363.75" fill="none" stroke="#273552" stroke-width="9.0" stroke-linecap="round" stroke-linejoin="round"/><path d="M310,315.0 L263.5,341.25" fill="none" stroke="#273552" stroke-width="6.75" stroke-linecap="round" stroke-linejoin="round"/><path d="M310,315.0 L356.5,341.25" fill="none" stroke="#273552" stroke-width="6.75" stroke-linecap="round" stroke-linejoin="round"/><path d="M310,361.5 L274.0,416.25" fill="none" stroke="#273552" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M310,361.5 L346.0,416.25" fill="none" stroke="#273552" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M245,245 Q310,200 375,245 L360,370 H260 Z" fill="#C85555" stroke="#24384A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="270" cy="255" r="10" fill="#FFFFFF" stroke="#4B86B7" stroke-width="2"/><circle cx="300" cy="235" r="10" fill="#FFFFFF" stroke="#4B86B7" stroke-width="2"/><circle cx="335" cy="250" r="10" fill="#FFFFFF" stroke="#4B86B7" stroke-width="2"/><circle cx="280" cy="290" r="10" fill="#FFFFFF" stroke="#4B86B7" stroke-width="2"/><circle cx="330" cy="300" r="10" fill="#FFFFFF" stroke="#4B86B7" stroke-width="2"/><rect x="620" y="145" width="230" height="215" rx="12" fill="#F7E9CA" stroke="#24384A" stroke-width="3"/><path d="M655,320 Q700,180 745,320 Q790,180 835,320" fill="none" stroke="#C85555" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/><circle cx="690" cy="260" r="13" fill="#FFFFFF" stroke="#4B86B7" stroke-width="2"/><circle cx="735" cy="225" r="13" fill="#FFFFFF" stroke="#4B86B7" stroke-width="2"/><circle cx="780" cy="270" r="13" fill="#FFFFFF" stroke="#4B86B7" stroke-width="2"/><path d="M735,250 L622,399" fill="none" stroke="#24384A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="735" cy="250" r="4.5" fill="#24384A" stroke="none" stroke-width="0"/><text x="610" y="405" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">纤维间空气导热慢</text><text x="610" y="427" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">，也不易形成强对流</text><text x="415" y="490" fill="#24384A" text-anchor="middle" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="650">衣服不制造热；身体产生热，衣服只是减慢热量跑掉</text></g>
  <rect x="12" y="12" width="936" height="516" rx="8" fill="none" stroke="#17213A" stroke-width="3" opacity="0.18"/>
</svg>
