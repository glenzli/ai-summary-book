<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">植物为什么会朝窗户弯？</title>
  <desc id="desc">围绕“植物为什么会朝窗户弯？”绘制的清晰主题图；具体对象优先，必要关系用箭头表示。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#203D2D"/></marker>
  </defs>
  <rect width="960" height="540" fill="#F5FBEF"/>
  <path d="M0,455 Q185,410 355,455 T700,455 T1040,455 V540 H0 Z" fill="#3B8C5A" opacity="0.07"/>

  <g data-question="083" data-layout="plant" data-presentation="plant" data-source="plant" data-icons="plant-plate-083"><text x="54" y="54" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="26" font-weight="760">单侧光照让幼茎两侧生长速度不同，于是逐渐向光弯曲</text><rect x="34" y="82" width="892" height="382" rx="4" fill="#DDEFF3" stroke="none" stroke-width="0"/><path d="M34,330 Q170,280 315,330 T610,330 T920,330 V464 H34 Z" fill="#A7C97E" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/><rect x="34" y="360" width="892" height="104" rx="0" fill="#B8845D" stroke="none" stroke-width="0"/><path d="M34,360 Q175,328 320,360 T610,360 T930,360" fill="none" stroke="#4F8A55" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><rect x="75" y="110" width="240" height="245" rx="4" fill="#D7EEF2" stroke="#24384A" stroke-width="5"/><path d="M195,110 L195,355" fill="none" stroke="#24384A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M75,230 L315,230" fill="none" stroke="#24384A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="180" cy="170" r="38" fill="#E6B542" stroke="#24384A" stroke-width="3"/><path d="M520,395 C520,325 525,255 480,205" fill="none" stroke="#2F6744" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/><path d="M420.5,209.95 Q456.8,163.75 517.85,198.4 Q481.55,244.6 420.5,209.95 Z" fill="#4F8A55" stroke="#24384A" stroke-width="1.32" stroke-linecap="round" stroke-linejoin="round"/><path d="M427.1,208.3 Q470,205 511.25,199.06" fill="none" stroke="#2F6744" stroke-width="1.98" stroke-linecap="round" stroke-linejoin="round"/><path d="M446.9,205.66 l-8.25,-50 M461.75,204.01 l-6.6000000000000005,-62 M479.9,202.36 l-3.3000000000000003,-63 M491.45,201.04 l35,-45" fill="none" stroke="#2F6744" stroke-width="0.99" stroke-linecap="round" stroke-linejoin="round"/><path d="M760,395 C750,310 700,245 610,210" fill="none" stroke="#2F6744" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/><path d="M560.5,214.95 Q596.8,168.75 657.85,203.4 Q621.55,249.6 560.5,214.95 Z" fill="#4F8A55" stroke="#24384A" stroke-width="1.32" stroke-linecap="round" stroke-linejoin="round"/><path d="M567.1,213.3 Q610,210 651.25,204.06" fill="none" stroke="#2F6744" stroke-width="1.98" stroke-linecap="round" stroke-linejoin="round"/><path d="M586.9,210.66 l-8.25,-50 M601.75,209.01 l-6.6000000000000005,-62 M619.9,207.36 l-3.3000000000000003,-63 M631.45,206.04 l35,-45" fill="none" stroke="#2F6744" stroke-width="0.99" stroke-linecap="round" stroke-linejoin="round"/><path d="M330,235 Q430,210 470,210" fill="none" stroke="#D9703D" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M515,300 L638,109" fill="none" stroke="#24384A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="515" cy="300" r="4.5" fill="#24384A" stroke="none" stroke-width="0"/><text x="650" y="115" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">开始时茎近乎直立</text><path d="M700,270 L662,334" fill="none" stroke="#24384A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="700" cy="270" r="4.5" fill="#24384A" stroke="none" stroke-width="0"/><text x="650" y="340" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">一段时间后，背光侧伸</text><text x="650" y="362" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">长更多，茎弯向窗户</text></g>
