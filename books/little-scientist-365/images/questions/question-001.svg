<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">太阳为什么会亮？</title>
  <desc id="desc">围绕“太阳为什么会亮？”绘制的清晰主题图；具体对象优先，必要关系用箭头表示。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#17213A"/></marker>
  </defs>
  <rect width="960" height="540" fill="#F4F9FF"/>
  <path d="M0,455 Q185,410 355,455 T700,455 T1040,455 V540 H0 Z" fill="#2563EB" opacity="0.07"/>

  <g data-question="001" data-layout="earth-weather" data-presentation="earth-weather" data-source="earth-weather" data-icons="earth-weather-plate-001"><text x="54" y="54" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="26" font-weight="760">太阳核心的核聚变释放能量，经过很久才从表面辐射出来</text><rect x="34" y="82" width="892" height="382" rx="4" fill="#273552" stroke="none" stroke-width="0"/><circle cx="350" cy="275" r="155" fill="#E8B642" stroke="#DE753E" stroke-width="4"/><circle cx="350" cy="275" r="88" fill="#DE753E" stroke="#C85555" stroke-width="4"/><circle cx="350" cy="275" r="42" fill="#FFFFFF" stroke="#DE753E" stroke-width="4"/><path d="M398.0,275.0 L485.0,275.0" fill="none" stroke="#E8B642" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M388.8,303.2 L459.2,354.4" fill="none" stroke="#E8B642" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M364.8,320.7 L391.7,403.4" fill="none" stroke="#E8B642" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M335.2,320.7 L308.3,403.4" fill="none" stroke="#E8B642" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M311.2,303.2 L240.8,354.4" fill="none" stroke="#E8B642" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M302.0,275.0 L215.0,275.0" fill="none" stroke="#E8B642" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M311.2,246.8 L240.8,195.6" fill="none" stroke="#E8B642" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M335.2,229.3 L308.3,146.6" fill="none" stroke="#E8B642" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M364.8,229.3 L391.7,146.6" fill="none" stroke="#E8B642" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M388.8,246.8 L459.2,195.6" fill="none" stroke="#E8B642" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M350,275 L638,119" fill="none" stroke="#24384A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="350" cy="275" r="4.5" fill="#24384A" stroke="none" stroke-width="0"/><text x="650" y="125" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">核心：氢原子核聚变成</text><text x="650" y="147" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">氦，少量质量转为能量</text><path d="M430,245 L638,269" fill="none" stroke="#24384A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="430" cy="245" r="4.5" fill="#24384A" stroke="none" stroke-width="0"/><text x="650" y="275" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">能量在内部反复传递</text><path d="M490,275 L638,399" fill="none" stroke="#24384A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="490" cy="275" r="4.5" fill="#24384A" stroke="none" stroke-width="0"/><text x="650" y="405" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">表面发出可见光、</text><text x="650" y="427" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">红外线等电磁辐射</text></g>
  <rect x="12" y="12" width="936" height="516" rx="8" fill="none" stroke="#17213A" stroke-width="3" opacity="0.18"/>
