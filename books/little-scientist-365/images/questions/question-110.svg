  <g data-question="110" data-layout="invertebrate" data-presentation="invertebrate" data-source="invertebrate" data-icons="earthworm-soil-cutaway,burrow,roots,leaf-litter,castings"><text x="54" y="54" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="26" font-weight="760">蚯蚓洞道让空气和水进入土壤，也混合有机物</text><rect x="65" y="125" width="620" height="360" rx="0" fill="#C99D71" stroke="#24384A" stroke-width="4"/><rect x="65" y="125" width="620" height="62" rx="0" fill="#6F8D4D" stroke="#24384A" stroke-width="2"/><path d="M145,175 Q170,245 155,480 M290,175 Q255,270 300,480 M505,175 Q465,260 480,480" fill="none" stroke="#F7E8C8" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/><path d="M105,135 q35,-36 70,0 M230,142 q42,-45 85,0 M520,138 q40,-38 80,0" fill="none" stroke="#9A6A3F" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/><path d="M217.5,332 C239.5,293.5 275.25,370.5 300,332 C324.75,294.6 360.5,368.3 382.5,332" fill="none" stroke="#C87569" stroke-width="16.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M227.39999999999998,337.3005731083622 L227.39999999999998,350.50057310836223" fill="none" stroke="#9B432F" stroke-width="0.9900000000000001" stroke-linecap="round" stroke-linejoin="round"/><path d="M239.5,340.45396381204245 L239.5,353.6539638120425" fill="none" stroke="#9B432F" stroke-width="0.9900000000000001" stroke-linecap="round" stroke-linejoin="round"/><path d="M251.6,332.2148148267407 L251.6,345.4148148267407" fill="none" stroke="#9B432F" stroke-width="0.9900000000000001" stroke-linecap="round" stroke-linejoin="round"/><path d="M263.7,318.818349844399 L263.7,332.01834984439904" fill="none" stroke="#9B432F" stroke-width="0.9900000000000001" stroke-linecap="round" stroke-linejoin="round"/><path d="M275.8,310.40274648447576 L275.8,323.6027464844758" fill="none" stroke="#9B432F" stroke-width="0.9900000000000001" stroke-linecap="round" stroke-linejoin="round"/><path