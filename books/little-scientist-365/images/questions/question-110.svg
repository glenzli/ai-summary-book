" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">洞道增加通气</text><text x="730" y="138" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">和排水通路</text><path d="M300,330 L718,239" fill="none" stroke="#24384A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="300" cy="330" r="4.5" fill="#24384A" stroke="none" stroke-width="0"/><text x="730" y="245" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">蚯蚓吞食土和腐烂碎屑</text><path d="M540,132 L718,349" fill="none" stroke="#24384A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="540" cy="132" r="4.5" fill="#24384A" stroke="none" stroke-width="0"/><text x="730" y="355" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">落叶碎屑被带入土中</text><path d="M520,460 L718,449" fill="none" stroke="#24384A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="520" cy="460" r="4.5" fill="#24384A" stroke="none" stroke-width="0"/><text x="730" y="447" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">排出的蚓粪仍是</text><text x="730" y="468" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">土壤的一部分</text></g>
