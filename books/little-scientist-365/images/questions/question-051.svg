<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">冷杯子外面为什么会有水？</title>
  <desc id="desc">围绕“冷杯子外面为什么会有水？”绘制的清晰主题图；具体对象优先，必要关系用箭头表示。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#173746"/></marker>
  </defs>
  <rect width="960" height="540" fill="#F0FDFA"/>
  <path d="M0,455 Q185,410 355,455 T700,455 T1040,455 V540 H0 Z" fill="#0F8A8A" opacity="0.07"/>

  <g data-question="051" data-layout="earth-weather" data-presentation="earth-weather" data-source="earth-weather" data-icons="earth-weather-plate-051"><text x="54" y="54" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="26" font-weight="760">冷杯壁使附近空气降到露点以下，水汽便凝结在外表面</text><rect x="34" y="82" width="892" height="382" rx="4" fill="#EEE9DF" stroke="none" stroke-width="0"/><rect x="250" y="145" width="240" height="260" rx="8" fill="#D7E9ED" stroke="#24384A" stroke-width="4"/><rect x="265" y="190" width="210" height="200" rx="0" fill="#A9D9E2" stroke="none" stroke-width="0"/><path d="M225,203.3 C221.04,210.5 216.36,216.8 216.36,221.84 C216.36,232.64 233.64,232.64 233.64,221.84 C233.64,216.8 228.96,210.5 225,203.3 Z" fill="#4B86B7" stroke="#24384A" stroke-width="0.54" stroke-linecap="round" stroke-linejoin="round"/><path d="M215,263.3 C211.04,270.5 206.36,276.8 206.36,281.84 C206.36,292.64 223.64,292.64 223.64,281.84 C223.64,276.8 218.96,270.5 215,263.3 Z" fill="#4B86B7" stroke="#24384A" stroke-width="0.54" stroke-linecap="round" stroke-linejoin="round"/><path d="M230,328.3 C226.04,335.5 221.36,341.8 221.36,346.84 C221.36,357.64 238.64,357.64 238.64,346.84 C238.64,341.8 233.96,335.5 230,328.3 Z" fill="#4B86B7" stroke="#24384A" stroke-width="0.54" stroke-linecap="round" stroke-linejoin="round"/><path d="M510,193.3 C506.04,200.5 501.36,206.8 501.36,211.84 C501.36,222.64 518.64,222.64 518.64,211.84 C518.64,206.8 513.96,200.5 510,193.3 Z" fill="#4B86B7" stroke="#24384A" stroke-width="0.54" stroke-linecap="round" stroke-linejoin="round"/><path d="M520,263.3 C516.04,270.5 511.36,276.8 511.36,281.84 C511.36,292.64 528.64,292.64 528.64,281.84 C528.64,276.8 523.96,270.5 520,263.3 Z" fill="#4B86B7" stroke="#24384A" stroke-width="0.54" stroke-linecap="round" stroke-linejoin="round"/><path d="M505,328.3 C501.04,335.5 496.36,341.8 496.36,346.84 C496.36,357.64 513.64,357.64 513.64,346.84 C513.64,341.8 508.96,335.5 505,328.3 Z" fill="#4B86B7" stroke="#24384A" stroke-width="0.54" stroke-linecap="round" stroke-linejoin="round"/><circle cx="350" cy="250" r="55" fill="#FFFFFF" stroke="#4B86B7" stroke-width="3"/><path d="M700,210 Q600,220 520,235" fill="none" stroke="#2D8178" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M700,300 Q610,300 520,290" fill="none" stroke="#2D8178" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M510,235 L608,99" fill="none" stroke="#24384A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="510" cy="235" r="4.5" fill="#24384A" stroke="none" stroke-width="0"/><text x="620" y="105" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">杯外的水来自空气</text><text x="620" y="127" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">，不是穿过杯壁漏出</text><path d="M350,250 L608,274" fill="none" stroke="#24384A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="350" cy="250" r="4.5" fill="#24384A" stroke="none" stroke-width="0"/><text x="620" y="280" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">冰水让杯壁和附近空气降温</text><text x="420" y="490" fill="#24384A" text-anchor="middle" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="650">空气越湿，或杯壁越冷，通常越容易出现水珠</text></g>
  <rect x="12" y="12" width="936" height="516" rx="8" fill="none" stroke="#173746" stroke-width="3" opacity="0.18"/>
</svg>
