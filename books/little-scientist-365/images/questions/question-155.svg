  <g data-question="155" data-layout="textbook" data-presentation="textbook" data-source="textbook" data-icons="long-bone-cutaway,compact-bone,spongy-bone,marrow"><text x="54" y="54" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="26" font-weight="760">长骨不是实心石棒，也不是空吸管</text><path d="M170,245 Q190,130 275,135 L565,135 Q650,130 670,245 Q650,360 565,355 L275,355 Q190,360 170,245 Z" fill="#F3E5CB" stroke="#24384A" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M255,190 Q290,165 335,183 L500,183 Q550,165 585,190 L585,300 Q550,325 500,307 L335,307 Q290,325 255,300 Z" fill="#D8BE8B" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/><rect x="336" y="197" width="164" height="96" rx="45" fill="#E8A54D" stroke="#B97834" stroke-width="3"/><path d="M205,210 L275,280" fill="none" stroke="#C9A96E" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M205,280 L280,205" fill="none" stroke="#C9A96E" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M570,205 L640,280" fill="none" stroke="#C9A96E" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M568,282 L642,210" fill="none" stroke="#C9A96E" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M230,177 L292,238" fill="none" stroke="#C9A96E" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M548,252 L622,325" fill="none" stroke="#C9A96E" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M217,150 L686,138" fill="none" stroke="#24384A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="217" cy="150" r="5" fill="#24384A" stroke="none" stroke-width="0"/><text x="700" y="145" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="650">致密骨：坚硬外壳</text><path d="M248,236 L686,238" fill="none" stroke="#24384A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="248" cy="236" r="5" fill="#24384A" stroke="none" stroke-width="0"/><text x="700" y="245" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="650">海绵骨：轻而有支架</text><path d="M420,245 L686,338" fill="none" stroke="#24384A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="420" cy="245" r="5" fill="#24384A" stroke="none" stroke-width="0"/><text x="700" y="345" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="650">骨髓空间</text><path d="M603,315 L686,438" fill="none" stroke="#24384A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="603" cy="315" r="5" fill="#24384A" stroke="none" stroke-width="0"/><text x="700" y="445" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="650">骨内也有血管和活细胞</text></g>
