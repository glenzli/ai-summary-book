<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">螺丝为什么转着进去？</title>
  <desc id="desc">围绕“螺丝为什么转着进去？”绘制的清晰主题图；具体对象优先，必要关系用箭头表示。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#293747"/></marker>
  </defs>
  <rect width="960" height="540" fill="#FFF7ED"/>
  <path d="M0,455 Q185,410 355,455 T700,455 T1040,455 V540 H0 Z" fill="#3B78A8" opacity="0.07"/>

  <g data-question="189" data-layout="machine" data-presentation="machine" data-source="machine" data-icons="machine-plate-189"><text x="54" y="54" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="26" font-weight="760">螺纹相当于绕在圆柱上的斜面，转很多圈换取较小的直线前进</text><rect x="34" y="82" width="892" height="382" rx="4" fill="#EFEAE1" stroke="none" stroke-width="0"/><rect x="34" y="360" width="892" height="104" rx="0" fill="#C99B70" stroke="none" stroke-width="0"/><path d="M34,360 L926,360" fill="none" stroke="#24384A" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><rect x="180" y="145" width="140" height="275" rx="12" fill="#AAB7BD" stroke="#24384A" stroke-width="4"/><path d="M170,175 L330,210" fill="none" stroke="#2A5F89" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><path d="M170,217 L330,252" fill="none" stroke="#2A5F89" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><path d="M170,259 L330,294" fill="none" stroke="#2A5F89" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><path d="M170,301 L330,336" fill="none" stroke="#2A5F89" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><path d="M170,343 L330,378" fill="none" stroke="#2A5F89" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><path d="M170,385 L330,420" fill="none" stroke="#2A5F89" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="560,380 820,380 820,160" fill="#F7E9CA" stroke="#24384A" stroke-width="4" stroke-linejoin="round"/><path d="M560,380 L820,160" fill="none" stroke="#4B82B3" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><path d="M250,120 A95,95 0 0 1 345,205" fill="none" stroke="#C95757" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M250,420 L250,455" fill="none" stroke="#4B82B3" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M250,260 L608,99" fill="none" stroke="#24384A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="250" cy="260" r="4.5" fill="#24384A" stroke="none" stroke-width="0"/><text x="620" y="105" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">旋转使螺纹沿配合表面前进</text><path d="M700,270 L632,399" fill="none" stroke="#24384A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="700" cy="270" r="4.5" fill="#24384A" stroke="none" stroke-width="0"/><text x="620" y="405" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">展开螺纹可看到一条长斜坡</text></g>
  <rect x="12" y="12" width="936" height="516" rx="8" fill="none" stroke="#293747" stroke-width="3" opacity="0.18"/>
</svg>
