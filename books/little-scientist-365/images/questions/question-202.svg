<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">水泵怎样把水送上去？</title>
  <desc id="desc">围绕“水泵怎样把水送上去？”绘制的清晰主题图；具体对象优先，必要关系用箭头表示。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#293747"/></marker>
  </defs>
  <rect width="960" height="540" fill="#FFF7ED"/>
  <path d="M0,455 Q185,410 355,455 T700,455 T1040,455 V540 H0 Z" fill="#3B78A8" opacity="0.07"/>

  <g data-question="202" data-layout="machine" data-presentation="machine" data-source="machine" data-icons="machine-plate-202"><text x="54" y="54" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="26" font-weight="760">水泵让叶轮或活塞对水做功，建立压力差并推动连续水流</text><rect x="34" y="82" width="892" height="382" rx="4" fill="#EFEAE1" stroke="none" stroke-width="0"/><rect x="34" y="360" width="892" height="104" rx="0" fill="#C99B70" stroke="none" stroke-width="0"/><path d="M34,360 L926,360" fill="none" stroke="#24384A" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><rect x="120" y="210" width="320" height="190" rx="12" fill="#A8D9E2" stroke="#24384A" stroke-width="4"/><circle cx="280" cy="305" r="78" fill="#FFFFFF" stroke="#24384A" stroke-width="4"/><path d="M280,305 Q337.0,336.2 348.0,305.0" fill="none" stroke="#4B82B3" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/><path d="M280,305 Q281.5,370.0 314.0,363.9" fill="none" stroke="#4B82B3" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/><path d="M280,305 Q224.5,338.8 246.0,363.9" fill="none" stroke="#4B82B3" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/><path d="M280,305 Q223.0,273.8 212.0,305.0" fill="none" stroke="#4B82B3" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/><path d="M280,305 Q278.5,240.0 246.0,246.1" fill="none" stroke="#4B82B3" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/><path d="M280,305 Q335.5,271.2 314.0,246.1" fill="none" stroke="#4B82B3" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/><path d="M440,305 H570 V130 H830" fill="none" stroke="#4B82B3" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/><path d="M500,305 L555,305" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M570,230 L570,165" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="760" y="90" width="90" height="70" rx="5" fill="#A8D9E2" stroke="#24384A" stroke-width="3"/><path d="M280,305 L608,99" fill="none" stroke="#24384A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="280" cy="305" r="4.5" fill="#24384A" stroke="none" stroke-width="0"/><text x="620" y="105" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">叶轮提高水的速度和压力</text><path d="M570,210 L608,399" fill="none" stroke="#24384A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="570" cy="210" r="4.5" fill="#24384A" stroke="none" stroke-width="0"/><text x="620" y="405" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">管道约束水流，把压力传到较高处</text></g>
