<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">果实为什么包着种子？</title>
  <desc id="desc">围绕“果实为什么包着种子？”绘制的清晰主题图；具体对象优先，必要关系用箭头表示。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#203D2D"/></marker>
  </defs>
  <rect width="960" height="540" fill="#F5FBEF"/>
  <path d="M0,455 Q185,410 355,455 T700,455 T1040,455 V540 H0 Z" fill="#3B8C5A" opacity="0.07"/>

  <g data-question="072" data-layout="plant" data-presentation="plant" data-source="plant" data-icons="plant-plate-072"><text x="54" y="54" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="26" font-weight="760">果实由花的一部分发育而来，包住并帮助传播种子</text><rect x="34" y="82" width="892" height="382" rx="4" fill="#DDEFF3" stroke="none" stroke-width="0"/><path d="M34,330 Q170,280 315,330 T610,330 T920,330 V464 H34 Z" fill="#A7C97E" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/><rect x="34" y="360" width="892" height="104" rx="0" fill="#B8845D" stroke="none" stroke-width="0"/><path d="M34,360 Q175,328 320,360 T610,360 T930,360" fill="none" stroke="#4F8A55" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><circle cx="360" cy="280" r="135" fill="#C95858" stroke="#24384A" stroke-width="5"/><path d="M360,145 q15,-55 45,-65" fill="none" stroke="#8D6546" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/><path d="M392.5,103.75 Q420.0,68.75 466.25,95.0 Q438.75,130.0 392.5,103.75 Z" fill="#4F8A55" stroke="#24384A" stroke-width="1.0" stroke-linecap="round" stroke-linejoin="round"/><path d="M397.5,102.5 Q430,100 461.25,95.5" fill="none" stroke="#2F6744" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M412.5,100.5 l-6.25,-50 M423.75,99.25 l-5.0,-62 M437.5,98.0 l-2.5,-63 M446.25,97.0 l35,-45" fill="none" stroke="#2F6744" stroke-width="0.75" stroke-linecap="round" stroke-linejoin="round"/><path d="M360,150 A130,130 0 0 1 360,410 L360,150" fill="#F4B6A0" stroke="#24384A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="410" cy="255" rx="18" ry="30" fill="#5A4032" stroke="#24384A" stroke-width="2"/><ellipse cx="410" cy="315" rx="18" ry="30" fill="#5A4032" stroke="#24384A" stroke-width="2"/><path d="M410,255 L638,134" fill="none" stroke="#24384A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="410" cy="255" r="4.5" fill="#24384A" stroke="none" stroke-width="0"/><text x="650" y="140" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">种子含下一代的胚</text><path d="M365,215 L638,269" fill="none" stroke="#24384A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="365" cy="215" r="4.5" fill="#24384A" stroke="none" stroke-width="0"/><text x="650" y="275" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">果肉可吸引动物，也能保护种子</text><path d="M360,150 L638,399" fill="none" stroke="#24384A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="360" cy="150" r="4.5" fill="#24384A" stroke="none" stroke-width="0"/><text x="650" y="405" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">果皮来自子房壁或</text><text x="650" y="427" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">与其他花部共同形成</text></g>
  <rect x="12" y="12" width="936" height="516" rx="8" fill="none" stroke="#203D2D" stroke-width="3" opacity="0.18"/>
