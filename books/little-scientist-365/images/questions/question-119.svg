<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">蜥蜴断尾后为什么还能动？</title>
  <desc id="desc">围绕“蜥蜴断尾后为什么还能动？”绘制的清晰主题图；具体对象优先，必要关系用箭头表示。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#3D2E35"/></marker>
  </defs>
  <rect width="960" height="540" fill="#FFF8ED"/>
  <path d="M0,455 Q185,410 355,455 T700,455 T1040,455 V540 H0 Z" fill="#E66A3D" opacity="0.07"/>

  <g data-question="119" data-layout="vertebrate" data-presentation="vertebrate" data-source="vertebrate" data-icons="vertebrate-plate-119"><text x="54" y="54" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="26" font-weight="760">断尾处有预设的薄弱面，尾巴肌肉还能短时抽动</text><rect x="34" y="82" width="892" height="382" rx="4" fill="#DDEEF4" stroke="none" stroke-width="0"/><path d="M34,350 Q180,285 335,350 T650,350 T960,350 V464 H34 Z" fill="#A8CA83" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/><path d="M34,425 Q190,382 360,425 T700,425 T1040,425 V464 H34 Z" fill="#5C9659" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/><path d="M333.6,260 C354.0,227.36 428.8,227.36 470.28,257.96 C428.8,290.6 357.4,292.64 333.6,260 Z" fill="#B97A48" stroke="#24384A" stroke-width="2.72" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="476.4" cy="257.28" rx="32.64" ry="24.48" fill="#B97A48" stroke="#24384A" stroke-width="2.72"/><circle cx="486.6" cy="251.84" r="3.4000000000000004" fill="#24384A" stroke="none" stroke-width="0"/><path d="M335.64,260 C289.4,246.4 255.39999999999998,206.95999999999998 221.39999999999998,222.6" fill="none" stroke="#B97A48" stroke-width="11.56" stroke-linecap="round" stroke-linejoin="round"/><path d="M374.4,246.4 L342.44,215.8 L320.0,209.0" fill="none" stroke="#24384A" stroke-width="5.44" stroke-linecap="round" stroke-linejoin="round"/><path d="M430.84000000000003,247.76 L452.6,216.48 L479.8,211.04" fill="none" stroke="#24384A" stroke-width="5.44" stroke-linecap="round" stroke-linejoin="round"/><path d="M374.4,273.6 L342.44,304.2 L320.0,311.0" fill="none" stroke="#24384A" stroke-width="5.44" stroke-linecap="round" stroke-linejoin="round"/><path d="M430.84000000000003,272.24 L452.6,303.52 L479.8,308.96" fill="none" stroke="#24384A" stroke-width="5.44" stroke-linecap="round" stroke-linejoin="round"/><path d="M185,235 C130,210 105,240 80,275" fill="none" stroke="#D9693F" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/><path d="M192,220 L203,264" fill="none" stroke="#C95555" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 6"/><path d="M105,245 q-30,-25 -50,5 q25,20 45,35" fill="none" stroke="#C95555" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M197,242 L648,144" fill="none" stroke="#24384A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="197" cy="242" r="4.5" fill="#24384A" stroke="none" stroke-width="0"/><text x="660" y="150" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">尾椎间有容易分开的区域</text><path d="M105,245 L648,254" fill="none" stroke="#24384A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="105" cy="245" r="4.5" fill="#24384A" stroke="none" stroke-width="0"/><text x="660" y="260" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">分离后的尾段会暂</text><text x="660" y="282" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">时扭动，吸引捕食者</text><path d="M340,265 L648,379" fill="none" stroke="#24384A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="340" cy="265" r="4.5" fill="#24384A" stroke="none" stroke-width="0"/><text x="660" y="385" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">新长出的尾通常不</text><text x="660" y="407" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">完全等同原来的尾</text></g>
  <rect x="12" y="12" width="936" height="516" rx="8" fill="none" stroke="#3D2E35" stroke-width="3" opacity="0.18"/>
