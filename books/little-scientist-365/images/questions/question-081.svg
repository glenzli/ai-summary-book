  <path d="M0,455 Q185,410 355,455 T700,455 T1040,455 V540 H0 Z" fill="#3B8C5A" opacity="0.07"/>

  <g data-question="081" data-layout="plant" data-presentation="plant" data-source="plant" data-icons="plant-plate-081"><text x="54" y="54" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="26" font-weight="760">荷叶表面有微小凸起和蜡层，水珠难以铺展开</text><rect x="34" y="82" width="892" height="382" rx="4" fill="#DDEFF3" stroke="none" stroke-width="0"/><path d="M34,330 Q180,300 320,330 T610,330 T930,330 V464 H34 Z" fill="#9BD4DE" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="330" cy="285" rx="180" ry="82" fill="#4F8A55" stroke="#24384A" stroke-width="5"/><path d="M330,285 L470,240" fill="none" stroke="#2F6744" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="300" cy="230" r="35" fill="#4D86B5" stroke="#FFFFFF" stroke-width="4"/><circle cx="410" cy="260" r="24" fill="#4D86B5" stroke="#FFFFFF" stroke-width="4"/><rect x="640" y="145" width="220" height="210" rx="12" fill="#F7E9C9" stroke="#24384A" stroke-width="3"/><circle cx="670" cy="195" r="8" fill="#4F8A55" stroke="#24384A" stroke-width="1.5"/><circle cx="697" cy="195" r="8" fill="#4F8A55" stroke="#24384A" stroke-width="1.5"/><circle cx="724" cy="195" r="8" fill="#4F8A55" stroke="#24384A" stroke-width="1.5"/><circle cx="751" cy="195" r="8" fill="#4F8A55" stroke="#24384A" stroke-width="1.5"/><circle cx="778" cy="195" r="8" fill="#4F8A55" stroke="#24384A" stroke-width="1.5"/><circle cx="805" cy="195" r="8" fill="#4F8A55" stroke="#24384A" stroke-width="1.5"/><circle cx="832" cy="195" r="8" fill="#4F8A55" stroke="#24384A" stroke-width="1.5"/><circle cx="670" cy="225" r="8" fill="#4F8A55" stroke="#24384A" stroke-width="1.5"/><circle cx="697" cy="225" r="8" fill="#4F8A55" stroke="#24384A" stroke-width="1.5"/><circle cx="724" cy="225" r="8" fill="#4F8A55" stroke="#24384A" stroke-width="1.5"/><circle cx="751" cy="225" r="8" fill="#4F8A55" stroke="#24384A" stroke-width="1.5"/><circle cx="778" cy="225" r="8" fill="#4F8A55" stroke="#24384A" stroke-width="1.5"/><circle cx="805" cy="225" r="8" fill="#4F8A55" stroke="#24384A" stroke-width="1.5"/><circle cx="832" cy="225" r="8" fill="#4F8A55" stroke="#24384A" stroke-width="1.5"/><circle cx="670" cy="255" r="8" fill="#4F8A55" stroke="#24384A" stroke-width="1.5"/><circle cx="697" cy="255" r="8" fill="#4F8A55" stroke="#24384A" stroke-width="1.5"/><circle cx="724" cy="255" r="8" fill="#4F8A55" stroke="#24384A" stroke-width="1.5"/><circle cx="751" cy="255" r="8" fill="#4F8A55" stroke="#24384A" stroke-width="1.5"/><circle cx="778" cy="255" r="8" fill="#4F8A55" stroke="#24384A" stroke-width="1.5"/><circle cx="805" cy="255" r="8" fill="#4F8A55" stroke="#24384A" stroke-width="1.5"/><circle cx="832" cy="255" r="8" fill="#4F8A55" stroke="#24384A" stroke-width="1.5"/><circle cx="670" cy="285" r="8" fill="#4F8A55" stroke="#24384A" stroke-width="1.5"/><circle cx="697" cy="285" r="8" fill="#4F8A55" stroke="#24384A" stroke-width="1.5"/><circle cx="724" cy="285" r="8" fill="#4F8A55" stroke="#24384A" stroke-width="1.5"/><circle cx="751" cy="285" r="8" fill="#4F8A55" stroke="#24384A" stroke-width="1.5"/><circle cx="778" cy="285" r="8" fill="#4F8A55" stroke="#24384A" stroke-width="1.5"/><circle cx="805" cy="285" r="8" fill="#4F8A55" stroke="#24384A" stroke-width="1.5"/><circle cx="832" cy="285" r="8" fill="#4F8A55" stroke="#24384A" stroke-width="1.5"/><circle cx="670" cy="315" r="8" fill="#4F8A55" stroke="#24384A" stroke-width="1.5"/><circle cx="697" cy="315" r="8" fill="#4F8A55" stroke="#24384A" stroke-width="1.5"/><circle cx="724" cy="315" r="8" fill="#4F8A55" stroke="#24384A" stroke-width="1.5"/><circle cx="751" cy="315" r="8" fill="#4F8A55" stroke="#24384A" stroke-width="1.5"/><circle cx="778" cy="315" r="8" fill="#4F8A55" stroke="#24384A" stroke-width="1.5"/><circle cx="805" cy="315" r="8" fill="#4F8A55" stroke="#24384A" stroke-width="1.5"/><circle cx="832" cy="315" r="8" fill="#4F8A55" stroke="#24384A" stroke-width="1.5"/><path d="M690,180 q35,-70 70,0 q35,70 70,0" fill="#4D86B5" stroke="#24384A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M750,225 L632,404" fill="none" stroke="#24384A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="750" cy="225" r="4.5" fill="#24384A" stroke="none" stroke-width="0"/><text x="620" y="410" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">粗糙凸起让水只接触少数高</text><text x="620" y="432" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">点，蜡层又不易被水润湿</text><text x="405" y="490" fill="#24384A" text-anchor="middle" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="650">水珠滚动时常带走灰尘，这叫自清洁效应</text></g>
