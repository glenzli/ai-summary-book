  <g data-question="107" data-layout="invertebrate" data-presentation="invertebrate" data-source="invertebrate" data-icons="snail-anatomy,shell,mantle,soft-body,foot"><text x="54" y="54" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="26" font-weight="760">蜗牛壳是身体分泌并不断加大的保护结构</text><path d="M181.25,353.75 Q300.0,303.75 481.25,341.25 Q531.25,357.5 500.0,382.5 H200.0 Z" fill="#78B9AC" stroke="#24384A" stroke-width="5.0" stroke-linecap="round" stroke-linejoin="round"/><circle cx="306.25" cy="272.5" r="97.5" fill="#D9693F" stroke="#24384A" stroke-width="6.25"/><path d="M306.25,272.5 q60.0,-56.25 68.75,12.5 q5.0,60.0 -50.0,52.5 q-42.5,-5.0 -32.5,-42.5" fill="none" stroke="#9B432F" stroke-width="6.25" stroke-linecap="round" stroke-linejoin="round"/><path d="M425.0,341.25 L437.5,260.0" fill="none" stroke="#24384A" stroke-width="3.75" stroke-linecap="round" stroke-linejoin="round"/><circle cx="437.5" cy="255.0" r="6.25" fill="#24384A" stroke="none" stroke-width="0"/><path d="M465.0,341.25 L477.5,260.0" fill="none" stroke="#24384A" stroke-width="3.75" stroke-linecap="round" stroke-linejoin="round"/><circle cx="477.5" cy="255.0" r="6.25" fill="#24384A" stroke="none" stroke-width="0"/><path d="M306,263 q58,-55 68,12 q5,57 -48,50" fill="none" stroke="#F7E8C8" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/><path d="M315,220 L703,109" fill="none" stroke="#24384A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="315" cy="220" r="4.5" fill="#24384A" stroke="none" stroke-width="0"/><text x="715" y="115" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">壳：坚硬、会随身体长大</text><path d="M370,330 L703,219" fill="none" stroke="#24384A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="370" cy="330" r="4.5" fill="#24384A" stroke="none" stroke-width="0"/><text x="715" y="217" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">外套膜：分泌</text><text x="715" y="238" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">形成壳的材料</text><path d="M445,355 L703,329" fill="none" stroke="#24384A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="445" cy="355" r="4.5" fill="#24384A" stroke="none" stroke-width="0"/><text x="715" y="335" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">柔软身体可以缩回壳口</text><path d="M325,430 L703,434" fill="none" stroke="#24384A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="325" cy="430" r="4.5" fill="#24384A" stroke="none" stroke-width="0"/><text x="715" y="440" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">宽大的足贴着地面移动</text></g>
