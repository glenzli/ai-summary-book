<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">天空里的彩色光带是什么？</title>
  <desc id="desc">围绕“天空里的彩色光带是什么？”绘制的清晰主题图；具体对象优先，必要关系用箭头表示。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#17213A"/></marker>
  </defs>
  <rect width="960" height="540" fill="#F4F9FF"/>
  <path d="M0,455 Q185,410 355,455 T700,455 T1040,455 V540 H0 Z" fill="#2563EB" opacity="0.07"/>

  <g data-question="031" data-layout="earth-weather" data-presentation="earth-weather" data-source="earth-weather" data-icons="earth-weather-plate-031"><text x="54" y="54" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="26" font-weight="760">太阳风粒子沿地磁场进入高纬大气，使气体发出彩色光</text><rect x="34" y="82" width="892" height="382" rx="4" fill="#273552" stroke="none" stroke-width="0"/><circle cx="310" cy="300" r="105" fill="#4B86B7" stroke="#24384A" stroke-width="4"/><path d="M252,265 q35,-42 72,-22 q8,28 -14,45 q-32,18 -55,5 Z" fill="#5A9258" stroke="#24384A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M320,318 q45,-20 62,12 q-12,48 -60,47 q-27,-18 -2,-59 Z" fill="#5A9258" stroke="#24384A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M120,380 Q310,80 500,380" fill="none" stroke="#64D6A5" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/><path d="M120,358 Q310,58 500,358" fill="none" stroke="#7488E7" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/><path d="M120,336 Q310,36 500,336" fill="none" stroke="#D76DB2" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/><path d="M850,145 Q660,170 500,245" fill="none" stroke="#DE753E" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M265,150 Q155,280 275,435 M355,150 Q470,280 345,435" fill="none" stroke="#4B86B7" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M540,230 L608,99" fill="none" stroke="#24384A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="540" cy="230" r="4.5" fill="#24384A" stroke="none" stroke-width="0"/><text x="620" y="105" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">带电粒子受地磁场引导</text><path d="M340,180 L608,244" fill="none" stroke="#24384A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="340" cy="180" r="4.5" fill="#24384A" stroke="none" stroke-width="0"/><text x="620" y="250" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">氧和氮被激发后发出不同颜色的光</text><text x="440" y="490" fill="#FFFFFF" text-anchor="middle" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="620">极光高度很高，不是贴在云上的彩带</text></g>
  <rect x="12" y="12" width="936" height="516" rx="8" fill="none" stroke="#17213A" stroke-width="3" opacity="0.18"/>
</svg>
