<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">起重机怎样举起很重的东西？</title>
  <desc id="desc">围绕“起重机怎样举起很重的东西？”绘制的清晰主题图；具体对象优先，必要关系用箭头表示。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#293747"/></marker>
  </defs>
  <rect width="960" height="540" fill="#FFF7ED"/>
  <path d="M0,455 Q185,410 355,455 T700,455 T1040,455 V540 H0 Z" fill="#3B78A8" opacity="0.07"/>

  <g data-question="210" data-layout="machine" data-presentation="machine" data-source="machine" data-icons="machine-plate-210"><text x="54" y="54" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="26" font-weight="760">起重机用桁架臂跨出距离，用滑轮组省力，并用配重防止倾覆</text><rect x="34" y="82" width="892" height="382" rx="4" fill="#DFEEF1" stroke="none" stroke-width="0"/><rect x="170" y="360" width="160" height="70" rx="5" fill="#4B82B3" stroke="#24384A" stroke-width="4"/><path d="M250,360 L250,110" fill="none" stroke="#24384A" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/><path d="M250,120 L760,180" fill="none" stroke="#4B82B3" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/><path d="M250,120 L110,230" fill="none" stroke="#4B82B3" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/><rect x="80" y="225" width="120" height="95" rx="5" fill="#C95757" stroke="#24384A" stroke-width="4"/><path d="M300,131.0 L340,186.0" fill="none" stroke="#2C8178" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M340,186.0 L375,136.0" fill="none" stroke="#2C8178" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M375,140.0 L415,195.0" fill="none" stroke="#2C8178" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M415,195.0 L450,145.0" fill="none" stroke="#2C8178" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M450,149.0 L490,204.0" fill="none" stroke="#2C8178" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M490,204.0 L525,154.0" fill="none" stroke="#2C8178" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M525,158.0 L565,213.0" fill="none" stroke="#2C8178" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M565,213.0 L600,163.0" fill="none" stroke="#2C8178" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M600,167.0 L640,222.0" fill="none" stroke="#2C8178" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M640,222.0 L675,172.0" fill="none" stroke="#2C8178" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M675,176.0 L715,231.0" fill="none" stroke="#2C8178" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M715,231.0 L750,181.0" fill="none" stroke="#2C8178" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="720" cy="175" r="32" fill="#FFFFFF" stroke="#24384A" stroke-width="4"/><path d="M720,205 V365" fill="none" stroke="#24384A" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><rect x="675" y="365" width="90" height="60" rx="5" fill="#DC713E" stroke="#24384A" stroke-width="3"/><path d="M140,260 L608,99" fill="none" stroke="#24384A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="140" cy="260" r="4.5" fill="#24384A" stroke="none" stroke-width="0"/><text x="620" y="105" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">后方配重平衡长臂</text><text x="620" y="127" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">和载荷产生的转矩</text><path d="M720,175 L632,279" fill="none" stroke="#24384A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="720" cy="175" r="4.5" fill="#24384A" stroke="none" stroke-width="0"/><text x="620" y="285" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">滑轮组改变绳路并分担拉力</text><text x="430" y="495" fill="#24384A" text-anchor="middle" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="700">额定载荷随吊臂角度和伸出距离变化，不能只看物体重量</text></g>
  <rect x="12" y="12" width="936" height="516" rx="8" fill="none" stroke="#293747" stroke-width="3" opacity="0.18"/>
</svg>
