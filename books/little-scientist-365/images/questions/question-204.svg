<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">剪刀为什么有两个把手？</title>
  <desc id="desc">围绕“剪刀为什么有两个把手？”绘制的清晰主题图；具体对象优先，必要关系用箭头表示。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#293747"/></marker>
  </defs>
  <rect width="960" height="540" fill="#FFF7ED"/>
  <path d="M0,455 Q185,410 355,455 T700,455 T1040,455 V540 H0 Z" fill="#3B78A8" opacity="0.07"/>

  <g data-question="204" data-layout="machine" data-presentation="machine" data-source="machine" data-icons="machine-plate-204"><text x="54" y="54" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="26" font-weight="760">剪刀把两个一级杠杆和两片楔形刀刃装在同一转轴上</text><rect x="34" y="82" width="892" height="382" rx="4" fill="#EFEAE1" stroke="none" stroke-width="0"/><rect x="34" y="360" width="892" height="104" rx="0" fill="#C99B70" stroke="none" stroke-width="0"/><path d="M34,360 L926,360" fill="none" stroke="#24384A" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="250" cy="315" r="70" fill="none" stroke="#4B82B3" stroke-width="18"/><circle cx="390" cy="315" r="70" fill="none" stroke="#C95757" stroke-width="18"/><circle cx="320" cy="260" r="18" fill="#AAB7BD" stroke="#24384A" stroke-width="4"/><polygon points="320,250 760,135 390,275" fill="#AAB7BD" stroke="#24384A" stroke-width="4" stroke-linejoin="round"/><polygon points="320,270 760,390 390,245" fill="#AAB7BD" stroke="#24384A" stroke-width="4" stroke-linejoin="round"/><path d="M320,260 L608,99" fill="none" stroke="#24384A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="320" cy="260" r="4.5" fill="#24384A" stroke="none" stroke-width="0"/><text x="620" y="105" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">铆钉是共同支点</text><path d="M245,315 L608,244" fill="none" stroke="#24384A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="245" cy="315" r="4.5" fill="#24384A" stroke="none" stroke-width="0"/><text x="620" y="250" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">长把手放大夹持力</text><path d="M650,180 L632,399" fill="none" stroke="#24384A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="650" cy="180" r="4.5" fill="#24384A" stroke="none" stroke-width="0"/><text x="620" y="405" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">尖薄刀刃把材料推开并扩展裂口</text></g>
