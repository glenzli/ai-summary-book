  <g data-question="020" data-layout="earth-weather" data-presentation="earth-weather" data-source="earth-weather" data-icons="earth-weather-plate-020"><text x="54" y="54" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="26" font-weight="760">水结冰时形成较疏松的晶格，所以同体积冰通常更轻</text><rect x="34" y="82" width="892" height="382" rx="4" fill="#EAE7DF" stroke="none" stroke-width="0"/><rect x="135" y="150" width="350" height="260" rx="8" fill="#D6EEF2" stroke="#24384A" stroke-width="4"/><rect x="150" y="255" width="320" height="140" rx="0" fill="#A9D9E2" stroke="none" stroke-width="0"/><rect x="245" y="205" width="125" height="105" rx="5" fill="#EAF6F7" stroke="#4B86B7" stroke-width="4"/><path d="M150,255 L470,255" fill="none" stroke="#4B86B7" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><rect x="620" y="140" width="230" height="230" rx="12" fill="#F7E9CA" stroke="#24384A" stroke-width="3"/><circle cx="660" cy="180" r="7" fill="#4B86B7" stroke="#24384A" stroke-width="1.5"/><path d="M660,180 L698,180" fill="none" stroke="#295E88" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="698" cy="180" r="7" fill="#4B86B7" stroke="#24384A" stroke-width="1.5"/><path d="M698,180 L736,180" fill="none" stroke="#295E88" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="736" cy="180" r="7" fill="#4B86B7" stroke="#24384A" stroke-width="1.5"/><path d="M736,180 L774,180" fill="none" stroke="#295E88" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="774" cy="180" r="7" fill="#4B86B7" stroke="#24384A" stroke-width="1.5"/><path d="M774,180 L812,180" fill="none" stroke="#295E88" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="812" cy="180" r="7" fill="#4B86B7" stroke="#24384A" stroke-width="1.5"/><circle cx="678" cy="228" r="7" fill="#4B86B7" stroke="#24384A" stroke-width="1.5"/><path d="M678,228 L716,228" fill="none" stroke="#295E88" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="716" cy="228" r="7" fill="#4B86B7" stroke="#24384A" stroke-width="1.5"/><path d="M716,228 L754,228" fill="none" stroke="#295E88" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="754" cy="228" r="7" fill="#4B86B7" stroke="#24384A" stroke-width="1.5"/><path d="M754,228 L792,228" fill="none" stroke="#295E88" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="792" cy="228" r="7" fill="#4B86B7" stroke="#24384A" stroke-width="1.5"/><path d="M792,228 L830,228" fill="none" stroke="#295E88" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="830" cy="228" r="7" fill="#4B86B7" stroke="#24384A" stroke-width="1.5"/><circle cx="660" cy="276" r="7" fill="#4B86B7" stroke="#24384A" stroke-width="1.5"/><path d="M660,276 L698,276" fill="none" stroke="#295E88" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="698" cy="276" r="7" fill="#4B86B7" stroke="#24384A" stroke-width="1.5"/><path d="M698,276 L736,276" fill="none" stroke="#295E88" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="736" cy="276" r="7" fill="#4B86B7" stroke="#24384A" stroke-width="1.5"/><path d="M736,276 L774,276" fill="none" stroke="#295E88" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="774" cy="276" r="7" fill="#4B86B7" stroke="#24384A" stroke-width="1.5"/><path d="M774,276 L812,276" fill="none" stroke="#295E88" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="812" cy="276" r="7" fill="#4B86B7" stroke="#24384A" stroke-width="1.5"/><circle cx="678" cy="324" r="7" fill="#4B86B7" stroke="#24384A" stroke-width="1.5"/><path d="M678,324 L716,324" fill="none" stroke="#295E88" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="716" cy="324" r="7" fill="#4B86B7" stroke="#24384A" stroke-width="1.5"/><path d="M716,324 L754,324" fill="none" stroke="#295E88" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="754" cy="324" r="7" fill="#4B86B7" stroke="#24384A" stroke-width="1.5"/><path d="M754,324 L792,324" fill="none" stroke="#295E88" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="792" cy="324" r="7" fill="#4B86B7" stroke="#24384A" stroke-width="1.5"/><path d="M792,324 L830,324" fill="none" stroke="#295E88" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="830" cy="324" r="7" fill="#4B86B7" stroke="#24384A" stroke-width="1.5"/><path d="M305,250 L608,99" fill="none" stroke="#24384A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="305" cy="250" r="4.5" fill="#24384A" stroke="none" stroke-width="0"/><text x="620" y="105" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">冰的平均密度比液态</text><text x="620" y="127" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">水小，浮力可托住它</text><path d="M730,250 L632,409" fill="none" stroke="#24384A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="730" cy="250" r="4.5" fill="#24384A" stroke="none" stroke-width="0"/><text x="620" y="415" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">六角晶格留下较多空隙</text><text x="620" y="437" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">；融化后分子能靠得更近</text></g>
