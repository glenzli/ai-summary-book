<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">鸟为什么能飞起来？</title>
  <desc id="desc">围绕“鸟为什么能飞起来？”绘制的清晰主题图；具体对象优先，必要关系用箭头表示。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#24324A"/></marker>
  </defs>
  <rect width="960" height="540" fill="#FFF4F7"/>
  <path d="M0,455 Q185,410 355,455 T700,455 T1040,455 V540 H0 Z" fill="#2563A6" opacity="0.07"/>

  <g data-question="122" data-layout="vertebrate" data-presentation="vertebrate" data-source="vertebrate" data-icons="vertebrate-plate-122"><text x="54" y="54" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="26" font-weight="760">翅膀向下后方推空气，空气也把鸟托向上前方</text><rect x="34" y="82" width="892" height="382" rx="4" fill="#DDEEF4" stroke="none" stroke-width="0"/><path d="M34,350 Q180,285 335,350 T650,350 T960,350 V464 H34 Z" fill="#A8CA83" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/><path d="M34,425 Q190,382 360,425 T700,425 T1040,425 V464 H34 Z" fill="#5C9659" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="420" cy="255" rx="110.25" ry="67.2" fill="#3E77AF" stroke="#24384A" stroke-width="4.2"/><circle cx="508.2" cy="204.6" r="44.1" fill="#3E77AF" stroke="#24384A" stroke-width="4.2"/><polygon points="543.9,200.4 598.5,218.25 544.95,234.0" fill="#E6B542" stroke="#24384A" stroke-width="3.1500000000000004" stroke-linejoin="round"/><polygon points="320.25,244.5 246.75,197.25 270.9,281.25" fill="#C95555" stroke="#24384A" stroke-width="3.1500000000000004" stroke-linejoin="round"/><path d="M354.9,246.6 Q420,160.5 470.4,252.9 Q420,294.9 354.9,246.6 Z" fill="#F6E9CF" stroke="#24384A" stroke-width="3.1500000000000004" stroke-linecap="round" stroke-linejoin="round"/><circle cx="516.6" cy="197.25" r="5.25" fill="#24384A" stroke="none" stroke-width="0"/><path d="M320,255 Q405,125 520,210 Q435,250 335,290 Z" fill="#F6E9CF" stroke="#24384A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M385,230 Q390,120 430,90" fill="none" stroke="#4C86B8" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M420,285 Q430,385 385,420" fill="none" stroke="#C95555" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M395,215 L653,129" fill="none" stroke="#24384A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="395" cy="215" r="4.5" fill="#24384A" stroke="none" stroke-width="0"/><text x="665" y="135" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">弯曲的翼面让气流发生偏转</text><path d="M400,115 L653,254" fill="none" stroke="#24384A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="400" cy="115" r="4.5" fill="#24384A" stroke="none" stroke-width="0"/><text x="665" y="260" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">向上的合力必须抵消体重</text><path d="M430,335 L653,379" fill="none" stroke="#24384A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="430" cy="335" r="4.5" fill="#24384A" stroke="none" stroke-width="0"/><text x="665" y="385" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">拍翼同时提供向前的推力</text></g>
  <rect x="12" y="12" width="936" height="516" rx="8" fill="none" stroke="#24324A" stroke-width="3" opacity="0.18"/>
