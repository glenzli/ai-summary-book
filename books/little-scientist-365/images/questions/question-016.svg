  <path d="M0,455 Q185,410 355,455 T700,455 T1040,455 V540 H0 Z" fill="#2563EB" opacity="0.07"/>

  <g data-question="016" data-layout="earth-weather" data-presentation="earth-weather" data-source="earth-weather" data-icons="earth-weather-plate-016"><text x="54" y="54" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="26" font-weight="760">地球由西向东自转，所以太阳看起来从东方升起</text><rect x="34" y="82" width="892" height="382" rx="4" fill="#DCEEF4" stroke="none" stroke-width="0"/><path d="M34,350 Q175,285 325,350 T635,350 T945,350 V464 H34 Z" fill="#A6C982" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/><path d="M34,425 Q190,380 355,425 T690,425 T1030,425 V464 H34 Z" fill="#5A9258" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/><circle cx="160" cy="305" r="45" fill="#E8B642" stroke="#DE753E" stroke-width="4"/><path d="M215.0,305.0 L243.0,305.0" fill="none" stroke="#DE753E" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M207.63139720814414,332.5 L231.88010851410843,346.5" fill="none" stroke="#DE753E" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M187.5,352.6313972081441 L201.5,376.88010851410843" fill="none" stroke="#DE753E" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M160.0,360.0 L160.0,388.0" fill="none" stroke="#DE753E" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M132.5,352.6313972081441 L118.50000000000001,376.88010851410843" fill="none" stroke="#DE753E" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M112.36860279185586,332.5 L88.11989148589159,346.5" fill="none" stroke="#DE753E" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M105.0,305.0 L77.0,305.0" fill="none" stroke="#DE753E" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M112.36860279185586,277.5 L88.11989148589157,263.5" fill="none" stroke="#DE753E" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M132.49999999999997,257.3686027918559 L118.49999999999997,233.11989148589163" fill="none" stroke="#DE753E" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M160.0,250.0 L159.99999999999997,222.0" fill="none" stroke="#DE753E" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M187.5,257.3686027918559 L201.5,233.1198914858916" fill="none" stroke="#DE753E" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M207.6313972081441,277.5 L231.88010851410837,263.49999999999994" fill="none" stroke="#DE753E" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="700" cy="230" r="92" fill="#4B86B7" stroke="#24384A" stroke-width="4"/><path d="M642,195 q35,-42 72,-22 q8,28 -14,45 q-32,18 -55,5 Z" fill="#5A9258" stroke="#24384A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M710,248 q45,-20 62,12 q-12,48 -60,47 q-27,-18 -2,-59 Z" fill="#5A9258" stroke="#24384A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M735,130 A120,120 0 0 1 790,245" fill="none" stroke="#4B86B7" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><circle cx="420" cy="294.4" r="14.399999999999999" fill="#E7B39E" stroke="#24384A" stroke-width="1.44"/><path d="M420,310.24 L420,361.6" fill="none" stroke="#273552" stroke-width="5.76" stroke-linecap="round" stroke-linejoin="round"/><path d="M420,330.4 L390.24,347.2" fill="none" stroke="#273552" stroke-width="4.32" stroke-linecap="round" stroke-linejoin="round"/><path d="M420,330.4 L449.76,347.2" fill="none" stroke="#273552" stroke-width="4.32" stroke-linecap="round" stroke-linejoin="round"/><path d="M420,360.16 L396.96,395.2" fill="none" stroke="#273552" stroke-width="4.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M420,360.16 L443.04,395.2" fill="none" stroke="#273552" stroke-width="4.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M420,250 Q300,245 205,290" fill="none" stroke="#DE753E" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="160" y="390" fill="#24384A" text-anchor="middle" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="650">东方地平线</text><path d="M700,150 L622,99" fill="none" stroke="#24384A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="700" cy="150" r="4.5" fill="#24384A" stroke="none" stroke-width="0"/><text x="610" y="105" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">真实运动是地球自西向东转</text><text x="450" y="490" fill="#24384A" text-anchor="middle" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="660">我们随地面一起转，便看见太阳相对天空向西移动</text></g>
