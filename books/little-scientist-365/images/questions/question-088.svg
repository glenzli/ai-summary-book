<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">土豆是植物的根吗？</title>
  <desc id="desc">围绕“土豆是植物的根吗？”绘制的清晰主题图；具体对象优先，必要关系用箭头表示。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#203D2D"/></marker>
  </defs>
  <rect width="960" height="540" fill="#F5FBEF"/>
  <path d="M0,455 Q185,410 355,455 T700,455 T1040,455 V540 H0 Z" fill="#3B8C5A" opacity="0.07"/>

  <g data-question="088" data-layout="plant" data-presentation="plant" data-source="plant" data-icons="plant-plate-088"><text x="54" y="54" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="26" font-weight="760">土豆是膨大的地下茎；“芽眼”能长出新的枝叶</text><rect x="34" y="82" width="892" height="190" rx="4" fill="#DDEFF3" stroke="none" stroke-width="0"/><rect x="34" y="272" width="892" height="192" rx="0" fill="#B8845D" stroke="none" stroke-width="0"/><path d="M34,272 Q165,245 300,272 T580,272 T860,272 T980,272" fill="none" stroke="#4F8A55" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><circle cx="115" cy="335" r="8" fill="#76523B" stroke="none" stroke-width="0"/><circle cx="175" cy="402" r="6" fill="#76523B" stroke="none" stroke-width="0"/><circle cx="820" cy="330" r="9" fill="#76523B" stroke="none" stroke-width="0"/><circle cx="745" cy="420" r="7" fill="#76523B" stroke="none" stroke-width="0"/><path d="M300,275 L300,172.5" fill="none" stroke="#2F6744" stroke-width="8.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M300,205.3 Q246.7,156.10000000000002 213.9,194.64 Q249.16,234.0 300,217.6 Z" fill="#4F8A55" stroke="#24384A" stroke-width="2.46" stroke-linecap="round" stroke-linejoin="round"/><path d="M300,183.16000000000003 Q353.3,138.06 390.2,180.7 Q350.84,222.52 300,202.84 Z" fill="#8FC676" stroke="#24384A" stroke-width="2.46" stroke-linecap="round" stroke-linejoin="round"/><path d="M300,275 C296.72,320.1 308.2,365.2 290.16,402.1" fill="none" stroke="#F7E9C9" stroke-width="7.38" stroke-linecap="round" stroke-linejoin="round"/><path d="M298.36,320.1 q-45.099999999999994,22.959999999999997 -59.04,55.76 M302.46,334.86 q42.64,20.5 54.94,57.4" fill="none" stroke="#F7E9C9" stroke-width="4.1" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="390" cy="390" rx="82" ry="47" fill="#D2A064" stroke="#24384A" stroke-width="4"/><ellipse cx="520" cy="410" rx="70" ry="42" fill="#D2A064" stroke="#24384A" stroke-width="4"/><circle cx="365" cy="380" r="7" fill="#5A4032" stroke="none" stroke-width="0"/><circle cx="420" cy="405" r="7" fill="#5A4032" stroke="none" stroke-width="0"/><circle cx="505" cy="398" r="7" fill="#5A4032" stroke="none" stroke-width="0"/><circle cx="540" cy="420" r="7" fill="#5A4032" stroke="none" stroke-width="0"/><path d="M300,330 Q360,340 390,365 M310,340 Q430,355 520,380" fill="none" stroke="#2F6744" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><path d="M390,390 L638,139" fill="none" stroke="#24384A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="390" cy="390" r="4.5" fill="#24384A" stroke="none" stroke-width="0"/><text x="650" y="145" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">块茎储存淀粉，是茎的一部分</text><path d="M420,405 L638,274" fill="none" stroke="#24384A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="420" cy="405" r="4.5" fill="#24384A" stroke="none" stroke-width="0"/><text x="650" y="280" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">芽眼是缩短枝条上的芽</text><path d="M305,335 L638,399" fill="none" stroke="#24384A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="305" cy="335" r="4.5" fill="#24384A" stroke="none" stroke-width="0"/><text x="650" y="405" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">连接块茎的是地下</text><text x="650" y="427" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">匍匐茎，不是主根</text></g>
