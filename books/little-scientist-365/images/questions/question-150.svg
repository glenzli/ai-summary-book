<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">动物脚印能告诉我们什么？</title>
  <desc id="desc">围绕“动物脚印能告诉我们什么？”绘制的清晰主题图；具体对象优先，必要关系用箭头表示。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#24324A"/></marker>
  </defs>
  <rect width="960" height="540" fill="#FFF4F7"/>
  <path d="M0,455 Q185,410 355,455 T700,455 T1040,455 V540 H0 Z" fill="#2563A6" opacity="0.07"/>

  <g data-question="150" data-layout="vertebrate" data-presentation="vertebrate" data-source="vertebrate" data-icons="vertebrate-plate-150"><text x="54" y="54" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="26" font-weight="760">一串脚印要和步距、方向、地面与生活环境一起读</text><rect x="34" y="82" width="892" height="382" rx="4" fill="#E8E1D4" stroke="none" stroke-width="0"/><g transform="translate(150 350) rotate(-18)"><ellipse cx="0" cy="10" rx="25" ry="34" fill="#8B6549" stroke="#24384A" stroke-width="3"/><circle cx="-24" cy="-25" r="12" fill="#8B6549" stroke="#24384A" stroke-width="2"/><circle cx="0" cy="-32" r="12" fill="#8B6549" stroke="#24384A" stroke-width="2"/><circle cx="24" cy="-25" r="12" fill="#8B6549" stroke="#24384A" stroke-width="2"/></g><g transform="translate(270 300) rotate(12)"><ellipse cx="0" cy="10" rx="25" ry="34" fill="#8B6549" stroke="#24384A" stroke-width="3"/><circle cx="-24" cy="-25" r="12" fill="#8B6549" stroke="#24384A" stroke-width="2"/><circle cx="0" cy="-32" r="12" fill="#8B6549" stroke="#24384A" stroke-width="2"/><circle cx="24" cy="-25" r="12" fill="#8B6549" stroke="#24384A" stroke-width="2"/></g><g transform="translate(390 250) rotate(-16)"><ellipse cx="0" cy="10" rx="25" ry="34" fill="#8B6549" stroke="#24384A" stroke-width="3"/><circle cx="-24" cy="-25" r="12" fill="#8B6549" stroke="#24384A" stroke-width="2"/><circle cx="0" cy="-32" r="12" fill="#8B6549" stroke="#24384A" stroke-width="2"/><circle cx="24" cy="-25" r="12" fill="#8B6549" stroke="#24384A" stroke-width="2"/></g><g transform="translate(515 205) rotate(14)"><ellipse cx="0" cy="10" rx="25" ry="34" fill="#8B6549" stroke="#24384A" stroke-width="3"/><circle cx="-24" cy="-25" r="12" fill="#8B6549" stroke="#24384A" stroke-width="2"/><circle cx="0" cy="-32" r="12" fill="#8B6549" stroke="#24384A" stroke-width="2"/><circle cx="24" cy="-25" r="12" fill="#8B6549" stroke="#24384A" stroke-width="2"/></g><g transform="translate(650 165) rotate(-12)"><ellipse cx="0" cy="10" rx="25" ry="34" fill="#8B6549" stroke="#24384A" stroke-width="3"/><circle cx="-24" cy="-25" r="12" fill="#8B6549" stroke="#24384A" stroke-width="2"/><circle cx="0" cy="-32" r="12" fill="#8B6549" stroke="#24384A" stroke-width="2"/><circle cx="24" cy="-25" r="12" fill="#8B6549" stroke="#24384A" stroke-width="2"/></g><path d="M120,410 Q380,285 700,115" fill="none" stroke="#2D8079" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M270,300 L658,219" fill="none" stroke="#24384A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="270" cy="300" r="4.5" fill="#24384A" stroke="none" stroke-width="0"/><text x="670" y="225" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">形状帮助判断脚掌和趾的类型</text><path d="M515,205 L658,329" fill="none" stroke="#24384A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="515" cy="205" r="4.5" fill="#24384A" stroke="none" stroke-width="0"/><text x="670" y="335" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">前后间距与左右排列反映步态</text><text x="445" y="495" fill="#24384A" text-anchor="middle" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="650">脚印能给出线索，通常不能单靠一枚印记确定物种</text></g>
  <rect x="12" y="12" width="936" height="516" rx="8" fill="none" stroke="#24324A" stroke-width="3" opacity="0.18"/>
</svg>
