  <g data-question="106" data-layout="invertebrate" data-presentation="invertebrate" data-source="invertebrate" data-icons="stick-insect-on-twig,body-outline,jointed-legs,camouflage"><text x="54" y="54" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="26" font-weight="760">竹节虫的身体和腿在真实树枝旁很难被发现</text><path d="M90,430 Q280,335 455,360 T865,190" fill="none" stroke="#87654A" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/><path d="M310,345 Q260,270 215,220 M590,310 Q640,235 700,190" fill="none" stroke="#87654A" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="475" cy="300" rx="18" ry="128" fill="#568A58" stroke="#24384A" stroke-width="4"/><circle cx="475" cy="158" r="23" fill="#568A58" stroke="#24384A" stroke-width="4"/><path d="M468,142 Q450,108 430,118 M482,142 Q505,110 520,125" fill="none" stroke="#24384A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M475,215 L370,170 L315,190" fill="none" stroke="#24384A" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M475,215 L580,250 L635,230" fill="none" stroke="#24384A" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M475,280 L340,235 L285,255" fill="none" stroke="#24384A" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M475,280 L610,315 L665,295" fill="none" stroke="#24384A" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M475,350 L360,305 L305,325" fill="none" stroke="#24384A" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M475,350 L590,385 L645,365" fill="none" stroke="#24384A" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M445,145 Q410,300 455,430" fill="none" stroke="#D9693F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="8 8"/><path d="M475,240 L708,109" fill="none" stroke="#24384A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="475" cy="240" r="4.5" fill="#24384A" stroke="none" stroke-width="0"/><text x="720" y="115" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">细长身体像一段嫩枝</text><path d="M610,315 L708,244" fill="none" stroke="#24384A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="610" cy="315" r="4.5" fill="#24384A" stroke="none" stroke-width="0"/><text x="720" y="250" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">关节腿也像分叉小枝</text><path d="M475,380 L708,379" fill="none" stroke="#24384A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="475" cy="380" r="4.5" fill="#24384A" stroke="none" stroke-width="0"/><text x="720" y="377" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">颜色和静止姿势</text><text x="720" y="398" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">共同形成伪装</text></g>
