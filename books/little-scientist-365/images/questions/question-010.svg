  <g data-question="010" data-layout="earth-weather" data-presentation="earth-weather" data-source="earth-weather" data-icons="earth-weather-plate-010"><text x="54" y="54" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="26" font-weight="760">地球背向太阳的一半收不到直射阳光，于是进入夜晚</text><rect x="34" y="82" width="892" height="382" rx="4" fill="#273552" stroke="none" stroke-width="0"/><circle cx="160" cy="270" r="58" fill="#E8B642" stroke="#DE753E" stroke-width="4"/><path d="M228.0,270.0 L256.0,270.0" fill="none" stroke="#DE753E" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M218.88972745734185,304.0 L243.1384387633061,318.0" fill="none" stroke="#DE753E" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M194.0,328.88972745734185 L208.0,353.1384387633061" fill="none" stroke="#DE753E" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M160.0,338.0 L160.0,366.0" fill="none" stroke="#DE753E" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M126.00000000000001,328.88972745734185 L112.00000000000001,353.1384387633061" fill="none" stroke="#DE753E" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M101.11027254265817,304.0 L76.86156123669389,318.0" fill="none" stroke="#DE753E" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M92.0,270.0 L64.0,270.0" fill="none" stroke="#DE753E" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M101.11027254265815,236.0 L76.86156123669387,222.00000000000003" fill="none" stroke="#DE753E" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M125.99999999999997,211.1102725426582 L111.99999999999996,186.86156123669392" fill="none" stroke="#DE753E" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M160.0,202.0 L159.99999999999997,174.0" fill="none" stroke="#DE753E" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M194.0,211.11027254265818 L208.0,186.8615612366939" fill="none" stroke="#DE753E" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M218.8897274573418,235.99999999999997 L243.13843876330608,221.99999999999994" fill="none" stroke="#DE753E" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="650" cy="270" r="125" fill="#4B86B7" stroke="#24384A" stroke-width="4"/><path d="M592,235 q35,-42 72,-22 q8,28 -14,45 q-32,18 -55,5 Z" fill="#5A9258" stroke="#24384A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M660,288 q45,-20 62,12 q-12,48 -60,47 q-27,-18 -2,-59 Z" fill="#5A9258" stroke="#24384A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M650,145 A125,125 0 0 1 650,395 A125,125 0 0 0 650,145 Z" fill="#273552" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/><path d="M220,210 L525,160 L525,380 L220,330 Z" fill="#E8B642" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round" opacity="0.23"/><path d="M590,270 L598,109" fill="none" stroke="#24384A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="590" cy="270" r="4.5" fill="#24384A" stroke="none" stroke-width="0"/><text x="610" y="115" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">向着太阳的一面是白天</text><path d="M710,270 L622,404" fill="none" stroke="#24384A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="710" cy="270" r="4.5" fill="#24384A" stroke="none" stroke-width="0"/><text x="610" y="410" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">背向太阳的一面是夜晚</text><text x="430" y="495" fill="#FFFFFF" text-anchor="middle" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="650">夜晚变黑不是太阳熄灭，而是所在地点转进背光面</text></g>
