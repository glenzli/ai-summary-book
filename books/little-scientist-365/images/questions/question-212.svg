<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">机器人怎么知道周围有什么？</title>
  <desc id="desc">围绕“机器人怎么知道周围有什么？”绘制的清晰主题图；具体对象优先，必要关系用箭头表示。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#293747"/></marker>
  </defs>
  <rect width="960" height="540" fill="#FFF7ED"/>
  <path d="M0,455 Q185,410 355,455 T700,455 T1040,455 V540 H0 Z" fill="#3B78A8" opacity="0.07"/>

  <g data-question="212" data-layout="machine" data-presentation="machine" data-source="machine" data-icons="machine-plate-212"><text x="54" y="54" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="26" font-weight="760">机器人用传感器取得信号，控制器判断，再驱动电机执行动作</text><rect x="34" y="82" width="892" height="382" rx="4" fill="#EFEAE1" stroke="none" stroke-width="0"/><rect x="34" y="360" width="892" height="104" rx="0" fill="#C99B70" stroke="none" stroke-width="0"/><path d="M34,360 L926,360" fill="none" stroke="#24384A" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><rect x="300" y="175" width="220" height="180" rx="15" fill="#4B82B3" stroke="#24384A" stroke-width="4"/><circle cx="410" cy="135" r="70" fill="#AAB7BD" stroke="#24384A" stroke-width="4"/><circle cx="385" cy="125" r="14" fill="#FFFFFF" stroke="#24384A" stroke-width="2"/><circle cx="435" cy="125" r="14" fill="#FFFFFF" stroke="#24384A" stroke-width="2"/><rect x="350" y="355" width="35" height="90" rx="8" fill="#24384A" stroke="#24384A" stroke-width="3"/><rect x="435" y="355" width="35" height="90" rx="8" fill="#24384A" stroke="#24384A" stroke-width="3"/><path d="M300,225 L210,315" fill="none" stroke="#24384A" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/><path d="M520,225 L610,315" fill="none" stroke="#24384A" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/><path d="M360,265 H460" fill="none" stroke="#2C8178" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><circle cx="360" cy="265" r="10" fill="#E6B441" stroke="none" stroke-width="0"/><circle cx="410" cy="265" r="10" fill="#E6B441" stroke="none" stroke-width="0"/><circle cx="460" cy="265" r="10" fill="#E6B441" stroke="none" stroke-width="0"/><rect x="680" y="145" width="180" height="210" rx="12" fill="#F7E9CA" stroke="#24384A" stroke-width="3"/><path d="M710,205 L815,205" fill="none" stroke="#4B82B3" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M815,255 L710,255" fill="none" stroke="#C95757" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M710,305 L815,305" fill="none" stroke="#2C8178" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="760" y="390" fill="#24384A" text-anchor="middle" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">感知—计算—动作</text><path d="M410,135 L608,99" fill="none" stroke="#24384A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="410" cy="135" r="4.5" fill="#24384A" stroke="none" stroke-width="0"/><text x="620" y="105" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">摄像头、测距器和触觉</text><text x="620" y="127" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">器件把环境变成信号</text><text x="420" y="500" fill="#24384A" text-anchor="middle" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="700">传感器并不“理解”世界；程序或学习模型解释测量结果</text></g>
  <rect x="12" y="12" width="936" height="516" rx="8" fill="none" stroke="#293747" stroke-width="3" opacity="0.18"/>
