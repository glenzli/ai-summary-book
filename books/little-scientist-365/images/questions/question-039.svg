<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">雨为什么会落下来？</title>
  <desc id="desc">围绕“雨为什么会落下来？”绘制的清晰主题图；具体对象优先，必要关系用箭头表示。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#173746"/></marker>
  </defs>
  <rect width="960" height="540" fill="#F0FDFA"/>
  <path d="M0,455 Q185,410 355,455 T700,455 T1040,455 V540 H0 Z" fill="#0F8A8A" opacity="0.07"/>

  <g data-question="039" data-layout="earth-weather" data-presentation="earth-weather" data-source="earth-weather" data-icons="earth-weather-plate-039"><text x="54" y="54" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="26" font-weight="760">云滴碰并长大，重力超过上升气流和空气阻力后落成雨</text><rect x="34" y="82" width="892" height="382" rx="4" fill="#DCEEF4" stroke="none" stroke-width="0"/><path d="M34,350 Q175,285 325,350 T635,350 T945,350 V464 H34 Z" fill="#A6C982" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/><path d="M34,425 Q190,380 355,425 T690,425 T1030,425 V464 H34 Z" fill="#5A9258" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/><circle cx="315.25" cy="203.8" r="51.74999999999999" fill="#75838C" stroke="#24384A" stroke-width="3.4499999999999997"/><circle cx="372.75" cy="161.25" r="71.3" fill="#75838C" stroke="#24384A" stroke-width="3.4499999999999997"/><circle cx="447.5" cy="184.25" r="59.8" fill="#75838C" stroke="#24384A" stroke-width="3.4499999999999997"/><rect x="265.8" y="199.2" width="235.74999999999997" height="71.3" rx="32.199999999999996" fill="#75838C" stroke="#24384A" stroke-width="3.4499999999999997"/><path d="M300,168.3 C296.04,175.5 291.36,181.8 291.36,186.84 C291.36,197.64 308.64,197.64 308.64,186.84 C308.64,181.8 303.96,175.5 300,168.3 Z" fill="#4B86B7" stroke="#24384A" stroke-width="0.54" stroke-linecap="round" stroke-linejoin="round"/><path d="M350,189.4 C344.72,199.0 338.48,207.4 338.48,214.12 C338.48,228.52 361.52,228.52 361.52,214.12 C361.52,207.4 355.28,199.0 350,189.4 Z" fill="#4B86B7" stroke="#24384A" stroke-width="0.72" stroke-linecap="round" stroke-linejoin="round"/><path d="M400,189.2 C392.96,202.0 384.64,213.2 384.64,222.16 C384.64,241.36 415.36,241.36 415.36,222.16 C415.36,213.2 407.04,202.0 400,189.2 Z" fill="#4B86B7" stroke="#24384A" stroke-width="0.96" stroke-linecap="round" stroke-linejoin="round"/><path d="M450,192.7 C440.76,209.5 429.84,224.2 429.84,235.96 C429.84,261.15999999999997 470.16,261.15999999999997 470.16,235.96 C470.16,224.2 459.24,209.5 450,192.7 Z" fill="#4B86B7" stroke="#24384A" stroke-width="1.26" stroke-linecap="round" stroke-linejoin="round"/><path d="M500,207.3 C487.24,230.5 472.16,250.8 472.16,267.04 C472.16,301.84 527.84,301.84 527.84,267.04 C527.84,250.8 512.76,230.5 500,207.3 Z" fill="#4B86B7" stroke="#24384A" stroke-width="1.7399999999999998" stroke-linecap="round" stroke-linejoin="round"/><path d="M320,313.75 C314.5,323.75 308.0,332.5 308.0,339.5 C308.0,354.5 332.0,354.5 332.0,339.5 C332.0,332.5 325.5,323.75 320,313.75 Z" fill="#4B86B7" stroke="#24384A" stroke-width="0.75" stroke-linecap="round" stroke-linejoin="round"/><path d="M320,345 L320,395" fill="none" stroke="#4B86B7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M390,348.75 C384.5,358.75 378.0,367.5 378.0,374.5 C378.0,389.5 402.0,389.5 402.0,374.5 C402.0,367.5 395.5,358.75 390,348.75 Z" fill="#4B86B7" stroke="#24384A" stroke-width="0.75" stroke-linecap="round" stroke-linejoin="round"/><path d="M390,380 L390,430" fill="none" stroke="#4B86B7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M470,323.75 C464.5,333.75 458.0,342.5 458.0,349.5 C458.0,364.5 482.0,364.5 482.0,349.5 C482.0,342.5 475.5,333.75 470,323.75 Z" fill="#4B86B7" stroke="#24384A" stroke-width="0.75" stroke-linecap="round" stroke-linejoin="round"/><path d="M470,355 L470,405" fill="none" stroke="#4B86B7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M520,368.75 C514.5,378.75 508.0,387.5 508.0,394.5 C508.0,409.5 532.0,409.5 532.0,394.5 C532.0,387.5 525.5,378.75 520,368.75 Z" fill="#4B86B7" stroke="#24384A" stroke-width="0.75" stroke-linecap="round" stroke-linejoin="round"/><path d="M520,400 L520,450" fill="none" stroke="#4B86B7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M420,215 L608,99" fill="none" stroke="#24384A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="420" cy="215" r="4.5" fill="#24384A" stroke="none" stroke-width="0"/><text x="620" y="105" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">小滴碰撞、合并，</text><text x="620" y="127" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">冰晶也可长大并融化</text><path d="M470,350 L608,324" fill="none" stroke="#24384A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="470" cy="350" r="4.5" fill="#24384A" stroke="none" stroke-width="0"/><text x="620" y="330" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">雨滴离开云后仍会受</text><text x="620" y="352" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">空气阻力并可能蒸发</text><text x="420" y="495" fill="#24384A" text-anchor="middle" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="710">不是云“装满了水”才漏下来，而是滴的大小和气流条件改变</text></g>
