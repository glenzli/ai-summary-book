  <g data-question="162" data-layout="textbook" data-presentation="textbook" data-source="textbook" data-icons="hiccup,diaphragm,airway,glottis"><text x="54" y="54" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="26" font-weight="760">打嗝是膈肌突然收缩后的反射</text><path d="M340,132 Q295,220 335,365 Q440,420 545,365 Q585,220 540,132" fill="#F7D9C7" stroke="#24384A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="390" cy="245" rx="48" ry="100" fill="#F2A6B5" stroke="#24384A" stroke-width="3"/><ellipse cx="490" cy="245" rx="48" ry="100" fill="#F2A6B5" stroke="#24384A" stroke-width="3"/><path d="M440,105 L440,224" fill="none" stroke="#7DB3C8" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/><path d="M330,350 Q440,405 550,350" fill="none" stroke="#C95B63" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/><path d="M440,75 L440,132" fill="none" stroke="#487DB8" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M417,122 Q440,105 463,122" fill="none" stroke="#C95B63" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><text x="440" y="100" fill="#24384A" text-anchor="middle" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="21" font-weight="700">声门突然关闭</text><path d="M440,370 L686,223" fill="none" stroke="#24384A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="440" cy="370" r="5" fill="#24384A" stroke="none" stroke-width="0"/><text x="700" y="230" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="650">膈肌不自主收缩</text><path d="M440,121 L686,333" fill="none" stroke="#24384A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="440" cy="121" r="5" fill="#24384A" stroke="none" stroke-width="0"/><text x="700" y="340" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="650">快速进气后发出“嗝”声</text></g>
