<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">为什么戴帽子也会暖和？</title>
  <desc id="desc">围绕“为什么戴帽子也会暖和？”绘制的清晰主题图；具体对象优先，必要关系用箭头表示。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#17213A"/></marker>
  </defs>
  <rect width="960" height="540" fill="#F4F9FF"/>
  <path d="M0,455 Q185,410 355,455 T700,455 T1040,455 V540 H0 Z" fill="#2563EB" opacity="0.07"/>

  <g data-question="025" data-layout="earth-weather" data-presentation="earth-weather" data-source="earth-weather" data-icons="earth-weather-plate-025"><text x="54" y="54" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="26" font-weight="760">帽子减少头部的对流、传导和辐射散热</text><rect x="34" y="82" width="892" height="382" rx="4" fill="#E2ECEF" stroke="none" stroke-width="0"/><circle cx="360" cy="254.25" r="25.5" fill="#E7B39E" stroke="#24384A" stroke-width="2.55"/><path d="M360,282.3 L360,373.25" fill="none" stroke="#273552" stroke-width="10.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M360,318.0 L307.3,347.75" fill="none" stroke="#273552" stroke-width="7.6499999999999995" stroke-linecap="round" stroke-linejoin="round"/><path d="M360,318.0 L412.7,347.75" fill="none" stroke="#273552" stroke-width="7.6499999999999995" stroke-linecap="round" stroke-linejoin="round"/><path d="M360,370.7 L319.2,432.75" fill="none" stroke="#273552" stroke-width="8.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M360,370.7 L400.8,432.75" fill="none" stroke="#273552" stroke-width="8.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M285,225 Q360,145 435,225 Z" fill="#C85555" stroke="#24384A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><rect x="275" y="220" width="170" height="35" rx="15" fill="#C85555" stroke="#24384A" stroke-width="3"/><path d="M310,180 Q280,130 250,105" fill="none" stroke="#DE753E" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M360,160 Q360,110 360,85" fill="none" stroke="#DE753E" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M410,180 Q450,130 485,110" fill="none" stroke="#DE753E" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M355,215 L608,119" fill="none" stroke="#24384A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="355" cy="215" r="4.5" fill="#24384A" stroke="none" stroke-width="0"/><text x="620" y="125" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">帽内空气层减慢热流</text><path d="M280,230 L608,269" fill="none" stroke="#24384A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="280" cy="230" r="4.5" fill="#24384A" stroke="none" stroke-width="0"/><text x="620" y="275" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">遮住耳朵和额头可减少迎风面积</text><text x="420" y="490" fill="#24384A" text-anchor="middle" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="700">头并不会神奇地失去“大多数”热；哪里暴露，哪里就更容易散热</text></g>
  <rect x="12" y="12" width="936" height="516" rx="8" fill="none" stroke="#17213A" stroke-width="3" opacity="0.18"/>
</svg>
