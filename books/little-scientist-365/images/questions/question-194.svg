<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">磁铁为什么能隔空吸东西？</title>
  <desc id="desc">围绕“磁铁为什么能隔空吸东西？”绘制的清晰主题图；具体对象优先，必要关系用箭头表示。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#293747"/></marker>
  </defs>
  <rect width="960" height="540" fill="#FFF7ED"/>
  <path d="M0,455 Q185,410 355,455 T700,455 T1040,455 V540 H0 Z" fill="#3B78A8" opacity="0.07"/>

  <g data-question="194" data-layout="machine" data-presentation="machine" data-source="machine" data-icons="machine-plate-194"><text x="54" y="54" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="26" font-weight="760">磁铁周围有磁场，铁磁材料中的磁畴会被重新排列</text><rect x="34" y="82" width="892" height="382" rx="4" fill="#EFEAE1" stroke="none" stroke-width="0"/><rect x="34" y="360" width="892" height="104" rx="0" fill="#C99B70" stroke="none" stroke-width="0"/><path d="M34,360 L926,360" fill="none" stroke="#24384A" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M203.5,178.5 V280.5 Q203.5,348.5 280,348.5 Q356.5,348.5 356.5,280.5 V178.5 H309.75 V278.8 Q309.75,301.75 280,301.75 Q250.25,301.75 250.25,278.8 V178.5 Z" fill="#C95757" stroke="#24384A" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M155,250 Q280,38.75 405,250 Q280,461.25 155,250" fill="none" stroke="#4B82B3" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M115,250 Q280,28.75 445,250 Q280,471.25 115,250" fill="none" stroke="#4B82B3" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M75,250 Q280,18.75 485,250 Q280,481.25 75,250" fill="none" stroke="#4B82B3" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><g transform="translate(650 220) rotate(-20)"><rect x="-45" y="-8" width="90" height="16" rx="4" fill="#AAB7BD" stroke="#24384A" stroke-width="2"/></g><g transform="translate(730 270) rotate(15)"><rect x="-45" y="-8" width="90" height="16" rx="4" fill="#AAB7BD" stroke="#24384A" stroke-width="2"/></g><g transform="translate(805 325) rotate(-10)"><rect x="-45" y="-8" width="90" height="16" rx="4" fill="#AAB7BD" stroke="#24384A" stroke-width="2"/></g><path d="M280,255 L608,99" fill="none" stroke="#24384A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="280" cy="255" r="4.5" fill="#24384A" stroke="none" stroke-width="0"/><text x="620" y="105" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">磁场不需要接触就</text><text x="620" y="127" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">能对磁性材料施力</text><path d="M730,270 L632,389" fill="none" stroke="#24384A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="730" cy="270" r="4.5" fill="#24384A" stroke="none" stroke-width="0"/><text x="620" y="395" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">普通铁钉靠近后会被</text><text x="620" y="417" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">暂时磁化并受到吸引</text></g>
  <rect x="12" y="12" width="936" height="516" rx="8" fill="none" stroke="#293747" stroke-width="3" opacity="0.18"/>
</svg>
