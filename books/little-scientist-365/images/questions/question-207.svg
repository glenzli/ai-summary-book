<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">门为什么绕着一边转？</title>
  <desc id="desc">围绕“门为什么绕着一边转？”绘制的清晰主题图；具体对象优先，必要关系用箭头表示。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#293747"/></marker>
  </defs>
  <rect width="960" height="540" fill="#FFF7ED"/>
  <path d="M0,455 Q185,410 355,455 T700,455 T1040,455 V540 H0 Z" fill="#3B78A8" opacity="0.07"/>

  <g data-question="207" data-layout="machine" data-presentation="machine" data-source="machine" data-icons="machine-plate-207"><text x="54" y="54" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="26" font-weight="760">门绕铰链轴转动；手把离轴越远，同样推力产生的转矩越大</text><rect x="34" y="82" width="892" height="382" rx="4" fill="#EFEAE1" stroke="none" stroke-width="0"/><rect x="34" y="360" width="892" height="104" rx="0" fill="#C99B70" stroke="none" stroke-width="0"/><path d="M34,360 L926,360" fill="none" stroke="#24384A" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><rect x="250" y="110" width="280" height="300" rx="4" fill="#896448" stroke="#24384A" stroke-width="5"/><path d="M250,125 L250,395" fill="none" stroke="#AAB7BD" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/><circle cx="480" cy="260" r="15" fill="#E6B441" stroke="#24384A" stroke-width="3"/><path d="M250,110 L650,190 L650,430 L250,410 Z" fill="none" stroke="#4B82B3" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M480,260 Q585,255 625,320" fill="none" stroke="#C95757" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M250,260 L480,260" fill="none" stroke="#2C8178" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M250,260 L608,99" fill="none" stroke="#24384A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="250" cy="260" r="4.5" fill="#24384A" stroke="none" stroke-width="0"/><text x="620" y="105" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">铰链确定转轴并承受门的重量</text><path d="M480,260 L608,274" fill="none" stroke="#24384A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="480" cy="260" r="4.5" fill="#24384A" stroke="none" stroke-width="0"/><text x="620" y="280" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">门把远离转轴，较省力</text><text x="420" y="495" fill="#24384A" text-anchor="middle" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="700">在靠近铰链处推门，需要更大的力才能得到同样转动效果</text></g>
  <rect x="12" y="12" width="936" height="516" rx="8" fill="none" stroke="#293747" stroke-width="3" opacity="0.18"/>
</svg>
