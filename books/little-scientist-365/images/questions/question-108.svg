<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">蜗牛为什么走过会亮亮的？</title>
  <desc id="desc">围绕“蜗牛为什么走过会亮亮的？”绘制的清晰主题图；具体对象优先，必要关系用箭头表示。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#3D2E35"/></marker>
  </defs>
  <rect width="960" height="540" fill="#FFF8ED"/>
  <path d="M0,455 Q185,410 355,455 T700,455 T1040,455 V540 H0 Z" fill="#E66A3D" opacity="0.07"/>
  <g opacity="0.16"><path d="M40,460 Q160,390 280,460 T520,460 T760,460 T1000,460" fill="none" stroke="#E66A3D" stroke-width="8.0" stroke-linecap="round" stroke-linejoin="round"/></g>
  <g data-question="108" data-layout="invertebrate" data-presentation="invertebrate" data-source="invertebrate" data-icons="snail-movement,muscular-foot,mucus,motion-wave"><text x="54" y="54" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="26" font-weight="760">蜗牛用肌肉波推地，并在黏液上滑行</text><path d="M209.75,308.25 Q319.0,262.25 485.75,296.75 Q531.75,311.7 503.0,334.7 H227.0 Z" fill="#78B9AC" stroke="#24384A" stroke-width="4.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="324.75" cy="233.5" r="89.69999999999999" fill="#D9693F" stroke="#24384A" stroke-width="5.75"/><path d="M324.75,233.5 q55.199999999999996,-51.74999999999999 63.24999999999999,11.5 q4.6,55.199999999999996 -46.0,48.3 q-39.099999999999994,-4.6 -29.9,-39.099999999999994" fill="none" stroke="#9B432F" stroke-width="5.75" stroke-linecap="round" stroke-linejoin="round"/><path d="M434.0,296.75 L445.5,222.0" fill="none" stroke="#24384A" stroke-width="3.4499999999999997" stroke-linecap="round" stroke-linejoin="round"/><circle cx="445.5" cy="217.4" r="5.75" fill="#24384A" stroke="none" stroke-width="0"/><path d="M470.8,296.75 L482.3,222.0" fill="none" stroke="#24384A" stroke-width="3.4499999999999997" stroke-linecap="round" stroke-linejoin="round"/><circle cx="482.3" cy="217.4" r="5.75" fill="#24384A" stroke="none" stroke-width="0"/><path d="M105,420 Q350,375 640,420" fill="none" stroke="#9ED8D5" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/><path d="M150,405 C205,365 260,445 315,405 S425,365 480,405 S590,445 645,405" fill="none" stroke="#287F78" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><circle cx="195" cy="432" r="7" fill="#CDEDEC" stroke="none" stroke-width="0"/><circle cx="275" cy="425" r="6" fill="#CDEDEC" stroke="none" stroke-width="0"/><circle cx="530" cy="432" r="8" fill="#CDEDEC" stroke="none" stroke-width="0"/><path d="M335,350 L698,124" fill="none" stroke="#24384A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="335" cy="350" r="4.5" fill="#24384A" stroke="none" stroke-width="0"/><text x="710" y="130" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">足底肌肉一段段收缩</text><path d="M430,410 L698,249" fill="none" stroke="#24384A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="430" cy="410" r="4.5" fill="#24384A" stroke="none" stroke-width="0"/><text x="710" y="255" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">收缩波沿足部向后传</text><path d="M260,424 L698,374" fill="none" stroke="#24384A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="260" cy="424" r="4.5" fill="#24384A" stroke="none" stroke-width="0"/><text x="710" y="372" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">黏液减少擦伤</text><text x="710" y="393" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">，也帮助传力</text><text x="365" y="492" fill="#24384A" text-anchor="middle" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="600">亮亮的痕迹是很薄的黏液层，不是蜗牛融化了</text></g>
  <rect x="12" y="12" width="936" height="516" rx="8" fill="none" stroke="#3D2E35" stroke-width="3" opacity="0.18"/>
</svg>
