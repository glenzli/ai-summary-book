<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">河水为什么往低处流？</title>
  <desc id="desc">围绕“河水为什么往低处流？”绘制的清晰主题图；具体对象优先，必要关系用箭头表示。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#173746"/></marker>
  </defs>
  <rect width="960" height="540" fill="#F0FDFA"/>
  <path d="M0,455 Q185,410 355,455 T700,455 T1040,455 V540 H0 Z" fill="#0F8A8A" opacity="0.07"/>

  <g data-question="053" data-layout="earth-weather" data-presentation="earth-weather" data-source="earth-weather" data-icons="earth-weather-plate-053"><text x="54" y="54" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="26" font-weight="760">重力沿着地形坡度拉动水，河道把分散流水汇集起来</text><rect x="34" y="82" width="892" height="382" rx="4" fill="#DCEEF4" stroke="none" stroke-width="0"/><path d="M34,350 Q175,285 325,350 T635,350 T945,350 V464 H34 Z" fill="#A6C982" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/><path d="M34,425 Q190,380 355,425 T690,425 T1030,425 V464 H34 Z" fill="#5A9258" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/><path d="M110,180 Q220,150 330,215 Q450,285 570,315 Q690,345 850,390" fill="none" stroke="#4B86B7" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/><path d="M220,185 Q300,210 350,250" fill="none" stroke="#295E88" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M470,285 Q555,325 620,335" fill="none" stroke="#295E88" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M680,350 Q760,380 820,390" fill="none" stroke="#295E88" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M140,425 L840,425" fill="none" stroke="#24384A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M140,425 L140,160" fill="none" stroke="#24384A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M330,220 L608,99" fill="none" stroke="#24384A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="330" cy="220" r="4.5" fill="#24384A" stroke="none" stroke-width="0"/><text x="620" y="105" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">水从势能较高处向较低处运动</text><text x="430" y="490" fill="#24384A" text-anchor="middle" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="660">河流会弯曲、侵蚀和堆积，但整体水面仍沿下游降低</text></g>
  <rect x="12" y="12" width="936" height="516" rx="8" fill="none" stroke="#173746" stroke-width="3" opacity="0.18"/>
</svg>
