  <g data-question="127" data-layout="vertebrate" data-presentation="vertebrate" data-source="vertebrate" data-icons="vertebrate-plate-127"><text x="54" y="54" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="26" font-weight="760">火烈鸟从藻类和小甲壳动物中得到红橙色色素</text><rect x="34" y="82" width="892" height="382" rx="4" fill="#DDEEF4" stroke="none" stroke-width="0"/><path d="M34,330 Q190,270 340,330 T650,330 T960,330 V464 H34 Z" fill="#A8CA83" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="430" cy="390" rx="300" ry="63" fill="#BDE4EA" stroke="#4C86B8" stroke-width="3"/><path d="M160,370 q18,-72 36,0 M680,378 q20,-88 42,0 M735,380 q15,-62 30,0" fill="none" stroke="#5C9659" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="294.5" cy="315" rx="60.68" ry="43.46" fill="#EA718C" stroke="#24384A" stroke-width="3.28"/><path d="M323.2,286.3 C384.7,237.10000000000002 392.9,167.4 352.72,159.20000000000002" fill="none" stroke="#EA718C" stroke-width="14.76" stroke-linecap="round" stroke-linejoin="round"/><circle cx="347.8" cy="157.56" r="16.4" fill="#EA718C" stroke="#24384A" stroke-width="2.46"/><path d="M356.0,160.84 q36.9,4.1 45.099999999999994,20.5 q-16.4,14.76 -41.0,3.28" fill="#F6E9CF" stroke="#24384A" stroke-width="2.46" stroke-linecap="round" stroke-linejoin="round"/><path d="M274.0,346.15999999999997 L272.36,462.6 L298.6,462.6 M315,349.44 L336.32,413.4 L368.3,413.4" fill="none" stroke="#D95678" stroke-width="5.739999999999999" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="670" cy="240" rx="80" ry="50" fill="#BDE4EA" stroke="#4C86B8" stroke-width="3"/><path d="M620,245 q25,-35 50,0 q25,35 50,0" fill="none" stroke="#D9693F" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/><circle cx="645" cy="205" r="8" fill="#5C9659" stroke="none" stroke-width="0"/><circle cx="680" cy="205" r="7" fill="#5C9659" stroke="none" stroke-width="0"/><circle cx="715" cy="215" r="9" fill="#5C9659" stroke="none" stroke-width="0"/><path d="M670,305 Q585,345 515,325" fill="none" stroke="#C95555" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M670,240 L662,114" fill="none" stroke="#24384A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="670" cy="240" r="4.5" fill="#24384A" stroke="none" stroke-width="0"/><text x="650" y="120" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">食物中的类胡萝卜素进入身体</text><path d="M330,260 L638,399" fill="none" stroke="#24384A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="330" cy="260" r="4.5" fill="#24384A" stroke="none" stroke-width="0"/><text x="650" y="405" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">色素沉积在新长出的羽毛里</text></g>
