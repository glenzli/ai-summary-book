  <g data-question="182" data-layout="machine" data-presentation="machine" data-source="machine" data-icons="machine-plate-182"><text x="54" y="54" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="26" font-weight="760">机器用结构改变力的大小、方向或运动方式，不一定需要电</text><rect x="34" y="82" width="892" height="382" rx="4" fill="#EFEAE1" stroke="none" stroke-width="0"/><rect x="34" y="360" width="892" height="104" rx="0" fill="#C99B70" stroke="none" stroke-width="0"/><path d="M34,360 L926,360" fill="none" stroke="#24384A" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M100,300 L270,220" fill="none" stroke="#4B82B3" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/><polygon points="180,300 220,245 255,300" fill="#DC713E" stroke="#24384A" stroke-width="3" stroke-linejoin="round"/><circle cx="430" cy="290" r="55" fill="#E9EEF0" stroke="#24384A" stroke-width="5"/><circle cx="430" cy="290" r="13" fill="#4B82B3" stroke="#24384A" stroke-width="3"/><path d="M430,290 L478.0,290.0" fill="none" stroke="#AAB7BD" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M430,290 L463.94112549695427,323.94112549695427" fill="none" stroke="#AAB7BD" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M430,290 L430.0,338.0" fill="none" stroke="#AAB7BD" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M430,290 L396.05887450304573,323.94112549695427" fill="none" stroke="#AAB7BD" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M430,290 L382.0,290.0" fill="none" stroke="#AAB7BD" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M430,290 L396.05887450304573,256.05887450304573" fill="none" stroke="#AAB7BD" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M430,290 L430.0,242.0" fill="none" stroke="#AAB7BD" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/