  <g data-question="089" data-layout="plant" data-presentation="plant" data-source="plant" data-icons="plant-plate-089"><text x="54" y="54" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="26" font-weight="760">胡萝卜把叶片制造的糖储存在膨大的主根里</text><rect x="34" y="82" width="892" height="190" rx="4" fill="#DDEFF3" stroke="none" stroke-width="0"/><rect x="34" y="272" width="892" height="192" rx="0" fill="#B8845D" stroke="none" stroke-width="0"/><path d="M34,272 Q165,245 300,272 T580,272 T860,272 T980,272" fill="none" stroke="#4F8A55" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><circle cx="115" cy="335" r="8" fill="#76523B" stroke="none" stroke-width="0"/><circle cx="175" cy="402" r="6" fill="#76523B" stroke="none" stroke-width="0"/><circle cx="820" cy="330" r="9" fill="#76523B" stroke="none" stroke-width="0"/><circle cx="745" cy="420" r="7" fill="#76523B" stroke="none" stroke-width="0"/><path d="M360,250 Q270,300 335,445 Q365,495 395,445 Q460,300 360,250 Z" fill="#D9703D" stroke="#24384A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M341.20614758428184,255 Q220,160 199.0,110" fill="none" stroke="#4F8A55" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/><path d="M348.52847127297906,255 Q290,160 279.5,110" fill="none" stroke="#4F8A55" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/><path d="M360.0,255 Q360,160 360.0,110" fill="none" stroke="#4F8A55" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/><path d="M371.47152872702094,255 Q430,160 440.5,110" fill="none" stroke="#4F8A55" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/><path d="M378.79385241571816,255 Q500,160 521.0,110" fill="none" stroke="#4F8A55" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/><rect x="650" y="145" width="210" height="205" rx="12" fill="#F7E9C9" stroke="#24384A" stroke-width="3"/><circle cx="755" cy="250" r="72" fill="#D9703D" stroke="#24384A" stroke-width="4"/><circle cx="755" cy="250" r="35" fill="#E6B542" stroke="#24384A" stroke-width="3"/><path d="M755,250 L632,404" fill="none" stroke="#24384A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="755" cy="250" r="4.5" fill="#24384A" stroke="none" stroke-width="0"/><text x="620" y="410" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">根横切面里，薄壁细</text><text x="620" y="432" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">胞储存糖和其他物质</text><path d="M360,340 L638,109" fill="none" stroke="#24384A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="360" cy="340" r="4.5" fill="#24384A" stroke="none" stroke-width="0"/><text x="650" y="115" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">膨大的主根同时仍吸</text><text x="650" y="137" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">水、运输并固定植物</text></g>
