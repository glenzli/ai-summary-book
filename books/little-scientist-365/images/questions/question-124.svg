<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">鸭子为什么不容易湿透？</title>
  <desc id="desc">围绕“鸭子为什么不容易湿透？”绘制的清晰主题图；具体对象优先，必要关系用箭头表示。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#24324A"/></marker>
  </defs>
  <rect width="960" height="540" fill="#FFF4F7"/>
  <path d="M0,455 Q185,410 355,455 T700,455 T1040,455 V540 H0 Z" fill="#2563A6" opacity="0.07"/>

  <g data-question="124" data-layout="vertebrate" data-presentation="vertebrate" data-source="vertebrate" data-icons="vertebrate-plate-124"><text x="54" y="54" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="26" font-weight="760">鸭子整理羽毛时把油脂涂开，重叠羽片挡住水</text><rect x="34" y="82" width="892" height="382" rx="4" fill="#DDEEF4" stroke="none" stroke-width="0"/><path d="M34,330 Q190,270 340,330 T650,330 T960,330 V464 H34 Z" fill="#A8CA83" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="430" cy="390" rx="300" ry="63" fill="#BDE4EA" stroke="#4C86B8" stroke-width="3"/><path d="M160,370 q18,-72 36,0 M680,378 q20,-88 42,0 M735,380 q15,-62 30,0" fill="none" stroke="#5C9659" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="365" cy="310" rx="99.75" ry="60.8" fill="#7D8B55" stroke="#24384A" stroke-width="3.8"/><circle cx="444.8" cy="264.4" r="39.9" fill="#7D8B55" stroke="#24384A" stroke-width="3.8"/><polygon points="477.1,260.6 526.5,276.75 478.05,291.0" fill="#E6B542" stroke="#24384A" stroke-width="2.8499999999999996" stroke-linejoin="round"/><polygon points="274.75,300.5 208.25,257.75 230.1,333.75" fill="#C95555" stroke="#24384A" stroke-width="2.8499999999999996" stroke-linejoin="round"/><path d="M306.1,302.4 Q365,224.5 410.6,308.1 Q365,346.1 306.1,302.4 Z" fill="#F6E9CF" stroke="#24384A" stroke-width="2.8499999999999996" stroke-linecap="round" stroke-linejoin="round"/><circle cx="452.4" cy="257.75" r="4.75" fill="#24384A" stroke="none" stroke-width="0"/><circle cx="560" cy="300" r="18" fill="#4C86B8" stroke="#FFFFFF" stroke-width="3"/><circle cx="600" cy="270" r="13" fill="#4C86B8" stroke="#FFFFFF" stroke-width="3"/><rect x="650" y="140" width="215" height="205" rx="12" fill="#F6E9CF" stroke="#24384A" stroke-width="3"/><path d="M675,285 Q720,160 760,285 Q800,160 840,285" fill="none" stroke="#8B6549" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/><circle cx="720" cy="225" r="17" fill="#4C86B8" stroke="#FFFFFF" stroke-width="3"/><circle cx="795" cy="215" r="14" fill="#4C86B8" stroke="#FFFFFF" stroke-width="3"/><path d="M752,225 L652,399" fill="none" stroke="#24384A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="752" cy="225" r="4.5" fill="#24384A" stroke="none" stroke-width="0"/><text x="640" y="405" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">水珠停在羽片外，</text><text x="640" y="427" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">不容易进入绒羽层</text><text x="390" y="490" fill="#24384A" text-anchor="middle" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="650">羽毛不是完全不湿；外层结构与油脂共同减慢进水</text></g>
  <rect x="12" y="12" width="936" height="516" rx="8" fill="none" stroke="#24324A" stroke-width="3" opacity="0.18"/>
