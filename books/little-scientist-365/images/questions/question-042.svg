<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">冰雹为什么是小冰球？</title>
  <desc id="desc">围绕“冰雹为什么是小冰球？”绘制的清晰主题图；具体对象优先，必要关系用箭头表示。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#173746"/></marker>
  </defs>
  <rect width="960" height="540" fill="#F0FDFA"/>
  <path d="M0,455 Q185,410 355,455 T700,455 T1040,455 V540 H0 Z" fill="#0F8A8A" opacity="0.07"/>

  <g data-question="042" data-layout="earth-weather" data-presentation="earth-weather" data-source="earth-weather" data-icons="earth-weather-plate-042"><text x="54" y="54" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="26" font-weight="760">强上升气流让冰粒在雷暴云中反复碰到过冷水滴，长出多层冰</text><rect x="34" y="82" width="892" height="382" rx="4" fill="#DCEEF4" stroke="none" stroke-width="0"/><path d="M34,350 Q175,285 325,350 T635,350 T945,350 V464 H34 Z" fill="#A6C982" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/><path d="M34,425 Q190,380 355,425 T690,425 T1030,425 V464 H34 Z" fill="#5A9258" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/><circle cx="312.0" cy="199.4" r="54.0" fill="#75838C" stroke="#24384A" stroke-width="3.5999999999999996"/><circle cx="372.0" cy="155.0" r="74.39999999999999" fill="#75838C" stroke="#24384A" stroke-width="3.5999999999999996"/><circle cx="450.0" cy="179.0" r="62.4" fill="#75838C" stroke="#24384A" stroke-width="3.5999999999999996"/><rect x="260.4" y="194.6" width="246.0" height="74.39999999999999" rx="33.6" fill="#75838C" stroke="#24384A" stroke-width="3.5999999999999996"/><path d="M360,350 Q250,250 350,170" fill="none" stroke="#2D8178" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M450,170 Q560,250 465,360" fill="none" stroke="#4B86B7" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><circle cx="405" cy="245" r="26" fill="#FFFFFF" stroke="#4B86B7" stroke-width="4"/><rect x="650" y="135" width="220" height="225" rx="12" fill="#F7E9CA" stroke="#24384A" stroke-width="3"/><circle cx="760" cy="250" r="82" fill="#FFFFFF" stroke="#24384A" stroke-width="4"/><circle cx="760" cy="250" r="20" fill="none" stroke="#4B86B7" stroke-width="8"/><circle cx="760" cy="250" r="38" fill="none" stroke="#F7E9CA" stroke-width="8"/><circle cx="760" cy="250" r="56" fill="none" stroke="#4B86B7" stroke-width="8"/><circle cx="760" cy="250" r="75" fill="none" stroke="#F7E9CA" stroke-width="8"/><path d="M410,245 L608,99" fill="none" stroke="#24384A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="410" cy="245" r="4.5" fill="#24384A" stroke="none" stroke-width="0"/><text x="620" y="105" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">冰胚被上升气流托回高处</text><path d="M760,250 L632,399" fill="none" stroke="#24384A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="760" cy="250" r="4.5" fill="#24384A" stroke="none" stroke-width="0"/><text x="620" y="405" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">透明和浑浊冰层记录冻结方式不同</text><text x="410" y="490" fill="#24384A" text-anchor="middle" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="660">长到气流托不住时才落下；并非所有雷雨都会下冰雹</text></g>
  <rect x="12" y="12" width="936" height="516" rx="8" fill="none" stroke="#173746" stroke-width="3" opacity="0.18"/>
</svg>
