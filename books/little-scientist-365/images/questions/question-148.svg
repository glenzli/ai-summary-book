  <g data-question="148" data-layout="vertebrate" data-presentation="vertebrate" data-source="vertebrate" data-icons="vertebrate-plate-148"><text x="54" y="54" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="26" font-weight="760">鲨鱼骨架主要由软骨组成，较轻且有韧性</text><rect x="34" y="82" width="892" height="382" rx="4" fill="#BDE4EA" stroke="none" stroke-width="0"/><path d="M34,420 Q190,375 350,420 T680,420 T1000,420 V464 H34 Z" fill="#D4C28A" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/><path d="M95,425 q18,-85 36,0 M770,425 q20,-95 40,0 M830,425 q17,-70 34,0" fill="none" stroke="#2D8079" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><circle cx="120" cy="160" r="7" fill="none" stroke="#FFFFFF" stroke-width="2"/><circle cx="150" cy="125" r="4" fill="none" stroke="#FFFFFF" stroke-width="2"/><circle cx="810" cy="175" r="7" fill="none" stroke="#FFFFFF" stroke-width="2"/><circle cx="845" cy="135" r="4" fill="none" stroke="#FFFFFF" stroke-width="2"/><circle cx="750" cy="240" r="5" fill="none" stroke="#FFFFFF" stroke-width="2"/><path d="M229.7,285 C284.3,221.04 389.6,228.84 445.76,285 C383.36,341.16 281.96,345.84000000000003 229.7,285 Z" fill="#657D8B" stroke="#24384A" stroke-width="3.12" stroke-linecap="round" stroke-linejoin="round"/><polygon points="232.04,285 175.1,224.16 182.9,344.28" fill="#657D8B" stroke="#24384A" stroke-width="2.34" stroke-linejoin="round"/><polygon points="320.96,234.3 350.6,183.6 374.0,242.88" fill="#657D8B" stroke="#24384A" stroke-width="2.34" stroke-linejoin="round"/><polygon points="338.9,320.1 383.36,366.9 395.84000000000003,314.64" fill="#657D8B" stroke="#24384A" stroke-width="2.34" stroke-linejoin="round"/><circle cx="406.76" cy="271.74" r="4.68" fill="#24384A" stroke="none" stroke-width="0"/><path d="M372.44,291.24 L367.76,318.54" fill="none" stroke="#F6E9CF" stroke-width="2.34" stroke-linecap="round" stroke-linejoin="round"/><path d="M381.02,291.24 L376.34000000000003,318.54" fill="none" stroke="#F6E9CF" stroke-width="2.34" stroke-linecap="round" stroke-linejoin="round"/><path d="M389.6,291.24 L384.92,318.54" fill="none" stroke="#F6E9CF" stroke-width="2.34" stroke-linecap="round" stroke-linejoin="round"/><path d="M398.18,291.24 L393.5,318.54" fill="none" stroke="#F6E9CF" stroke-width="2.34" stroke-linecap="round" stroke-linejoin="round"/><path d="M406.76,291.24 L402.08,318.54" fill="none" stroke="#F6E9CF" stroke-width="2.34" stroke-linecap="round" stroke-linejoin="round"/><rect x="625" y="120" width="245" height="260" rx="12" fill="#F6E9CF" stroke="#24384A" stroke-width="3"/><path d="M665,250 Q730,150 820,215 Q760,320 665,250" fill="none" stroke="#2D8079" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/><circle cx="710" cy="235" r="10" fill="#D4E6D8" stroke="#24384A" stroke-width="2"/><circle cx="755" cy="205" r="10" fill="#D4E6D8" stroke="#24384A" stroke-width="2"/><circle cx="780" cy="260" r="10" fill="#D4E6D8" stroke="#24384A" stroke-width="2"/><path d="M700,230 L637,414" fill="none" stroke="#24384A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="700" cy="230" r="4.5" fill="#24384A" stroke="none" stroke-width="0"/><text x="625" y="420" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">软骨有细胞和基质，但</text><text x="625" y="442" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">矿化程度通常低于硬骨</text><text x="750" y="150" fill="#24384A" text-anchor="middle" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">软骨组织放大</text></g>
