  <g data-question="174" data-layout="textbook" data-presentation="textbook" data-source="textbook" data-icons="tooth-replacement,baby-tooth,adult-tooth,jaw"><text x="54" y="54" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="26" font-weight="760">恒牙在乳牙下面生长并逐渐替换</text><path d="M130,190 Q330,110 560,190 L560,430 Q340,500 130,430 Z" fill="#EBAF9F" stroke="#24384A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M185,170 Q215,118 245,170 L238,275 Q215,305 192,275 Z" fill="#F8F3E8" stroke="#24384A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M330,165 Q365,105 400,165 L392,280 Q365,313 338,280 Z" fill="#F8F3E8" stroke="#24384A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M190,350 Q220,285 250,350 L245,435 Q220,458 195,435 Z" fill="#F3E5CB" stroke="#24384A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M325,355 Q370,275 415,355 L405,448 Q370,470 335,448 Z" fill="#F3E5CB" stroke="#24384A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M220,330 L220,285" fill="none" stroke="#C9A96E" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M370,335 L370,288" fill="none" stroke="#C9A96E" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M216,165 L666,123" fill="none" stroke="#24384A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="216" cy="165" r="5" fill="#24384A" stroke="none" stroke-width="0"/><text x="680" y="130" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="650">乳牙</text><path d="M220,365 L666,238" fill="none" stroke="#24384A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="220" cy="365" r="5" fill="#24384A" stroke="none" stroke-width="0"/><text x="680" y="245" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="650">下面的恒牙逐渐长大</text><path d="M220,285 L666,348" fill="none" stroke="#24384A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="220" cy="285" r="5" fill="#24384A" stroke="none" stroke-width="0"/><text x="680" y="355" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="650">乳牙根逐渐被吸收</text><path d="M370,435 L666,438" fill="none" stroke="#24384A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="370" cy="435" r="5" fill="#24384A" stroke="none" stroke-width="0"/><text x="680" y="445" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="650">恒牙最后进入牙列</text></g>
