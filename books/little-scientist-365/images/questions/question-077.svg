<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">树皮有什么用？</title>
  <desc id="desc">围绕“树皮有什么用？”绘制的清晰主题图；具体对象优先，必要关系用箭头表示。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#203D2D"/></marker>
  </defs>
  <rect width="960" height="540" fill="#F5FBEF"/>
  <path d="M0,455 Q185,410 355,455 T700,455 T1040,455 V540 H0 Z" fill="#3B8C5A" opacity="0.07"/>

  <g data-question="077" data-layout="plant" data-presentation="plant" data-source="plant" data-icons="plant-plate-077"><text x="54" y="54" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="26" font-weight="760">树皮不是一层壳：外层防护，内侧韧皮部运输糖</text><rect x="34" y="82" width="892" height="382" rx="4" fill="#DDEFF3" stroke="none" stroke-width="0"/><path d="M34,330 Q170,280 315,330 T610,330 T920,330 V464 H34 Z" fill="#A7C97E" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/><rect x="34" y="360" width="892" height="104" rx="0" fill="#B8845D" stroke="none" stroke-width="0"/><path d="M34,360 Q175,328 320,360 T610,360 T930,360" fill="none" stroke="#4F8A55" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><rect x="170" y="120" width="340" height="300" rx="70" fill="#8D6546" stroke="#24384A" stroke-width="4"/><rect x="220" y="120" width="240" height="300" rx="45" fill="#C99664" stroke="#24384A" stroke-width="3"/><rect x="275" y="120" width="130" height="300" rx="30" fill="#F7E9C9" stroke="#24384A" stroke-width="3"/><path d="M275,140 L275,400" fill="none" stroke="#D9703D" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><path d="M185,260 L638,124" fill="none" stroke="#24384A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="185" cy="260" r="4.5" fill="#24384A" stroke="none" stroke-width="0"/><text x="650" y="130" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">外树皮减慢失水并抵挡机械伤害</text><path d="M250,260 L638,264" fill="none" stroke="#24384A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="250" cy="260" r="4.5" fill="#24384A" stroke="none" stroke-width="0"/><text x="650" y="270" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">内树皮中的韧皮部</text><text x="650" y="292" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">运输叶片制造的糖</text><path d="M330,260 L638,399" fill="none" stroke="#24384A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="330" cy="260" r="4.5" fill="#24384A" stroke="none" stroke-width="0"/><text x="650" y="405" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">树干增粗时，新树皮在里</text><text x="650" y="427" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">面形成，外层会裂开脱落</text></g>
  <rect x="12" y="12" width="936" height="516" rx="8" fill="none" stroke="#203D2D" stroke-width="3" opacity="0.18"/>
</svg>
