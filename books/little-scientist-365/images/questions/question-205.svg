<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">拉链为什么一拉就合上？</title>
  <desc id="desc">围绕“拉链为什么一拉就合上？”绘制的清晰主题图；具体对象优先，必要关系用箭头表示。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#293747"/></marker>
  </defs>
  <rect width="960" height="540" fill="#FFF7ED"/>
  <path d="M0,455 Q185,410 355,455 T700,455 T1040,455 V540 H0 Z" fill="#3B78A8" opacity="0.07"/>

  <g data-question="205" data-layout="machine" data-presentation="machine" data-source="machine" data-icons="machine-plate-205"><text x="54" y="54" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="26" font-weight="760">拉链头把两排互相错开的链牙导入狭窄通道并扣合</text><rect x="34" y="82" width="892" height="382" rx="4" fill="#EFEAE1" stroke="none" stroke-width="0"/><rect x="34" y="360" width="892" height="104" rx="0" fill="#C99B70" stroke="none" stroke-width="0"/><path d="M34,360 L926,360" fill="none" stroke="#24384A" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><rect x="240" y="130" width="80" height="25" rx="5" fill="#C95757" stroke="#24384A" stroke-width="2"/><rect x="500" y="148" width="80" height="25" rx="5" fill="#4B82B3" stroke="#24384A" stroke-width="2"/><rect x="240" y="168" width="80" height="25" rx="5" fill="#C95757" stroke="#24384A" stroke-width="2"/><rect x="500" y="186" width="80" height="25" rx="5" fill="#4B82B3" stroke="#24384A" stroke-width="2"/><rect x="240" y="206" width="80" height="25" rx="5" fill="#C95757" stroke="#24384A" stroke-width="2"/><rect x="500" y="224" width="80" height="25" rx="5" fill="#4B82B3" stroke="#24384A" stroke-width="2"/><rect x="240" y="244" width="80" height="25" rx="5" fill="#C95757" stroke="#24384A" stroke-width="2"/><rect x="500" y="262" width="80" height="25" rx="5" fill="#4B82B3" stroke="#24384A" stroke-width="2"/><rect x="240" y="282" width="80" height="25" rx="5" fill="#C95757" stroke="#24384A" stroke-width="2"/><rect x="500" y="300" width="80" height="25" rx="5" fill="#4B82B3" stroke="#24384A" stroke-width="2"/><rect x="240" y="320" width="80" height="25" rx="5" fill="#C95757" stroke="#24384A" stroke-width="2"/><rect x="500" y="338" width="80" height="25" rx="5" fill="#4B82B3" stroke="#24384A" stroke-width="2"/><rect x="240" y="358" width="80" height="25" rx="5" fill="#C95757" stroke="#24384A" stroke-width="2"/><rect x="500" y="376" width="80" height="25" rx="5" fill="#4B82B3" stroke="#24384A" stroke-width="2"/><rect x="240" y="396" width="80" height="25" rx="5" fill="#C95757" stroke="#24384A" stroke-width="2"/><rect x="500" y="414" width="80" height="25" rx="5" fill="#4B82B3" stroke="#24384A" stroke-width="2"/><path d="M320,150 Q420,220 500,165 L500,420 Q420,360 320,405 Z" fill="#F7E9CA" stroke="#24384A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><rect x="380" y="235" width="65" height="100" rx="12" fill="#AAB7BD" stroke="#24384A" stroke-width="4"/><path d="M412,190 L412,235" fill="none" stroke="#2C8178" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M410,285 L608,99" fill="none" stroke="#24384A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="410" cy="285" r="4.5" fill="#24384A" stroke="none" stroke-width="0"/><text x="620" y="105" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">滑块内部的 Y 形通</text><text x="620" y="127" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">道改变两排链牙间距</text><path d="M500,330 L608,304" fill="none" stroke="#24384A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="500" cy="330" r="4.5" fill="#24384A" stroke="none" stroke-width="0"/><text x="620" y="310" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">链牙凸起进入相邻凹槽</text><text x="620" y="332" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">，互相限制侧向移动</text><text x="430" y="495" fill="#24384A" text-anchor="middle" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="660">反向拉动时通道把链牙分开；不是滑块把布粘住</text></g>
  <rect x="12" y="12" width="936" height="516" rx="8" fill="none" stroke="#293747" stroke-width="3" opacity="0.18"/>
</svg>
