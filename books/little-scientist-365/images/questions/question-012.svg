<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">月亮为什么有时圆有时弯？</title>
  <desc id="desc">围绕“月亮为什么有时圆有时弯？”绘制的清晰主题图；具体对象优先，必要关系用箭头表示。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#17213A"/></marker>
  </defs>
  <rect width="960" height="540" fill="#F4F9FF"/>
  <path d="M0,455 Q185,410 355,455 T700,455 T1040,455 V540 H0 Z" fill="#2563EB" opacity="0.07"/>

  <g data-question="012" data-layout="earth-weather" data-presentation="earth-weather" data-source="earth-weather" data-icons="earth-weather-plate-012"><text x="54" y="54" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="26" font-weight="760">月相来自我们看见的受光半球比例变化，不是月亮真的变形</text><rect x="34" y="82" width="892" height="382" rx="4" fill="#273552" stroke="none" stroke-width="0"/><circle cx="150" cy="260" r="62" fill="#F7E9CA" stroke="#24384A" stroke-width="3"/><ellipse cx="79.32000000000001" cy="260" rx="57.04" ry="62" fill="#273552" stroke="none" stroke-width="0"/><circle cx="134.5" cy="247.6" r="7.4399999999999995" fill="#D5C8AD" stroke="none" stroke-width="0"/><circle cx="163.64" cy="271.16" r="5.58" fill="#D5C8AD" stroke="none" stroke-width="0"/><circle cx="370" cy="260" r="62" fill="#F7E9CA" stroke="#24384A" stroke-width="3"/><ellipse cx="329.08" cy="260" rx="57.04" ry="62" fill="#273552" stroke="none" stroke-width="0"/><circle cx="354.5" cy="247.6" r="7.4399999999999995" fill="#D5C8AD" stroke="none" stroke-width="0"/><circle cx="383.64" cy="271.16" r="5.58" fill="#D5C8AD" stroke="none" stroke-width="0"/><circle cx="590" cy="260" r="62" fill="#F7E9CA" stroke="#24384A" stroke-width="3"/><circle cx="574.5" cy="247.6" r="7.4399999999999995" fill="#D5C8AD" stroke="none" stroke-width="0"/><circle cx="603.64" cy="271.16" r="5.58" fill="#D5C8AD" stroke="none" stroke-width="0"/><circle cx="810" cy="260" r="62" fill="#F7E9CA" stroke="#24384A" stroke-width="3"/><ellipse cx="769.08" cy="260" rx="57.04" ry="62" fill="#273552" stroke="none" stroke-width="0"/><circle cx="794.5" cy="247.6" r="7.4399999999999995" fill="#D5C8AD" stroke="none" stroke-width="0"/><circle cx="823.64" cy="271.16" r="5.58" fill="#D5C8AD" stroke="none" stroke-width="0"/><text x="150" y="390" fill="#FFFFFF" text-anchor="middle" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">新月附近</text><text x="370" y="390" fill="#FFFFFF" text-anchor="middle" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">上弦附近</text><text x="590" y="390" fill="#FFFFFF" text-anchor="middle" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">满月附近</text><text x="810" y="390" fill="#FFFFFF" text-anchor="middle" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">下弦附近</text><text x="480" y="480" fill="#FFFFFF" text-anchor="middle" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="700">完整月球始终存在，改变的是太阳、地球和月球的相对位置</text></g>
  <rect x="12" y="12" width="936" height="516" rx="8" fill="none" stroke="#17213A" stroke-width="3" opacity="0.18"/>
