  <g data-question="117" data-layout="vertebrate" data-presentation="vertebrate" data-source="vertebrate" data-icons="vertebrate-plate-117"><text x="54" y="54" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="26" font-weight="760">粗壮后肢先折叠储能，再快速伸直推地</text><rect x="34" y="82" width="892" height="382" rx="4" fill="#DDEEF4" stroke="none" stroke-width="0"/><path d="M34,350 Q180,285 335,350 T650,350 T960,350 V464 H34 Z" fill="#A8CA83" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/><path d="M34,425 Q190,382 360,425 T700,425 T1040,425 V464 H34 Z" fill="#5C9659" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="430" cy="285" rx="78.0" ry="58.0" fill="#5C9659" stroke="#24384A" stroke-width="4.0"/><circle cx="385.0" cy="239.0" r="25.0" fill="#5C9659" stroke="#24384A" stroke-width="4.0"/><circle cx="475.0" cy="239.0" r="25.0" fill="#5C9659" stroke="#24384A" stroke-width="4.0"/><circle cx="384.0" cy="235.0" r="8.0" fill="#24384A" stroke="none" stroke-width="0"/><circle cx="476.0" cy="235.0" r="8.0" fill="#24384A" stroke="none" stroke-width="0"/><path d="M396.0,309.0 Q430,330.0 464.0,309.0" fill="none" stroke="#F6E9CF" stroke-width="5.0" stroke-linecap="round" stroke-linejoin="round"/><path d="M385.0,313.0 L295.0,361.0 L255.0,333.0" fill="none" stroke="#24384A" stroke-width="15.0" stroke-linecap="round" stroke-linejoin="round"/><path d="M475.0,313.0 L565.0,361.0 L608.0,333.0" fill="none" stroke="#24384A" stroke-width="15.0" stroke-linecap="round" stroke-linejoin="round"/><path d="M255.0,333.0 L215.0,325.0" fill="none" stroke="#5C9659" stroke-width="9.0" stroke-linecap="round" stroke-linejoin="round"/><path d="M608.0,333.0 L648.0,325.0" fill="none" stroke="#5C9659" stroke-width="9.0" stroke-linecap="round" stroke-linejoin="round"/><path d="M250,390 Q190,315 230,235" fill="none" stroke="#C95555" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M320,335 L663,149" fill="none" stroke="#24384A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="320" cy="335" r="4.5" fill="#24384A" stroke="none" stroke-width="0"/><text x="675" y="155" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">长后腿提供更长的推地距离</text><path d="M247,347 L663,254" fill="none" stroke="#24384A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="247" cy="347" r="4.5" fill="#24384A" stroke="none" stroke-width="0"/><text x="675" y="260" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">脚掌向后推地，身</text><text x="675" y="282" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">体受到向前上方的力</text><path d="M438,235 L663,379" fill="none" stroke="#24384A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="438" cy="235" r="4.5" fill="#24384A" stroke="none" stroke-width="0"/><text x="675" y="385" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">落地时前肢帮助缓冲</text></g>
