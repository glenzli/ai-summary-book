<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">一个星期为什么有七天？</title>
  <desc id="desc">围绕“一个星期为什么有七天？”绘制的清晰主题图；具体对象优先，必要关系用箭头表示。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#17213A"/></marker>
  </defs>
  <rect width="960" height="540" fill="#F4F9FF"/>
  <path d="M0,455 Q185,410 355,455 T700,455 T1040,455 V540 H0 Z" fill="#2563EB" opacity="0.07"/>

  <g data-question="028" data-layout="earth-weather" data-presentation="earth-weather" data-source="earth-weather" data-icons="earth-weather-plate-028"><text x="54" y="54" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="26" font-weight="760">七天一周是长期形成的历法约定，不是自然界唯一的周期</text><rect x="34" y="82" width="892" height="382" rx="4" fill="#EEE9DF" stroke="none" stroke-width="0"/><rect x="95" y="180" width="92" height="120" rx="8" fill="#FFFFFF" stroke="#24384A" stroke-width="3"/><circle cx="141" cy="240" r="26" fill="#C85555" stroke="#24384A" stroke-width="2"/><text x="141" y="345" fill="#24384A" text-anchor="middle" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="24" font-weight="750">1</text><rect x="215" y="180" width="92" height="120" rx="8" fill="#FFFFFF" stroke="#24384A" stroke-width="3"/><circle cx="261" cy="240" r="26" fill="#DE753E" stroke="#24384A" stroke-width="2"/><text x="261" y="345" fill="#24384A" text-anchor="middle" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="24" font-weight="750">2</text><rect x="335" y="180" width="92" height="120" rx="8" fill="#FFFFFF" stroke="#24384A" stroke-width="3"/><circle cx="381" cy="240" r="26" fill="#E8B642" stroke="#24384A" stroke-width="2"/><text x="381" y="345" fill="#24384A" text-anchor="middle" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="24" font-weight="750">3</text><rect x="455" y="180" width="92" height="120" rx="8" fill="#FFFFFF" stroke="#24384A" stroke-width="3"/><circle cx="501" cy="240" r="26" fill="#5A9258" stroke="#24384A" stroke-width="2"/><text x="501" y="345" fill="#24384A" text-anchor="middle" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="24" font-weight="750">4</text><rect x="575" y="180" width="92" height="120" rx="8" fill="#FFFFFF" stroke="#24384A" stroke-width="3"/><circle cx="621" cy="240" r="26" fill="#2D8178" stroke="#24384A" stroke-width="2"/><text x="621" y="345" fill="#24384A" text-anchor="middle" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="24" font-weight="750">5</text><rect x="695" y="180" width="92" height="120" rx="8" fill="#FFFFFF" stroke="#24384A" stroke-width="3"/><circle cx="741" cy="240" r="26" fill="#4B86B7" stroke="#24384A" stroke-width="2"/><text x="741" y="345" fill="#24384A" text-anchor="middle" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="24" font-weight="750">6</text><rect x="815" y="180" width="92" height="120" rx="8" fill="#FFFFFF" stroke="#24384A" stroke-width="3"/><circle cx="861" cy="240" r="26" fill="#7667A5" stroke="#24384A" stroke-width="2"/><text x="861" y="345" fill="#24384A" text-anchor="middle" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="24" font-weight="750">7</text><path d="M110,390 H845" fill="none" stroke="#2D8178" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="480" y="465" fill="#24384A" text-anchor="middle" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="680">不同文化曾用过不同周长；七日制后来广泛沿用</text></g>
  <rect x="12" y="12" width="936" height="516" rx="8" fill="none" stroke="#17213A" stroke-width="3" opacity="0.18"/>
</svg>
