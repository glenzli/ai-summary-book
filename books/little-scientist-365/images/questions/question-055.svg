<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">水龙头里的水从哪里来？</title>
  <desc id="desc">围绕“水龙头里的水从哪里来？”绘制的清晰主题图；具体对象优先，必要关系用箭头表示。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#173746"/></marker>
  </defs>
  <rect width="960" height="540" fill="#F0FDFA"/>
  <path d="M0,455 Q185,410 355,455 T700,455 T1040,455 V540 H0 Z" fill="#0F8A8A" opacity="0.07"/>

  <g data-question="055" data-layout="earth-weather" data-presentation="earth-weather" data-source="earth-weather" data-icons="earth-weather-plate-055"><text x="54" y="54" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="26" font-weight="760">自来水通常经历取水、处理、储存和管网输送</text><rect x="34" y="82" width="892" height="382" rx="4" fill="#DCEEF4" stroke="none" stroke-width="0"/><path d="M34,300 Q180,265 325,300 T620,300 T930,300 V464 H34 Z" fill="#A9D9E2" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/><path d="M34,330 Q170,295 320,330 T620,330 T940,330" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="150" cy="340" rx="90" ry="35" fill="#A9D9E2" stroke="#4B86B7" stroke-width="3"/><rect x="300" y="255" width="130" height="145" rx="5" fill="#AAB7BC" stroke="#24384A" stroke-width="4"/><rect x="505" y="200" width="115" height="205" rx="8" fill="#D6E7EA" stroke="#24384A" stroke-width="4"/><rect x="746.0" y="312.5" width="88.0" height="68.75" rx="2.2" fill="#F7E9CA" stroke="#24384A" stroke-width="2.2"/><polygon points="735.0,312.5 790,265.75 845.0,312.5" fill="#C85555" stroke="#24384A" stroke-width="2.2" stroke-linejoin="round"/><rect x="777.9" y="342.75" width="24.200000000000003" height="38.5" rx="1.6500000000000001" fill="#8A654A" stroke="#24384A" stroke-width="1.6500000000000001"/><path d="M235,340 L285,330" fill="none" stroke="#4B86B7" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M435,325 L490,300" fill="none" stroke="#4B86B7" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M625,310 L700,330" fill="none" stroke="#4B86B7" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="150" y="420" fill="#24384A" text-anchor="middle" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">河湖或地下水</text><text x="365" y="445" fill="#24384A" text-anchor="middle" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="650">混凝、沉淀、过滤、消毒</text><text x="560" y="445" fill="#24384A" text-anchor="middle" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">清水池或水塔</text><text x="790" y="445" fill="#24384A" text-anchor="middle" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">管道送到家</text><text x="480" y="495" fill="#24384A" text-anchor="middle" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="650">不同城市流程会不同；饮用水仍需持续检测</text></g>
  <rect x="12" y="12" width="936" height="516" rx="8" fill="none" stroke="#173746" stroke-width="3" opacity="0.18"/>
</svg>
