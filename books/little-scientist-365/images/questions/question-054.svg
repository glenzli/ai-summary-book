<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">地下也有水吗？</title>
  <desc id="desc">围绕“地下也有水吗？”绘制的清晰主题图；具体对象优先，必要关系用箭头表示。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#173746"/></marker>
  </defs>
  <rect width="960" height="540" fill="#F0FDFA"/>
  <path d="M0,455 Q185,410 355,455 T700,455 T1040,455 V540 H0 Z" fill="#0F8A8A" opacity="0.07"/>

  <g data-question="054" data-layout="earth-weather" data-presentation="earth-weather" data-source="earth-weather" data-icons="earth-weather-plate-054"><text x="54" y="54" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="26" font-weight="760">雨水会渗入土壤和岩石缝隙，在不透水层上方形成地下水</text><rect x="34" y="82" width="892" height="170" rx="4" fill="#DCEEF4" stroke="none" stroke-width="0"/><rect x="34" y="252" width="892" height="100" rx="0" fill="#B88762" stroke="none" stroke-width="0"/><rect x="34" y="352" width="892" height="112" rx="0" fill="#9B8675" stroke="none" stroke-width="0"/><path d="M34,335 Q180,305 330,335 T640,335 T950,335" fill="#A9D9E2" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round" opacity="0.65"/><path d="M34,420 Q190,380 350,420 T690,420 T1030,420" fill="none" stroke="#273552" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/><path d="M220,170 L240,315" fill="none" stroke="#4B86B7" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M320,170 L340,315" fill="none" stroke="#4B86B7" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M420,170 L440,315" fill="none" stroke="#4B86B7" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="700" y="155" width="45" height="245" rx="4" fill="none" stroke="#24384A" stroke-width="4"/><path d="M722,330 L722,190" fill="none" stroke="#4B86B7" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/><path d="M360,325 L598,109" fill="none" stroke="#24384A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="360" cy="325" r="4.5" fill="#24384A" stroke="none" stroke-width="0"/><text x="610" y="115" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">孔隙和裂缝被水充</text><text x="610" y="137" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">满的区域叫饱和带</text><path d="M720,330 L622,269" fill="none" stroke="#24384A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="720" cy="330" r="4.5" fill="#24384A" stroke="none" stroke-width="0"/><text x="610" y="275" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">井进入含水层后可以取水</text><text x="420" y="495" fill="#24384A" text-anchor="middle" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="650">地下水也会缓慢流动，并从泉、河流或海岸排出</text></g>
  <rect x="12" y="12" width="936" height="516" rx="8" fill="none" stroke="#173746" stroke-width="3" opacity="0.18"/>
</svg>
