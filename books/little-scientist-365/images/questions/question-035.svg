<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">泡泡里面装着什么？</title>
  <desc id="desc">围绕“泡泡里面装着什么？”绘制的清晰主题图；具体对象优先，必要关系用箭头表示。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#173746"/></marker>
  </defs>
  <rect width="960" height="540" fill="#F0FDFA"/>
  <path d="M0,455 Q185,410 355,455 T700,455 T1040,455 V540 H0 Z" fill="#0F8A8A" opacity="0.07"/>

  <g data-question="035" data-layout="earth-weather" data-presentation="earth-weather" data-source="earth-weather" data-icons="earth-weather-plate-035"><text x="54" y="54" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="26" font-weight="760">泡泡是被肥皂水薄膜包住的一团气体</text><rect x="34" y="82" width="892" height="382" rx="4" fill="#E7F2F3" stroke="none" stroke-width="0"/><circle cx="340" cy="275" r="150" fill="#D9F1F3" stroke="#4B86B7" stroke-width="5"/><path d="M250,195 Q340,120 430,195" fill="none" stroke="#FFFFFF" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/><rect x="620" y="145" width="230" height="220" rx="12" fill="#F7E9CA" stroke="#24384A" stroke-width="3"/><path d="M650,205 L820,205" fill="none" stroke="#2D8178" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><path d="M650,295 L820,295" fill="none" stroke="#2D8178" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><rect x="650" y="213" width="170" height="74" rx="0" fill="#A9D9E2" stroke="none" stroke-width="0"/><circle cx="660" cy="205" r="8" fill="#C85555" stroke="none" stroke-width="0"/><path d="M660,213 L660,287" fill="none" stroke="#273552" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="660" cy="295" r="8" fill="#C85555" stroke="none" stroke-width="0"/><circle cx="690" cy="205" r="8" fill="#C85555" stroke="none" stroke-width="0"/><path d="M690,213 L690,287" fill="none" stroke="#273552" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="690" cy="295" r="8" fill="#C85555" stroke="none" stroke-width="0"/><circle cx="720" cy="205" r="8" fill="#C85555" stroke="none" stroke-width="0"/><path d="M720,213 L720,287" fill="none" stroke="#273552" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="720" cy="295" r="8" fill="#C85555" stroke="none" stroke-width="0"/><circle cx="750" cy="205" r="8" fill="#C85555" stroke="none" stroke-width="0"/><path d="M750,213 L750,287" fill="none" stroke="#273552" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="750" cy="295" r="8" fill="#C85555" stroke="none" stroke-width="0"/><circle cx="780" cy="205" r="8" fill="#C85555" stroke="none" stroke-width="0"/><path d="M780,213 L780,287" fill="none" stroke="#273552" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="780" cy="295" r="8" fill="#C85555" stroke="none" stroke-width="0"/><circle cx="810" cy="205" r="8" fill="#C85555" stroke="none" stroke-width="0"/><path d="M810,213 L810,287" fill="none" stroke="#273552" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="810" cy="295" r="8" fill="#C85555" stroke="none" stroke-width="0"/><path d="M340,275 L598,104" fill="none" stroke="#24384A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="340" cy="275" r="4.5" fill="#24384A" stroke="none" stroke-width="0"/><text x="610" y="110" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">里面主要是吹进去的空气</text><path d="M740,250 L622,404" fill="none" stroke="#24384A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="740" cy="250" r="4.5" fill="#24384A" stroke="none" stroke-width="0"/><text x="610" y="410" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">薄膜是水层夹在两层肥皂分子之间</text><text x="420" y="490" fill="#24384A" text-anchor="middle" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="650">彩色条纹来自不同厚度薄膜对光的干涉</text></g>
