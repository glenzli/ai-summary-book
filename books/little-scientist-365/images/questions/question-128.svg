gon points="693.55,316.34 717.2,345.15 725.8,318.06" fill="#2D618F" stroke="#24384A" stroke-width="1.29" stroke-linejoin="round"/><circle cx="736.55" cy="289.68" r="2.15" fill="#24384A" stroke="none" stroke-width="0"/><path d="M703.44,272.05 q-3.44,-24.94 -12.9,-40.85 M703.44,272.05 q7.74,-24.94 19.35,-39.56" fill="none" stroke="#FFFFFF" stroke-width="2.15" stroke-linecap="round" stroke-linejoin="round"/><path d="M195,300 L102,139" fill="none" stroke="#24384A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="195" cy="300" r="4.5" fill="#24384A" stroke="none" stroke-width="0"/><text x="90" y="145" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">身体至少在一生某阶段有毛</text><path d="M430,260 L377,109" fill="none" stroke="#24384A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="430" cy="260" r="4.5" fill="#24384A" stroke="none" stroke-width="0"/><text x="365" y="115" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">蝙蝠会飞，仍是哺乳动物</text><path d="M700,300 L677,124" fill="none" stroke="#24384A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="700" cy="300" r="4.5" fill="#24384A" stroke="none" stroke-width="0"/><text x="665" y="130" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">鲸住在海里，也用肺呼吸</text><text x="480" y="485" fill="#24384A" text-anchor="middle" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="21" font-weight="680">雌性有乳腺，幼仔喝乳汁；大多数种类还会生下幼仔</text></g>
