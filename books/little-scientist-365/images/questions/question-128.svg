  <g data-question="128" data-layout="vertebrate" data-presentation="vertebrate" data-source="vertebrate" data-icons="vertebrate-plate-128"><text x="54" y="54" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="26" font-weight="760">哺乳动物共同特征不是外形，而是毛和乳汁等身体结构</text><rect x="34" y="82" width="892" height="382" rx="4" fill="#DDEEF4" stroke="none" stroke-width="0"/><path d="M34,350 Q180,285 335,350 T650,350 T960,350 V464 H34 Z" fill="#A8CA83" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/><path d="M34,425 Q190,382 360,425 T700,425 T1040,425 V464 H34 Z" fill="#5C9659" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="190" cy="320" rx="50.4" ry="26.04" fill="#D38A4A" stroke="#24384A" stroke-width="1.68"/><path d="M220.24,309.5 Q225.7,306.14 234.1,297.74" fill="none" stroke="#D38A4A" stroke-width="11.76" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="241.66" cy="291.44" rx="20.16" ry="16.38" fill="#D38A4A" stroke="#24384A" stroke-width="1.68"/><circle cx="248.79999999999998" cy="288.08" r="2.1" fill="#24384A" stroke="none" stroke-width="0"/><path d="M159.76,337.64 L155.56,380.9 L151.35999999999999,384.26" fill="none" stroke="#24384A" stroke-width="4.62" stroke-linecap="round" stroke-linejoin="round"/><path d="M179.5,337.64 L175.3,380.9 L171.1,384.26" fill="none" stroke="#24384A" stroke-width="4.62" stroke-linecap="round" stroke-linejoin="round"/><path d="M207.64,337.64 L213.1,380.9 L208.89999999999998,384.26" fill="none" stroke="#24384A" stroke-width="4.62" stroke-linecap="round" stroke-linejoin="round"/><path d="M224.44,337.64 L229.9,380.9 L225.7,384.26" fill="none" stroke="#24384A" stroke-width="4.62" stroke-linecap="round" stroke-linejoin="round"/><path d="M141.7,313.7 Q116.5,299.0 110.2,324.2" fill="none" stroke="#D38A4A" stroke-width="5.88" stroke-linecap="round" stroke-linejoin="round"/><polygon points="226.54,279.68 230