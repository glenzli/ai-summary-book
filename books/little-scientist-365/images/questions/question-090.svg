  <g data-question="090" data-layout="plant" data-presentation="plant" data-source="plant" data-icons="plant-plate-090"><text x="54" y="54" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="26" font-weight="760">花园是一张交换物质和信息的网，不是植物单独生活</text><rect x="34" y="82" width="892" height="382" rx="4" fill="#DDEFF3" stroke="none" stroke-width="0"/><path d="M34,330 Q170,280 315,330 T610,330 T920,330 V464 H34 Z" fill="#A7C97E" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/><rect x="34" y="360" width="892" height="104" rx="0" fill="#B8845D" stroke="none" stroke-width="0"/><path d="M34,360 Q175,328 320,360 T610,360 T930,360" fill="none" stroke="#4F8A55" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><path d="M250,335.75 L250,413.75" fill="none" stroke="#2F6744" stroke-width="5.8500000000000005" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="283.8" cy="300.0" rx="21.45" ry="31.200000000000003" fill="#D9703D" stroke="#24384A" stroke-width="1.9500000000000002"/><ellipse cx="266.9" cy="329.271658647914" rx="21.45" ry="31.200000000000003" fill="#7A68A4" stroke="#24384A" stroke-width="1.9500000000000002"/><ellipse cx="233.1" cy="329.271658647914" rx="21.45" ry="31.200000000000003" fill="#D9703D" stroke="#24384A" stroke-width="1.9500000000000002"/><ellipse cx="216.2" cy="300.0" rx="21.45" ry="31.200000000000003" fill="#7A68A4" stroke="#24384A" stroke-width="1.9500000000000002"/><ellipse cx="233.1" cy="270.728341352086" rx="21.45" ry="31.200000000000003" fill="#D9703D" stroke="#24384A" stroke-width="1.9500000000000002"/><ellipse cx="266.9" cy="270.728341352086" rx="21.45" ry="31.200000000000003" fill="#7A68A4" stroke="#24384A" stroke-width="1.9500000000000002"/><circle cx="250" cy="300" r="23.400000000000002" fill="#E6B542" stroke="#24384A" stroke-width="1.9500000000000002"/><ellipse cx="410" cy="200" rx="29.759999999999998" ry="18.6" fill="#E6B542" stroke="#243