<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">吸管怎么把水送到嘴里？</title>
  <desc id="desc">围绕“吸管怎么把水送到嘴里？”绘制的清晰主题图；具体对象优先，必要关系用箭头表示。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#173746"/></marker>
  </defs>
  <rect width="960" height="540" fill="#F0FDFA"/>
  <path d="M0,455 Q185,410 355,455 T700,455 T1040,455 V540 H0 Z" fill="#0F8A8A" opacity="0.07"/>

  <g data-question="037" data-layout="earth-weather" data-presentation="earth-weather" data-source="earth-weather" data-icons="earth-weather-plate-037"><text x="54" y="54" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="26" font-weight="760">吸管顶部压力降低后，杯面上的大气压把水推入吸管</text><rect x="34" y="82" width="892" height="382" rx="4" fill="#EEE9DF" stroke="none" stroke-width="0"/><rect x="150" y="195" width="310" height="230" rx="10" fill="#DCECF0" stroke="#24384A" stroke-width="4"/><rect x="165" y="285" width="280" height="125" rx="0" fill="#A9D9E2" stroke="none" stroke-width="0"/><path d="M310,115 L310,370" fill="none" stroke="#2D8178" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/><circle cx="620" cy="226.1" r="18.6" fill="#E7B39E" stroke="#24384A" stroke-width="1.8599999999999999"/><path d="M620,246.56 L620,312.9" fill="none" stroke="#273552" stroke-width="7.4399999999999995" stroke-linecap="round" stroke-linejoin="round"/><path d="M620,272.6 L581.56,294.3" fill="none" stroke="#273552" stroke-width="5.58" stroke-linecap="round" stroke-linejoin="round"/><path d="M620,272.6 L658.44,294.3" fill="none" stroke="#273552" stroke-width="5.58" stroke-linecap="round" stroke-linejoin="round"/><path d="M620,311.04 L590.24,356.3" fill="none" stroke="#273552" stroke-width="6.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M620,311.04 L649.76,356.3" fill="none" stroke="#273552" stroke-width="6.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M310,115 Q420,115 540,210" fill="none" stroke="#2D8178" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/><path d="M310,350 L310,205" fill="none" stroke="#4B86B7" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M180,270 Q240,285 275,300" fill="none" stroke="#DE753E" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M310,190 L598,99" fill="none" stroke="#24384A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="310" cy="190" r="4.5" fill="#24384A" stroke="none" stroke-width="0"/><text x="610" y="105" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">嘴吸走部分空气，</text><text x="610" y="127" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">使吸管内压力下降</text><path d="M210,285 L598,264" fill="none" stroke="#24384A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="210" cy="285" r="4.5" fill="#24384A" stroke="none" stroke-width="0"/><text x="610" y="270" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">外界空气压着水面</text><text x="610" y="292" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">，把水推向低压处</text><text x="430" y="490" fill="#24384A" text-anchor="middle" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="680">真正把水送上去的主要是压力差，不是嘴在远处“拉”水</text></g>
  <rect x="12" y="12" width="936" height="516" rx="8" fill="none" stroke="#173746" stroke-width="3" opacity="0.18"/>
</svg>
