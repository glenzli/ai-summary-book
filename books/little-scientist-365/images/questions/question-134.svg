<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">斑马为什么有黑白条纹？</title>
  <desc id="desc">围绕“斑马为什么有黑白条纹？”绘制的清晰主题图；具体对象优先，必要关系用箭头表示。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#24324A"/></marker>
  </defs>
  <rect width="960" height="540" fill="#FFF4F7"/>
  <path d="M0,455 Q185,410 355,455 T700,455 T1040,455 V540 H0 Z" fill="#2563A6" opacity="0.07"/>

  <g data-question="134" data-layout="vertebrate" data-presentation="vertebrate" data-source="vertebrate" data-icons="vertebrate-plate-134"><text x="54" y="54" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="26" font-weight="760">黑白条纹会打乱轮廓，也可能减少叮咬昆虫落脚</text><rect x="34" y="82" width="892" height="382" rx="4" fill="#DDEEF4" stroke="none" stroke-width="0"/><path d="M34,350 Q180,285 335,350 T650,350 T960,350 V464 H34 Z" fill="#A8CA83" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/><path d="M34,425 Q190,382 360,425 T700,425 T1040,425 V464 H34 Z" fill="#5C9659" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="360" cy="310" rx="93.60000000000001" ry="48.36" fill="#FFFFFF" stroke="#24384A" stroke-width="3.12"/><path d="M416.16,290.5 Q426.29999999999995,284.26 441.9,268.65999999999997" fill="none" stroke="#FFFFFF" stroke-width="21.84" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="455.94" cy="256.96" rx="37.44" ry="30.42" fill="#FFFFFF" stroke="#24384A" stroke-width="3.12"/><circle cx="469.2" cy="250.71999999999997" r="3.9000000000000004" fill="#24384A" stroke="none" stroke-width="0"/><path d="M303.84,342.76 L296.03999999999996,423.1 L288.23999999999995,429.34000000000003" fill="none" stroke="#24384A" stroke-width="8.58" stroke-linecap="round" stroke-linejoin="round"/><path d="M340.5,342.76 L332.7,423.1 L324.9,429.34000000000003" fill="none" stroke="#24384A" stroke-width="8.58" stroke-linecap="round" stroke-linejoin="round"/><path d="M392.76,342.76 L402.9,423.1 L395.09999999999997,429.34000000000003" fill="none" stroke="#24384A" stroke-width="8.58" stroke-linecap="round" stroke-linejoin="round"/><path d="M423.96,342.76 L434.09999999999997,423.1 L426.29999999999995,429.34000000000003" fill="none" stroke="#24384A" stroke-width="8.58" stroke-linecap="round" stroke-linejoin="round"/><path d="M270.3,298.3 Q223.5,271.0 211.79999999999998,317.8" fill="none" stroke="#FFFFFF" stroke-width="10.92" stroke-linecap="round" stroke-linejoin="round"/><path d="M297.6,272.56 L311.64,347.44" fill="none" stroke="#24384A" stroke-width="7.0200000000000005" stroke-linecap="round" stroke-linejoin="round"/><path d="M324.9,272.56 L338.94,347.44" fill="none" stroke="#24384A" stroke-width="7.0200000000000005" stroke-linecap="round" stroke-linejoin="round"/><path d="M352.2,272.56 L366.24,347.44" fill="none" stroke="#24384A" stroke-width="7.0200000000000005" stroke-linecap="round" stroke-linejoin="round"/><path d="M379.5,272.56 L393.54,347.44" fill="none" stroke="#24384A" stroke-width="7.0200000000000005" stroke-linecap="round" stroke-linejoin="round"/><path d="M406.8,272.56 L420.84000000000003,347.44" fill="none" stroke="#24384A" stroke-width="7.0200000000000005" stroke-linecap="round" stroke-linejoin="round"/><path d="M340,285 L638,124" fill="none" stroke="#24384A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="340" cy="285" r="4.5" fill="#24384A" stroke="none" stroke-width="0"/><text x="650" y="130" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">条纹由皮肤中色素细胞的分布形成</text><path d="M265,325 L638,254" fill="none" stroke="#24384A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="265" cy="325" r="4.5" fill="#24384A" stroke="none" stroke-width="0"/><text x="650" y="260" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">群体站在一起时轮廓互相交叠</text><path d="M430,350 L638,389" fill="none" stroke="#24384A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="430" cy="350" r="4.5" fill="#24384A" stroke="none" stroke-width="0"/><text x="650" y="395" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">条纹不是年龄刻度</text><text x="650" y="417" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">，每只个体图案不同</text></g>
