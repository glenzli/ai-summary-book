<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">空气明明看不见，怎么知道它在？</title>
  <desc id="desc">围绕“空气明明看不见，怎么知道它在？”绘制的清晰主题图；具体对象优先，必要关系用箭头表示。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#173746"/></marker>
  </defs>
  <rect width="960" height="540" fill="#F0FDFA"/>
  <path d="M0,455 Q185,410 355,455 T700,455 T1040,455 V540 H0 Z" fill="#0F8A8A" opacity="0.07"/>

  <g data-question="032" data-layout="earth-weather" data-presentation="earth-weather" data-source="earth-weather" data-icons="earth-weather-plate-032"><text x="54" y="54" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="26" font-weight="760">空气占空间并能推压物体，虽然眼睛通常看不见它</text><rect x="34" y="82" width="892" height="382" rx="4" fill="#EEE9DF" stroke="none" stroke-width="0"/><rect x="130" y="210" width="320" height="210" rx="8" fill="#A9D9E2" stroke="#24384A" stroke-width="4"/><rect x="230" y="135" width="120" height="190" rx="6" fill="none" stroke="#24384A" stroke-width="5"/><path d="M140,250 L440,250" fill="none" stroke="#4B86B7" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M290,110 L290,165" fill="none" stroke="#273552" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><circle cx="260" cy="180" r="8" fill="#2D8178" stroke="none" stroke-width="0"/><circle cx="295" cy="205" r="8" fill="#2D8178" stroke="none" stroke-width="0"/><circle cx="325" cy="175" r="8" fill="#2D8178" stroke="none" stroke-width="0"/><ellipse cx="690" cy="265" rx="90" ry="115" fill="#C85555" stroke="#24384A" stroke-width="4"/><rect x="676" y="375" width="28" height="40" rx="4" fill="#8A654A" stroke="#24384A" stroke-width="3"/><path d="M570,265 Q600,230 625,240" fill="none" stroke="#2D8178" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M290,220 L578,109" fill="none" stroke="#24384A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="290" cy="220" r="4.5" fill="#24384A" stroke="none" stroke-width="0"/><text x="590" y="115" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">倒扣杯里的空气阻</text><text x="590" y="137" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">止水占据同一空间</text><path d="M690,265 L602,399" fill="none" stroke="#24384A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="690" cy="265" r="4.5" fill="#24384A" stroke="none" stroke-width="0"/><text x="590" y="405" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">吹入更多空气，气球壁被向外推开</text></g>
  <rect x="12" y="12" width="936" height="516" rx="8" fill="none" stroke="#173746" stroke-width="3" opacity="0.18"/>
