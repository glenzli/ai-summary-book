  <g data-question="196" data-layout="machine" data-presentation="machine" data-source="machine" data-icons="machine-plate-196"><text x="54" y="54" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="26" font-weight="760">电流通过绕在铁芯外的线圈，会产生可开关的电磁铁</text><rect x="34" y="82" width="892" height="382" rx="4" fill="#EFEAE1" stroke="none" stroke-width="0"/><rect x="34" y="360" width="892" height="104" rx="0" fill="#C99B70" stroke="none" stroke-width="0"/><path d="M34,360 L926,360" fill="none" stroke="#24384A" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><rect x="260" y="205" width="300" height="80" rx="12" fill="#AAB7BD" stroke="#24384A" stroke-width="4"/><path d="M285,180 q-25,65 0,130 q25,-65 0,-130" fill="none" stroke="#DC713E" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><path d="M320,180 q-25,65 0,130 q25,-65 0,-130" fill="none" stroke="#DC713E" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><path d="M355,180 q-25,65 0,130 q25,-65 0,-130" fill="none" stroke="#DC713E" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><path d="M390,180 q-25,65 0,130 q25,-65 0,-130" fill="none" stroke="#DC713E" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><path d="M425,180 q-25,65 0,130 q25,-65 0,-130" fill="none" stroke="#DC713E" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><path d="M460,180 q-25,65 0,130 q25,-65 0,-130" fill="none" stroke="#DC713E" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><path d="M495,180 q-25,65 0,130 q25,-65 0,-130" fill="none" stroke="#DC713E" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><path d="M530,180 q-25,65 0,130 q25,-65 0,-130" fill="none" stroke="#DC713E" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><rect x="706.5" y="204.5" width="77.0" height="121.00000000000001" rx="5.5" fill="#4B82B3" stroke="#24384A" stroke-width="2.2"/><rect x="731.25" y="193.5" width="27.500000000000004" height="11.0" rx="1.6500000000000001" fill="#DC713E" stroke="#24384A" stroke-width="1.6500000000000001"/><text x="745" y="245.75" fill="#FFFFFF" text-anchor="middle" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="750">+</text><text x="745" y="298.0" fill="#FFFFFF" text-anchor="middle" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="750">−</text><path d="M285,180 Q285,120 745,120 V190 M545,310 Q545,420 745,420 V340" fill="none" stroke="#2A5F89" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><rect x="190" y="360" width="75" height="18" rx="4" fill="#AAB7BD" stroke="#24384A" stroke-width="2"/><rect x="290" y="390" width="75" height="18" rx="4" fill="#AAB7BD" stroke="#24384A" stroke-width="2"/><path d="M420,230 L608,99" fill="none" stroke="#24384A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="420" cy="230" r="4.5" fill="#24384A" stroke="none" stroke-width="0"/><text x="620" y="105" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">线圈每一匝的磁场叠加</text><path d="M260,365 L608,384" fill="none" stroke="#24384A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="260" cy="365" r="4.5" fill="#24384A" stroke="none" stroke-width="0"/><text x="620" y="390" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">铁芯磁化后吸引铁件；</text><text x="620" y="412" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">断电后磁性大幅减弱</text></g>
