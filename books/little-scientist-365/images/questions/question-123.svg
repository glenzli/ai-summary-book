<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">企鹅也是鸟，为什么不飞上天？</title>
  <desc id="desc">围绕“企鹅也是鸟，为什么不飞上天？”绘制的清晰主题图；具体对象优先，必要关系用箭头表示。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#24324A"/></marker>
  </defs>
  <rect width="960" height="540" fill="#FFF4F7"/>
  <path d="M0,455 Q185,410 355,455 T700,455 T1040,455 V540 H0 Z" fill="#2563A6" opacity="0.07"/>

  <g data-question="123" data-layout="vertebrate" data-presentation="vertebrate" data-source="vertebrate" data-icons="vertebrate-plate-123"><text x="54" y="54" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="26" font-weight="760">企鹅把翅膀变成鳍状肢，在水下像飞行一样划水</text><rect x="34" y="82" width="892" height="382" rx="4" fill="#BDE4EA" stroke="none" stroke-width="0"/><path d="M34,420 Q190,375 350,420 T680,420 T1000,420 V464 H34 Z" fill="#D4C28A" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/><path d="M95,425 q18,-85 36,0 M770,425 q20,-95 40,0 M830,425 q17,-70 34,0" fill="none" stroke="#2D8079" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><circle cx="120" cy="160" r="7" fill="none" stroke="#FFFFFF" stroke-width="2"/><circle cx="150" cy="125" r="4" fill="none" stroke="#FFFFFF" stroke-width="2"/><circle cx="810" cy="175" r="7" fill="none" stroke="#FFFFFF" stroke-width="2"/><circle cx="845" cy="135" r="4" fill="none" stroke="#FFFFFF" stroke-width="2"/><circle cx="750" cy="240" r="5" fill="none" stroke="#FFFFFF" stroke-width="2"/><ellipse cx="370" cy="270" rx="73.0" ry="118.0" fill="#263A58" stroke="#24384A" stroke-width="4.0"/><ellipse cx="370" cy="292.0" rx="48.0" ry="85.0" fill="#FFFFFF" stroke="none" stroke-width="0"/><polygon points="318.0,205.0 260.0,325.0 335.0,294.0" fill="#4C86B8" stroke="#24384A" stroke-width="3.0" stroke-linejoin="round"/><polygon points="422.0,205.0 480.0,325.0 405.0,294.0" fill="#4C86B8" stroke="#24384A" stroke-width="3.0" stroke-linejoin="round"/><polygon points="382.0,198.0 418.0,214.0 382.0,225.0" fill="#E6B542" stroke="#24384A" stroke-width="2.5" stroke-linejoin="round"/><ellipse cx="336.0" cy="388.0" rx="38.0" ry="13.0" fill="#D9693F" stroke="#24384A" stroke-width="3.0"/><ellipse cx="404.0" cy="388.0" rx="38.0" ry="13.0" fill="#D9693F" stroke="#24384A" stroke-width="3.0"/><path d="M260,275 Q170,230 120,275" fill="none" stroke="#2D8079" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M270,255 L638,139" fill="none" stroke="#24384A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="270" cy="255" r="4.5" fill="#24384A" stroke="none" stroke-width="0"/><text x="650" y="145" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">短而扁的翅膀不适合空中飞行</text><path d="M330,340 L638,264" fill="none" stroke="#24384A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="330" cy="340" r="4.5" fill="#24384A" stroke="none" stroke-width="0"/><text x="650" y="270" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">坚实翼骨和肌肉推动鳍状肢</text><path d="M470,300 L638,389" fill="none" stroke="#24384A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="470" cy="300" r="4.5" fill="#24384A" stroke="none" stroke-width="0"/><text x="650" y="395" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">流线身体和防水羽毛减少阻力</text></g>
  <rect x="12" y="12" width="936" height="516" rx="8" fill="none" stroke="#24324A" stroke-width="3" opacity="0.18"/>
</svg>
