<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">雨滴真的是眼泪形吗？</title>
  <desc id="desc">围绕“雨滴真的是眼泪形吗？”绘制的清晰主题图；具体对象优先，必要关系用箭头表示。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#173746"/></marker>
  </defs>
  <rect width="960" height="540" fill="#F0FDFA"/>
  <path d="M0,455 Q185,410 355,455 T700,455 T1040,455 V540 H0 Z" fill="#0F8A8A" opacity="0.07"/>

  <g data-question="040" data-layout="earth-weather" data-presentation="earth-weather" data-source="earth-weather" data-icons="earth-weather-plate-040"><text x="54" y="54" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="26" font-weight="760">小雨滴近似圆球，大雨滴下落时底部变平，过大还会碎开</text><rect x="34" y="82" width="892" height="382" rx="4" fill="#DCEEF4" stroke="none" stroke-width="0"/><circle cx="170" cy="255" r="45" fill="#4B86B7" stroke="#24384A" stroke-width="3"/><ellipse cx="430" cy="270" rx="85" ry="65" fill="#4B86B7" stroke="#24384A" stroke-width="3"/><path d="M640,220 Q750,160 830,245 Q800,330 710,315 Q650,300 640,220 Z" fill="#4B86B7" stroke="#24384A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M690,270 L780,270" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="170" y="360" fill="#24384A" text-anchor="middle" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">小滴：表面张力使它接近球形</text><text x="430" y="380" fill="#24384A" text-anchor="middle" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">较大滴：空气把底部压平</text><text x="745" y="380" fill="#24384A" text-anchor="middle" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">过大：振动并碎成小滴</text><text x="480" y="475" fill="#24384A" text-anchor="middle" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="670">“眼泪形”常是画法；自由下落的雨滴没有尖尾巴</text></g>
  <rect x="12" y="12" width="936" height="516" rx="8" fill="none" stroke="#173746" stroke-width="3" opacity="0.18"/>
</svg>
