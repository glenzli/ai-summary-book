  <path d="M0,455 Q185,410 355,455 T700,455 T1040,455 V540 H0 Z" fill="#2563A6" opacity="0.07"/>

  <g data-question="143" data-layout="vertebrate" data-presentation="vertebrate" data-source="vertebrate" data-icons="vertebrate-plate-143"><text x="54" y="54" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="26" font-weight="760">狗鼻腔内有大片嗅上皮，湿鼻面也能捕捉气味分子</text><rect x="34" y="82" width="892" height="382" rx="4" fill="#DDEEF4" stroke="none" stroke-width="0"/><path d="M34,350 Q180,285 335,350 T650,350 T960,350 V464 H34 Z" fill="#A8CA83" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/><path d="M34,425 Q190,382 360,425 T700,425 T1040,425 V464 H34 Z" fill="#5C9659" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="360" cy="310" rx="93.60000000000001" ry="48.36" fill="#B68155" stroke="#24384A" stroke-width="3.12"/><path d="M416.16,290.5 Q426.29999999999995,284.26 441.9,268.65999999999997" fill="none" stroke="#B68155" stroke-width="21.84" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="455.94" cy="256.96" rx="37.44" ry="30.42" fill="#B68155" stroke="#24384A" stroke-width="3.12"/><circle cx="469.2" cy="250.71999999999997" r="3.9000000000000004" fill="#24384A" stroke="none" stroke-width="0"/><path d="M303.84,342.76 L296.03999999999996,423.1 L288.23999999999995,429.34000000000003" fill="none" stroke="#24384A" stroke-width="8.58" stroke-linecap="round" stroke-linejoin="round"/><path d="M340.5,342.76 L332.7,423.1 L324.9,429.34000000000003" fill="none" stroke="#24384A" stroke-width="8.58" stroke-linecap="round" stroke-linejoin="round"/><path d="M392.76,342.76 L402.9,423.1 L395.09999999999997,429.34000000000003" fill="none" stroke="#24384A" stroke-width="8.58" stroke-linecap="round" stroke-linejoin="round"/><path d="M423.96,342.76 L434.09999999999997,423.1 L426.29999999999995,429.34000000000003" fill="none" stroke="#24384A" stroke-width="8.58" stroke-linecap="round" stroke-linejoin="round"/><path d="M270.3,298.3 Q223.5,271.0 211.79999999999998,317.8" fill="none" stroke="#B68155" stroke-width="10.92" stroke-linecap="round" stroke-linejoin="round"/><path d="M455,220 L638,124" fill="none" stroke="#24384A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="455" cy="220" r="4.5" fill="#24384A" stroke="none" stroke-width="0"/><text x="650" y="130" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">鼻孔能让进入和呼出的气流分开</text><path d="M425,265 L638,254" fill="none" stroke="#24384A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="425" cy="265" r="4.5" fill="#24384A" stroke="none" stroke-width="0"/><text x="650" y="260" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">卷曲鼻甲增加气味接触面积</text><path d="M330,320 L638,389" fill="none" stroke="#24384A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="330" cy="320" r="4.5" fill="#24384A" stroke="none" stroke-width="0"/><text x="650" y="395" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">气味图样送入大脑，</text><text x="650" y="417" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">不是鼻尖单独在思考</text></g>
  <rect x="12" y="12" width="936" height="516" rx="8" fill="none" stroke="#24324A" stroke-width="3" opacity="0.18"/>
