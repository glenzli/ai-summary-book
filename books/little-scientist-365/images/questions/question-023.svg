<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">金属为什么摸起来更凉？</title>
  <desc id="desc">围绕“金属为什么摸起来更凉？”绘制的清晰主题图；具体对象优先，必要关系用箭头表示。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#17213A"/></marker>
  </defs>
  <rect width="960" height="540" fill="#F4F9FF"/>
  <path d="M0,455 Q185,410 355,455 T700,455 T1040,455 V540 H0 Z" fill="#2563EB" opacity="0.07"/>

  <g data-question="023" data-layout="earth-weather" data-presentation="earth-weather" data-source="earth-weather" data-icons="earth-weather-plate-023"><text x="54" y="54" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="26" font-weight="760">金属导热快，会更快把手的热带走；温度未必比木头更低</text><rect x="34" y="82" width="892" height="382" rx="4" fill="#EEE9DF" stroke="none" stroke-width="0"/><rect x="120" y="220" width="270" height="100" rx="4" fill="#A9B5BC" stroke="#24384A" stroke-width="4"/><rect x="560" y="220" width="270" height="100" rx="4" fill="#8A654A" stroke="#24384A" stroke-width="4"/><circle cx="255" cy="160" r="40" fill="#E7B39E" stroke="#24384A" stroke-width="3"/><circle cx="695" cy="160" r="40" fill="#E7B39E" stroke="#24384A" stroke-width="3"/><path d="M250,205 L250,245" fill="none" stroke="#4B86B7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M285,205 L285,245" fill="none" stroke="#4B86B7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M320,205 L320,245" fill="none" stroke="#4B86B7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M355,205 L355,245" fill="none" stroke="#4B86B7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M650,205 L650,235" fill="none" stroke="#DE753E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M685,205 L685,235" fill="none" stroke="#DE753E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M720,205 L720,235" fill="none" stroke="#DE753E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="255" y="375" fill="#24384A" text-anchor="middle" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="21" font-weight="650">金属：热流较快</text><text x="695" y="375" fill="#24384A" text-anchor="middle" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="21" font-weight="650">木头：热流较慢</text><text x="480" y="475" fill="#24384A" text-anchor="middle" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="650">在同一房间放久后两者温度可相同，触感仍不同</text></g>
