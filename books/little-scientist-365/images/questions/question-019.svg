<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">草叶上的白霜是什么？</title>
  <desc id="desc">围绕“草叶上的白霜是什么？”绘制的清晰主题图；具体对象优先，必要关系用箭头表示。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#17213A"/></marker>
  </defs>
  <rect width="960" height="540" fill="#F4F9FF"/>
  <path d="M0,455 Q185,410 355,455 T700,455 T1040,455 V540 H0 Z" fill="#2563EB" opacity="0.07"/>

  <g data-question="019" data-layout="earth-weather" data-presentation="earth-weather" data-source="earth-weather" data-icons="earth-weather-plate-019"><text x="54" y="54" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="26" font-weight="760">晴冷夜里叶面降到冰点以下，水汽可直接沉积成冰晶</text><rect x="34" y="82" width="892" height="382" rx="4" fill="#273552" stroke="none" stroke-width="0"/><circle cx="55" cy="100" r="2" fill="#E8B642" stroke="none" stroke-width="0"/><circle cx="134" cy="153" r="3" fill="#FFFFFF" stroke="none" stroke-width="0"/><circle cx="213" cy="206" r="4" fill="#E8B642" stroke="none" stroke-width="0"/><circle cx="292" cy="259" r="2" fill="#FFFFFF" stroke="none" stroke-width="0"/><circle cx="371" cy="312" r="3" fill="#E8B642" stroke="none" stroke-width="0"/><circle cx="450" cy="135" r="4" fill="#FFFFFF" stroke="none" stroke-width="0"/><circle cx="529" cy="188" r="2" fill="#E8B642" stroke="none" stroke-width="0"/><circle cx="608" cy="241" r="3" fill="#FFFFFF" stroke="none" stroke-width="0"/><circle cx="687" cy="294" r="4" fill="#E8B642" stroke="none" stroke-width="0"/><circle cx="766" cy="117" r="2" fill="#FFFFFF" stroke="none" stroke-width="0"/><circle cx="845" cy="170" r="3" fill="#E8B642" stroke="none" stroke-width="0"/><circle cx="74" cy="223" r="4" fill="#FFFFFF" stroke="none" stroke-width="0"/><circle cx="153" cy="276" r="2" fill="#E8B642" stroke="none" stroke-width="0"/><circle cx="232" cy="329" r="3" fill="#FFFFFF" stroke="none" stroke-width="0"/><circle cx="311" cy="152" r="4" fill="#E8B642" stroke="none" stroke-width="0"/><circle cx="390" cy="205" r="2" fill="#FFFFFF" stroke="none" stroke-width="0"/><circle cx="469" cy="258" r="3" fill="#E8B642" stroke="none" stroke-width="0"/><circle cx="548" cy="311" r="4" fill="#FFFFFF" stroke="none" stroke-width="0"/><circle cx="627" cy="134" r="2" fill="#E8B642" stroke="none" stroke-width="0"/><circle cx="706" cy="187" r="3" fill="#FFFFFF" stroke="none" stroke-width="0"/><circle cx="785" cy="240" r="4" fill="#E8B642" stroke="none" stroke-width="0"/><circle cx="864" cy="293" r="2" fill="#FFFFFF" stroke="none" stroke-width="0"/><circle cx="93" cy="116" r="3" fill="#E8B642" stroke="none" stroke-width="0"/><circle cx="172" cy="169" r="4" fill="#FFFFFF" stroke="none" stroke-width="0"/><path d="M34,350 Q175,285 325,350 T635,350 T945,350 V464 H34 Z" fill="#A6C982" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/><path d="M34,425 Q190,380 355,425 T690,425 T1030,425 V464 H34 Z" fill="#5A9258" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/><path d="M226.5,347.25 Q307.0,249.5 433.5,318.5 Q353.0,419.7 226.5,347.25 Z" fill="#5A9258" stroke="#24384A" stroke-width="3.4499999999999997" stroke-linecap="round" stroke-linejoin="round"/><path d="M243.75,341.5 L410.5,321.95" fill="none" stroke="#A6C982" stroke-width="4.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M238,290 H262 M250,278 V302 M241,281 L259,299 M259,281 L241,299" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M288,315 H312 M300,303 V327 M291,306 L309,324 M309,306 L291,324" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M338,280 H362 M350,268 V292 M341,271 L359,289 M359,271 L341,289" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M398,315 H422 M410,303 V327 M401,306 L419,324 M419,306 L401,324" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M180,160 Q245,220 285,275" fill="none" stroke="#A9D9E2" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M300,300 L608,104" fill="none" stroke="#24384A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="300" cy="300" r="4.5" fill="#24384A" stroke="none" stroke-width="0"/><text x="620" y="110" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">冰晶长在叶面，不</text><text x="620" y="132" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">是从云里落下的雪</text><path d="M330,350 L608,294" fill="none" stroke="#24384A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="330" cy="350" r="4.5" fill="#24384A" stroke="none" stroke-width="0"/><text x="620" y="300" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">风小、云少时叶面更</text><text x="620" y="322" fill="#24384A" text-anchor="start" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650">容易向天空辐射散热</text><text x="430" y="490" fill="#FFFFFF" text-anchor="middle" font-family="system-ui, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="690">若水汽先变成小水滴，再冻结，就会形成不同的结冰形态</text></g>
