<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">有砟轨道把列车重量一层层传下去</title>
  <desc id="desc">剖面图从上到下标出钢轨、扣件、轨枕、道砟和路基。红色长箭头表示列车重量向下传递，蓝色斜箭头表示雨水从碎石间排走；右侧小图展示没有道砟的混凝土板式轨道。</desc>
