<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">架空线可以输送交流电或直流电</title>
  <desc id="desc">左右两列电车的受电弓滑板都贴住头顶接触线。左侧双向箭头表示交流方向来回改变，右侧单向箭头表示直流方向保持一致。</desc>
  <defs>
    <marker id="acArrow" viewBox="0 0 28 28" refX="26" refY="14" markerWidth="28" markerHeight="28" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M2 2 26 14 2 26Z" fill="#3b82c4"/>
    </marker>
    <marker id="dcArrow" viewBox="0 0 28 28" refX="26" refY="14" markerWidth="28" markerHeight="28" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M2 2 26 14 2 26Z" fill="#d95d4f"/>
    </marker>
  </defs>
  <rect width="1200" height="675" rx="34" fill="#fff9ed"/>
  <path d="M600 42v584" stroke="#d8c5a9" stroke-width="5" stroke-dasharray="18 18"/>

  <text x="300" y="66" text-anchor="middle" font-family="system-ui, sans-serif" font-size="34" font-weight="750" fill="#25364a">交流：来回</text>
  <text x="900" y="66" text-anchor="middle" font-family="system-ui, sans-serif" font-size="34" font-weight="750" fill="#25364a">直流：同向</text>
  <path d="M165 118h270" stroke="#3b82c4" stroke-width="9" stroke-linecap="round" marker-start="url(#acArrow)" marker-end="url(#acArrow)"/>
  <path d="M765 118h270" stroke="#d95d4f" stroke-width="9" stroke-linecap="round" marker-end="url(#dcArrow)"/>

  <g>
    <path d="M72 190h456" stroke="#25364a" stroke-width="11" stroke-linecap="round"/>
    <path d="M230 190h140" stroke="#4f9bd8" stroke-width="21" stroke-linecap="round"/>
    <g fill="none" stroke="#25364a" stroke-width="14" stroke-linecap="round">
      <path d="M200 415 340 215M400 415 260 215"/>
      <path d="M260 215v-25M340 215v-25"/>
    </g>
    <circle cx="300" cy="315" r="15" fill="#ffd166" stroke="#25364a" stroke-width="7"/>
    <path d="M88 415h424c35 0 64 29 64 64v78H24v-78c0-35 29-64 64-64Z" fill="#4f9bd8" stroke="#25364a" stroke-width="10"/>
    <path d="M105 455h390c17 0 31 14 31 31v22H74v-22c0-17 14-31 31-31Z" fill="#dff2fb" stroke="#25364a" stroke-width="7"/>
    <g fill="#465d73" stroke="#25364a" stroke-width="8"><circle cx="154" cy="558" r="54"/><circle cx="446" cy="558" r="54"/></g>
  </g>

  <g transform="translate(600)">
    <path d="M72 190h456" stroke="#25364a" stroke-width="11" stroke-linecap="round"/>
    <path d="M230 190h140" stroke="#ef6a5b" stroke-width="21" stroke-linecap="round"/>
    <g fill="none" stroke="#25364a" stroke-width="14" stroke-linecap="round">
      <path d="M200 415 340 215M400 415 260 215"/>
      <path d="M260 215v-25M340 215v-25"/>
    </g>
    <circle cx="300" cy="315" r="15" fill="#ffd166" stroke="#25364a" stroke-width="7"/>
    <path d="M88 415h424c35 0 64 29 64 64v78H24v-78c0-35 29-64 64-64Z" fill="#ef6a5b" stroke="#25364a" stroke-width="10"/>
    <path d="M105 455h390c17 0 31 14 31 31v22H74v-22c0-17 14-31 31-31Z" fill="#dff2fb" stroke="#25364a" stroke-width="7"/>
    <g fill="#465d73" stroke="#25364a" stroke-width="8"><circle cx="154" cy="558" r="54"/><circle cx="446" cy="558" r="54"/></g>
  </g>
  <path d="M55 616h1090" stroke="#667687" stroke-width="22" stroke-linecap="round"/>
</svg>
