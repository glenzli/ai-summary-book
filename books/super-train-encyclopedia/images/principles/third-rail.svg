  <text x="891" y="511" font-family="system-ui, sans-serif" font-size="30" font-weight="700" fill="#25364a">集电靴</text>
  <text x="976" y="660" font-family="system-ui, sans-serif" font-size="30" font-weight="700" fill="#25364a">供电轨</text>
</svg>
