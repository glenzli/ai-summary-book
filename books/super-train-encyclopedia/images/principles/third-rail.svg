<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">集电靴贴着轨旁供电轨取电</title>
  <desc id="desc">电车下方的深色支臂连接一只集电靴；集电靴底面贴住蓝色第三轨顶面。第三轨由黄色绝缘支座托起，蓝色箭头表示电能进入车辆。</desc>
