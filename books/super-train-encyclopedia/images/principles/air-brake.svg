<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">自动空气制动怎样让整列车刹车</title>
  <desc id="desc">司机的制动阀降低贯穿列车的制动管压力。每节车的控制阀收到这个压力变化后，让本车储风缸推动制动缸。管路意外断开也会漏气降压，使列车趋向自动制动。</desc>
  <defs>
    <marker id="blueArrow" viewBox="0 0 24 24" refX="22" refY="12" markerWidth="25" markerHeight="25" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M2 2 22 12 2 22Z" fill="#3b82c4"/>
    </marker>
    <marker id="orangeArrow" viewBox="0 0 24 24" refX="22" refY="12" markerWidth="25" markerHeight="25" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M2 2 22 12 2 22Z" fill="#d97848"/>
    </marker>
  </defs>
  <rect width="1200" height="675" rx="34" fill="#fff9ed"/>

  <!-- 三节车厢。 -->
  <g stroke="#25364a" stroke-width="8">
    <path d="M78 305V190Q78 143 128 143H285L321 305Z" fill="#ef8a7d"/>
    <rect x="337" y="143" width="325" height="162" rx="26" fill="#55a9c9"/>
    <rect x="678" y="143" width="325" height="162" rx="26" fill="#86b88a"/>
    <path d="M1019 143H1083Q1128 143 1142 191L1167 305H1019Z" fill="#e3ab65"/>
  </g>
  <g fill="#dff2fb" stroke="#25364a" stroke-width="6">
    <rect x="111" y="177" width="119" height="69" rx="15"/>
    <rect x="377" y="177" width="105" height="69" rx="15"/><rect x="517" y="177" width="105" height="69" rx="15"/>
    <rect x="718" y="177" width="105" height="69" rx="15"/><rect x="858" y="177" width="105" height="69" rx="15"/>
    <path d="M1051 177H1090Q1111 177 1118 203L1128 246H1051Z"/>
  </g>
  <g fill="#52687c" stroke="#25364a" stroke-width="7">
    <circle cx="187" cy="325" r="42"/><circle cx="411" cy="325" r="42"/><circle cx="586" cy="325" r="42"/>
    <circle cx="752" cy="325" r="42"/><circle cx="927" cy="325" r="42"/><circle cx="1090" cy="325" r="42"/>
  </g>

  <!-- 驾驶室里的制动阀把制动管向大气放气。 -->
  <circle cx="190" cy="276" r="23" fill="#ffd166" stroke="#25364a" stroke-width="6"/>
  <path d="M190 253V221M190 221l26-14" stroke="#25364a" stroke-width="7" stroke-linecap="round"/>
  <path d="M190 299V388" stroke="#3b82c4" stroke-width="9"/>
  <path d="M148 390V453" fill="none" stroke="#3b82c4" stroke-width="7" stroke-linecap="round" marker-end="url(#blueArrow)"/>
  <path d="M122 412c-23 8-24 34 0 40M101 421c-19 10-17 28 1 35" fill="none" stroke="#9dc9df" stroke-width="6" stroke-linecap="round"/>
  <text x="155" y="79" text-anchor="middle" font-family="system-ui, sans-serif" font-size="31" font-weight="800" fill="#25364a">① 司机制动</text>
  <text x="155" y="113" text-anchor="middle" font-family="system-ui, sans-serif" font-size="25" fill="#52687c">让管里压力降低</text>
  <path d="M160 122C169 154 177 176 185 203" fill="none" stroke="#3b82c4" stroke-width="7" stroke-linecap="round" marker-end="url(#blueArrow)"/>

  <!-- 蓝色制动管贯穿列车；虚线箭头表示压力变化依次传播。 -->
  <path d="M75 389H1028M1080 389H1145" fill="none" stroke="#3b82c4" stroke-width="14" stroke-linecap="round"/>
  <path d="M230 389H965" fill="none" stroke="#dff2fb" stroke-width="5" stroke-dasharray="20 18" marker-end="url(#blueArrow)"/>
  <text x="720" y="103" text-anchor="middle" font-family="system-ui, sans-serif" font-size="25" font-weight="700" fill="#25364a">“压力降低”的信号沿制动管传播</text>

  <!-- 每节车都用自己的储风缸推动制动缸。 -->
  <g font-family="system-ui, sans-serif" text-anchor="middle">
    <g transform="translate(425)">
      <circle cx="0" cy="389" r="25" fill="#fff" stroke="#25364a" stroke-width="6"/>
      <text x="0" y="398" font-size="25" font-weight="800" fill="#25364a">阀</text>
      <rect x="-112" y="456" width="115" height="48" rx="24" fill="#9dc9df" stroke="#25364a" stroke-width="6"/>
      <rect x="40" y="456" width="91" height="48" rx="13" fill="#f2b27f" stroke="#25364a" stroke-width="6"/>
      <path d="M-1 480H38" stroke="#d97848" stroke-width="7" marker-end="url(#orangeArrow)"/>
      <path d="M131 480 166 505" stroke="#25364a" stroke-width="8" stroke-linecap="round"/>
    </g>
    <g transform="translate(766)">
      <circle cx="0" cy="389" r="25" fill="#fff" stroke="#25364a" stroke-width="6"/>
      <text x="0" y="398" font-size="25" font-weight="800" fill="#25364a">阀</text>
      <rect x="-112" y="456" width="115" height="48" rx="24" fill="#9dc9df" stroke="#25364a" stroke-width="6"/>
      <rect x="40" y="456" width="91" height="48" rx="13" fill="#f2b27f" stroke="#25364a" stroke-width="6"/>
      <path d="M-1 480H38" stroke="#d97848" stroke-width="7" marker-end="url(#orangeArrow)"/>
      <path d="M131 480 166 505" stroke="#25364a" stroke-width="8" stroke-linecap="round"/>
    </g>
  </g>
  <g font-family="system-ui, sans-serif" font-size="24" font-weight="700" text-anchor="middle" fill="#25364a">
    <text x="368" y="540">本车储风</text><text x="510" y="540">制动缸</text>
    <text x="709" y="540">本车储风</text><text x="851" y="540">制动缸</text>
  </g>
  <g transform="translate(305 572)">
    <rect width="590" height="62" rx="31" fill="#fff" stroke="#d97848" stroke-width="5"/>
    <text x="295" y="42" text-anchor="middle" font-family="system-ui, sans-serif" font-size="29" font-weight="800" fill="#25364a">② 每节车厢都把自己的刹车推上去</text>
  </g>

  <!-- 断管也会使压力下降，因此自动空气制动具有趋向安全的特性。 -->
  <path d="M1030 372l20 17-20 17M1078 372l-20 17 20 17" fill="none" stroke="#d95d4f" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M1054 418V472" fill="none" stroke="#3b82c4" stroke-width="7" stroke-linecap="round" marker-end="url(#blueArrow)"/>
  <path d="M1090 429c28 2 34 26 13 39M1112 443c22 8 20 29 2 36" fill="none" stroke="#9dc9df" stroke-width="6" stroke-linecap="round"/>
  <text x="1058" y="535" text-anchor="middle" font-family="system-ui, sans-serif" font-size="26" font-weight="800" fill="#25364a">③ 断管漏气</text>
  <text x="1058" y="568" text-anchor="middle" font-family="system-ui, sans-serif" font-size="23" fill="#52687c">也会自动刹车</text>
</svg>
