<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">跨座式单轨骑在轨道梁上</title>
  <desc id="desc">正面剖面图中，车体从两边包住一根宽梁。两只大承重轮落在梁顶，左右各一只较小的导向轮贴近梁侧，轮子没有穿进梁里。</desc>
  <rect width="1200" height="675" rx="34" fill="#fff9ed"/>

  <!-- U 形车体围住中央轨道梁。 -->
  <path fill="#4f9bd8" fill-rule="evenodd" stroke="#25364a" stroke-width="11" stroke-linejoin="round" d="M200 505V230Q200 28 402 28H798Q1000 28 1000 230V505H790V350Q790 250 690 250H510Q410 250 410 350V505ZM305 230Q305 102 433 102H767Q895 102 895 230V270H305Z"/>
  <path d="M455 103V270M600 103V250M745 103V270" stroke="#25364a" stroke-width="7"/>
  <path d="M305 230Q305 102 433 102H767Q895 102 895 230V270H305Z" fill="#dff2fb" stroke="#25364a" stroke-width="8"/>
  <path d="M455 103V270M600 103V250M745 103V270" stroke="#25364a" stroke-width="7"/>

  <!-- 梁与桥墩。 -->
  <path d="M510 310H690V675H510Z" fill="#b9c4cd" stroke="#25364a" stroke-width="10"/>
  <path d="M492 310H708" stroke="#eef3f7" stroke-width="18" stroke-linecap="round"/>
  <path d="M600 598V675" stroke="#9a7558" stroke-width="88"/>

  <!-- 承重轮的最低点正好落在梁顶；导向轮外缘正好接近梁侧。 -->
  <g fill="#465d73" stroke="#25364a" stroke-width="9">
    <circle cx="555" cy="250" r="60"/><circle cx="645" cy="250" r="60"/>
    <circle cx="465" cy="405" r="45"/><circle cx="735" cy="405" r="45"/>
  </g>
  <g fill="#ffd166" stroke="#25364a" stroke-width="7">
    <circle cx="555" cy="250" r="19"/><circle cx="645" cy="250" r="19"/>
    <circle cx="465" cy="405" r="16"/><circle cx="735" cy="405" r="16"/>
  </g>
  <g font-family="sans-serif" font-size="34" font-weight="700" text-anchor="middle" fill="#25364a">
    <text x="600" y="190">承重轮</text><text x="600" y="548">导向轮</text>
  </g>
</svg>
