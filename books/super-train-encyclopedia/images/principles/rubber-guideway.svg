<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">胶轮列车怎样沿导向路面行驶</title>
  <desc id="desc">正面剖面图中，两只大的承重橡胶轮压在左右走行面上；两只较小的侧导向轮靠近两边竖直导向面，帮助列车沿路线前进。</desc>
  <rect width="1200" height="675" rx="34" fill="#fff9ed"/>
  <path d="M65 610H1135" stroke="#d8c5a9" stroke-width="78" stroke-linecap="round"/>
  <path d="M125 565H445M755 565H1075" stroke="#b9c4cd" stroke-width="44" stroke-linecap="round"/>
  <path d="M105 345V580M1095 345V580" stroke="#b9c4cd" stroke-width="46" stroke-linecap="round"/>

  <path d="M205 485V230Q205 28 407 28H793Q995 28 995 230V485Z" fill="#55b68b" stroke="#25364a" stroke-width="11"/>
  <path d="M305 230Q305 102 433 102H767Q895 102 895 230V284H305Z" fill="#dff2fb" stroke="#25364a" stroke-width="8"/>
  <path d="M455 103V284M600 103V284M745 103V284" stroke="#25364a" stroke-width="7"/>
  <rect x="282" y="407" width="636" height="80" rx="28" fill="#25364a"/>

  <g fill="#465d73" stroke="#25364a" stroke-width="10">
    <circle cx="360" cy="518" r="86"/><circle cx="840" cy="518" r="86"/>
    <circle cx="169" cy="428" r="52"/><circle cx="1031" cy="428" r="52"/>
  </g>
  <g fill="#ffd166" stroke="#25364a" stroke-width="7">
    <circle cx="360" cy="518" r="25"/><circle cx="840" cy="518" r="25"/>
    <circle cx="169" cy="428" r="17"/><circle cx="1031" cy="428" r="17"/>
  </g>
  <g font-family="sans-serif" font-size="34" font-weight="700" text-anchor="middle" fill="#25364a">
    <text x="600" y="370">承重轮在下面</text>
    <text x="600" y="655">导向轮在两边</text>
  </g>
</svg>
