<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">轮缘怎样帮助车轮留在轨道上</title>
  <desc id="desc">两幅正面剖面图。车轮居中时两边轮缘都和钢轨留有小缝；轮对偏向右边时，右侧轮缘靠近钢轨，帮助车轮回到合适位置。</desc>
  <rect width="1200" height="675" rx="34" fill="#fff9ed"/>
  <path d="M600 70V610" stroke="#d8c5a9" stroke-width="6" stroke-dasharray="18 18"/>

  <g font-family="sans-serif" font-size="38" font-weight="700" text-anchor="middle" fill="#25364a">
    <text x="300" y="86">居中</text>
    <text x="900" y="86">偏向一侧</text>
  </g>

  <!-- 左：轮对居中，两侧轮缘都与钢轨留有余量。 -->
  <g>
    <path d="M150 265H450" stroke="#25364a" stroke-width="34" stroke-linecap="round"/>
    <g fill="#4f9bd8" stroke="#25364a" stroke-width="10" stroke-linejoin="round">
      <path d="M128 155H228Q246 155 246 176V420H270V486H225V438H128Q110 438 110 420V176Q110 155 128 155Z"/>
      <path d="M472 155H372Q354 155 354 176V420H330V486H375V438H472Q490 438 490 420V176Q490 155 472 155Z"/>
    </g>
    <g fill="#667687" stroke="#25364a" stroke-width="9">
      <path d="M135 438H225V474H135Z"/>
      <path d="M375 438H465V474H375Z"/>
      <path d="M148 474H212L232 570H128Z"/>
      <path d="M388 474H452L472 570H368Z"/>
    </g>
    <path d="M270 474H232" stroke="#3e9a78" stroke-width="8" stroke-linecap="round" stroke-dasharray="8 11"/>
    <path d="M330 474H368" stroke="#3e9a78" stroke-width="8" stroke-linecap="round" stroke-dasharray="8 11"/>
  </g>

  <!-- 右：钢轨不动，整根轮对向右偏，右轮缘接近右轨内侧。 -->
  <g>
    <path d="M774 265H1074" stroke="#25364a" stroke-width="34" stroke-linecap="round"/>
    <g fill="#4f9bd8" stroke="#25364a" stroke-width="10" stroke-linejoin="round">
      <path d="M752 155H852Q870 155 870 176V420H894V486H849V438H752Q734 438 734 420V176Q734 155 752 155Z"/>
      <path d="M1096 155H996Q978 155 978 176V420H954V486H999V438H1096Q1114 438 1114 420V176Q1114 155 1096 155Z"/>
    </g>
    <g fill="#667687" stroke="#25364a" stroke-width="9">
      <path d="M735 438H825V474H735Z"/>
      <path d="M975 438H1065V474H975Z"/>
      <path d="M748 474H812L832 570H728Z"/>
      <path d="M988 474H1052L1072 570H968Z"/>
    </g>
    <path d="M894 474H832" stroke="#3e9a78" stroke-width="8" stroke-linecap="round" stroke-dasharray="8 11"/>
    <circle cx="959" cy="472" r="13" fill="#3e9a78" stroke="#25364a" stroke-width="5"/>
  </g>

  <path d="M85 585H515M685 585H1115" stroke="#d8c5a9" stroke-width="26" stroke-linecap="round"/>
</svg>
