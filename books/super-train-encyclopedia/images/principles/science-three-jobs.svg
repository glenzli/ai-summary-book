<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">火车科学的三项任务</title>
  <desc id="desc">从左到右依次是得到动力、沿线路走和安全停下。动力入口包括蒸汽、柴油和外部供电；导向方式包括钢轮钢轨、单轨和磁浮；安全部分包括制动与信号。</desc>
