<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">齿轮怎样咬住齿轨爬坡</title>
  <desc id="desc">山地列车沿斜坡上行，车底中央的黄色齿轮与两条普通钢轨之间的齿轨啮合。左上角放大图显示轮齿嵌进齿轨的空隙。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 20 20" refX="18" refY="10" markerWidth="30" markerHeight="30" markerUnits="userSpaceOnUse" orient="auto"><path d="M2 2 18 10 2 18Z" fill="#d95d4f"/></marker>
  </defs>
  <rect width="1200" height="675" rx="34" fill="#fff9ed"/>

  <!-- 放大镜：齿轮的齿插进齿条之间。 -->
  <circle cx="260" cy="200" r="146" fill="#fffdf6" stroke="#25364a" stroke-width="9"/>
  <g transform="translate(260 135)" fill="#ffd166" stroke="#25364a" stroke-width="7">
    <circle r="72"/>
    <circle r="22" fill="#fff9ed"/>
    <g>
      <rect x="-14" y="-103" width="28" height="42" rx="6"/>
      <rect x="-14" y="61" width="28" height="42" rx="6"/>
      <rect x="61" y="-14" width="42" height="28" rx="6"/>
      <rect x="-103" y="-14" width="42" height="28" rx="6"/>
      <rect x="-14" y="-103" width="28" height="42" rx="6" transform="rotate(45)"/>
      <rect x="-14" y="-103" width="28" height="42" rx="6" transform="rotate(90)"/>
      <rect x="-14" y="-103" width="28" height="42" rx="6" transform="rotate(135)"/>
    </g>
  </g>
  <path d="M119 277H401V316H119Z" fill="#667687" stroke="#25364a" stroke-width="8"/>
  <path d="M135 277l18-34 18 34 18-34 18 34 18-34 18 34 18-34 18 34 18-34 18 34 18-34 18 34 18-34 18 34" fill="#667687" stroke="#25364a" stroke-width="8" stroke-linejoin="round"/>
  <text x="260" y="385" font-family="sans-serif" font-size="36" font-weight="700" text-anchor="middle" fill="#25364a">齿齿相扣</text>

  <!-- 主图整体旋转，齿轮的最低点与中央齿轨相接。 -->
  <g transform="translate(710 400) rotate(-23.4)">
    <path d="M-510 160H500" stroke="#667687" stroke-width="26" stroke-linecap="round"/>
    <path d="M-510 232H500" stroke="#667687" stroke-width="26" stroke-linecap="round"/>
    <path d="M-500 196H490" stroke="#9a7558" stroke-width="14" stroke-dasharray="7 26"/>
    <path d="M-495 197h990" stroke="#ffd166" stroke-width="20" stroke-dasharray="24 11" stroke-linecap="butt"/>

    <path d="M-310 104V-92Q-310-168-234-168H205Q302-168 335-73L370 104Z" fill="#ef6a5b" stroke="#25364a" stroke-width="11"/>
    <path d="M-220-126H182Q250-126 285-47H-262Q-251-103-220-126Z" fill="#dff2fb" stroke="#25364a" stroke-width="8"/>
    <path d="M-58-126V-47M112-126V-47" stroke="#25364a" stroke-width="7"/>
    <g fill="#465d73" stroke="#25364a" stroke-width="9">
      <circle cx="-205" cy="111" r="61"/>
      <circle cx="245" cy="111" r="61"/>
    </g>
    <g fill="#ffd166" stroke="#25364a" stroke-width="7">
      <circle cx="-205" cy="111" r="20"/>
      <circle cx="245" cy="111" r="20"/>
    </g>
    <g transform="translate(15 134)" fill="#ffd166" stroke="#25364a" stroke-width="7">
      <circle r="50"/>
      <circle r="17" fill="#fff9ed"/>
