<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">两层弹簧和减振器让车身更平稳</title>
  <desc id="desc">侧面剖视图展示车轮、转向架和车身。车轮冲击先经过一系弹簧，再经过二系空气弹簧和减振器，传到车身时已经减小。</desc>
