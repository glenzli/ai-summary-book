      <path d="M3 3 21 12 3 21Z" fill="#d95d4f"/>
    </marker>
    <marker id="softArrow" viewBox="0 0 24 24" refX="21" refY="12" markerWidth="24" markerHeight="24" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M3 3 21 12 3 21Z" fill="#3b82c4"/>
    </marker>
  </defs>
  <rect width="1200" height="675" rx="34" fill="#fff9ed"/>

